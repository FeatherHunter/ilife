<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青椒肉丝录入回执</title>
<style>/* base-paint 共享样式资产 · ilife-base · v0.1.0 */
:root {
  --fg: #1d1d1f;
  --fg2: #6e6e73;
  --fg3: #86868b;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: #d2d2d7;
  --blue: #007aff;
  --blue2: #0a63ce;
  --soft: #f5f8ff;
  --ok: #34c759;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06);
}
/* toast */
.ilife-toast-stack {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  pointer-events: none;
}
.ilife-toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-sizing: border-box;
  min-width: 300px;
  max-width: 480px;
  padding: 13px 14px 13px 16px;
  border-radius: 14px;
  background: rgba(28, 28, 30, .94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0;
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 255, 255, .08) inset;
  font-size: 13px;
  line-height: 1.4;
  font-feature-settings: "tnum";
  pointer-events: auto;
  animation: ilife-toast-in .22s cubic-bezier(.34, 1.56, .64, 1) both;
}
@keyframes ilife-toast-in {
  from {
    opacity: 0;
    transform: scale(.9) translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.ilife-toast-danger {
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 59, 48, .45) inset;
}
.ilife-toast-icon {
  flex: 0 0 auto;
  padding-top: 1px;
  font-size: 18px;
  line-height: 1;
}
.ilife-toast-body {
  flex: 1 1 auto;
  min-width: 0;
}
.ilife-toast-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ilife-toast-title {
  margin-bottom: 2px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}
.ilife-toast-title-detail {
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.5;
}
.ilife-toast-chip {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.6;
}
.ilife-toast-chip-ok {
  background: rgba(52, 199, 89, .18);
  color: #4dd96b;
}
.ilife-toast-chip-warn {
  background: rgba(255, 149, 0, .18);
  color: #ffb340;
}
.ilife-toast-chip-danger {
  background: rgba(255, 59, 48, .18);
  color: #ff6961;
}
.ilife-toast-count {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .08);
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ilife-toast-detail {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.5;
}
.ilife-toast-lines {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.ilife-toast-code {
  margin: 6px 0 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, .32);
  color: #aeb0b8;
  font-family: "SF Mono", monospace;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
  max-height: 140px;
  overflow: auto;
}
.ilife-toast-act {
  margin: 0;
  padding: 2px 4px;
  border: 0;
  background: none;
  color: #4dd96b;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-toast-act:active {
  opacity: .7;
}
.ilife-toast-close {
  flex-shrink: 0;
  margin: 0 0 0 6px;
  padding: 5px 9px;
  border: 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, .10);
  color: #34c759;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-toast-act:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ilife-toast-close:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
@media (max-width: 820px) {
  .ilife-toast-stack {
    left: 12px;
    right: 12px;
    transform: none;
    align-items: stretch;
  }
  .ilife-toast {
    min-width: 0;
    max-width: none;
  }
}
/* action-bar */
.ilife-action-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  margin: 12px 0;
  max-width: 520px;
}
@media (min-width: 641px) {
  .ilife-action-bar {
    max-width: none;
  }
}
.ilife-action-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.ilife-action-row-ghost {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (max-width: 820px) {
  .ilife-action-row-ghost {
    position: relative;
  }
}
.ilife-action-row-ghost-single > .ilife-copy-btn {
  grid-column: 1 / -1;
}
.ilife-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-action-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-action-btn-red {
  background: #ff3b30;
  color: var(--card);
}
.ilife-action-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
.ilife-action-btn[disabled],
.ilife-action-btn:disabled {
  opacity: 1;
  border-color: var(--line);
  background: var(--soft);
  color: var(--fg3);
  cursor: not-allowed;
}
@media (max-width: 820px) {
  .ilife-action-btn {
    min-height: 44px;
  }
}
.ilife-action-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* copy-button */
.ilife-copy-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), background-color .2s ease;
}
.ilife-copy-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-copy-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
.ilife-copy-btn-wide {
  width: 100%;
}
.ilife-copy-btn:active {
  transform: scale(.96);
}
.ilife-copy-btn.copied {
  border-color: var(--ok);
  background: var(--ok);
  color: var(--card);
}
.ilife-copy-btn[disabled],
.ilife-copy-btn:disabled {
  opacity: 1;
  border-color: var(--line);
  background: var(--soft);
  color: var(--fg3);
  cursor: not-allowed;
}
.ilife-copy-btn[disabled]:active,
.ilife-copy-btn:disabled:active {
  transform: none;
}
@media (max-width: 820px) {
  .ilife-copy-btn {
    min-height: 44px;
  }
}
.ilife-copy-menu-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn {
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  content: "";
  width: 0;
  height: 0;
  margin-left: 6px;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
  transition: transform .16s ease-out;
}
.copy-menu-open.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  transform: rotate(180deg);
}
.ilife-copy-menu {
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  z-index: 20;
  min-width: 200px;
  box-sizing: border-box;
  max-width: calc(100vw - 32px);
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .16s ease-out, visibility .16s ease-out;
}
.copy-menu-open.ilife-copy-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.ilife-copy-menu-item {
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-copy-menu-item:hover {
  background: var(--soft);
}
.ilife-copy-menu-item > .ilife-copy-menu-label {
  color: var(--fg);
  font-size: 13px;
}
.ilife-copy-menu-item > .ilife-copy-menu-hint {
  color: var(--fg2);
  font-size: 11px;
  white-space: nowrap;
}
@media (max-width: 820px) {
  .ilife-copy-menu-item {
    min-height: 44px;
  }
  .ilife-copy-menu-wrap {
    position: static;
  }
  .ilife-copy-menu {
    left: 0;
    right: 0;
    width: auto;
    min-width: 0;
    max-width: none;
  }
}
.ilife-copy-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* status-badge */
.ilife-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.6;
  width: fit-content;
}
.ilife-status-badge-ok {
  background: #e6f7ec;
  color: #1f8c3d;
}
.ilife-status-badge-warn {
  background: #fff5e0;
  color: #a25b00;
}
.ilife-status-badge-danger {
  background: #fff0ee;
  color: #a83228;
}
.ilife-status-badge-empty {
  background: #f0f0f3;
  color: var(--fg2);
}
/* empty-state */
.ilife-empty {
  padding: 48px 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  text-align: center;
  color: var(--fg2);
}
.ilife-empty-icon {
  font-size: 28px;
  line-height: 1.2;
  opacity: .5;
}
.ilife-empty-text {
  margin-top: 8px;
  color: var(--fg);
  font-size: 18px;
  font-weight: 600;
}
.ilife-empty-hint {
  margin-top: 4px;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-empty-action {
  margin-top: 16px;
}
/* error-receipt */
.ilife-error:has(> .ilife-error-title) {
  margin: 12px 0;
  padding: 20px 22px;
  border: 1px solid rgba(255, 59, 48, .28);
  border-radius: 14px;
  background: rgba(255, 59, 48, .06);
  color: var(--fg);
}
.ilife-error-title {
  margin-bottom: 14px;
  color: #a83228;
  font-size: 15px;
  font-weight: 700;
}
.ilife-error-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  row-gap: 14px;
  column-gap: 8px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}
.ilife-error-actions > .ilife-copy-btn-wide {
  grid-column: 1 / -1;
}
@media (max-width: 820px) {
  .ilife-error:has(> .ilife-error-title) {
    padding: 16px 14px;
  }
}
/* charts */
.ilife-charts{position:relative;margin:0;padding:0;box-sizing:border-box;font-family:inherit;color:var(--fg,#1d1d1f);--ilife-charts-dot:9px}
.ilife-charts *{box-sizing:border-box}
.ilife-charts-svg{display:block;width:100%;height:auto;overflow:visible}
.ilife-charts-empty{padding:0}
.ilife-charts-anim .ilife-charts-line{transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-bar{transition:height .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-fillbar{transition:width .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-dot{animation:ilife-charts-fade .5s ease both}
@keyframes ilife-charts-fade{from{opacity:0}to{opacity:1}}
.ilife-charts-dot{pointer-events:none}
.ilife-charts-dot-anomaly{filter:drop-shadow(0 0 3px rgba(255,59,48,.18))}
.ilife-charts-markpoint{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.ilife-charts-scatter .ilife-charts-dot{r:calc(var(--ilife-charts-dot) / 2)}
.ilife-charts-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;line-height:1.5;color:var(--fg2,#6e6e73)}
.ilife-charts-legend-right{flex-direction:column;align-items:flex-start}
.ilife-charts-legend-bottom{flex-direction:row;justify-content:center}
.ilife-charts-legend-item{display:inline-flex;align-items:center;gap:6px}
.ilife-charts-legend-swatch{display:inline-block;width:8px;height:8px;border-radius:2px}
.ilife-charts-legend-swatch-dashed{background:repeating-linear-gradient(90deg,var(--fg3,#86868b) 0 4px,transparent 4px 8px)}
.ilife-charts-legend-value{color:var(--fg,#1d1d1f)}
.ilife-charts-legend-pct{color:var(--fg3,#86868b)}
.ilife-charts-pct{display:block;font-size:12px;color:var(--fg2,#6e6e73);text-align:right}
.ilife-charts-progress .ilife-charts-svg{min-height:12px}
.ilife-charts-spark-value{font-size:11px}
.ilife-charts-tick{font-size:9.5px}
.ilife-charts-xlabel{font-size:10px}
.ilife-charts-value{font-size:10px}
.ilife-charts-value-last{font-size:10.5px;font-weight:700}
.ilife-charts-line .ilife-charts-value-last{paint-order:stroke;stroke:var(--bg,#fff);stroke-width:3px;stroke-linejoin:round}
.ilife-charts-marktext{font-size:10px}
.ilife-charts-marktext-v{font-size:10px}
.ilife-charts-mptext{font-size:10.5px;font-weight:700}
.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}
.ilife-charts-bar .ilife-charts-value{font-size:10px}
.ilife-charts-center-label{font-size:8px}
.ilife-charts-center-value{font-size:13px;font-weight:700}
.ilife-charts-gauge-value{font-size:26px;font-weight:800}
.ilife-charts-gauge-label{font-size:11px}
@media (max-width:720px){.ilife-charts{--ilife-charts-dot:8px}.ilife-charts-line .ilife-charts-svg{height:auto}.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}.ilife-charts-legend{font-size:11.5px}.ilife-charts-line .ilife-charts-tick{font-size:19.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:19.4px}.ilife-charts-line .ilife-charts-value{font-size:19.4px}.ilife-charts-line .ilife-charts-value-last{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:19.4px}}
@media (min-width:721px) and (max-width:875px){.ilife-charts-line .ilife-charts-tick{font-size:12.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:12.4px}.ilife-charts-line .ilife-charts-value{font-size:12.4px}.ilife-charts-line .ilife-charts-value-last{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:12.4px}}
@media (min-width:876px){.ilife-charts-line .ilife-charts-tick{font-size:10.8px}.ilife-charts-line .ilife-charts-xlabel{font-size:10.8px}.ilife-charts-line .ilife-charts-value{font-size:10.8px}.ilife-charts-line .ilife-charts-value-last{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext-v{font-size:10.8px}}
/* help-shell */
.ilife-help-shell {
  display: block;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  color: var(--fg);
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-feature-settings: "tnum";
}
.ilife-help-shell-hero {
  margin-bottom: 20px;
}
.ilife-help-shell-eyebrow {
  margin: 0;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ilife-help-shell-title {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.2;
}
.ilife-help-shell-subtitle {
  margin: 6px 0 0;
  color: var(--fg2);
  font-size: 15px;
}
.ilife-help-shell-lead {
  margin: 4px 0 0;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-help-shell-init {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
}
.ilife-help-shell-init-title {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.ilife-help-shell-init-subtitle {
  margin: 4px 0 0;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-prompt {
  margin: 8px 0 0;
  padding: 12px;
  border-radius: 8px;
  background: var(--soft);
  color: var(--fg2);
  font-family: "SF Mono", monospace;
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-x: auto;
}
.ilife-help-shell-init-steps {
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-step {
  margin: 2px 0;
}
.ilife-help-shell-tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}
.ilife-help-shell-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.ilife-help-shell-tab-icon {
  font-size: 14px;
}
.ilife-help-shell-tab-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.ilife-help-shell-pages {
  display: block;
}
.ilife-help-shell-page {
  display: block;
}
.ilife-help-shell-page-body {
  display: none;
}
.ilife-help-shell-tab-input:checked + .ilife-help-shell-page-body {
  display: block;
}
.ilife-help-shell-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ilife-help-shell-card {
  display: block;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.ilife-help-shell-card-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ilife-help-shell-card-title {

/* base-paint 区块样式资产 · #104 · 12 区 */
/* block-page-shell */
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.ilife-block-page-shell {
  display: block;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  color: var(--fg);
  font-feature-settings: "tnum";
}
.ilife-block-page-shell-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  margin: 0;
  color: var(--blue2);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ilife-block-page-shell-eyebrow-app {
  color: var(--fg2);
}
.ilife-block-page-shell-eyebrow-scope {
  color: var(--blue2);
}
.ilife-block-page-shell-eyebrow > span + span {
  padding-left: 8px;
  margin-left: 8px;
  border-left: 1px solid rgba(210, 210, 215, .6);
}
.ilife-block-page-shell-title {
  margin: 8px 0 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.2;
}
.ilife-block-page-shell-subtitle {
  margin: 8px 0 0;
  color: var(--fg2);
  font-size: 15px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.ilife-block-page-shell:not(:has(> .ilife-block-page-shell-subtitle)) > .ilife-block-page-shell-title {
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.ilife-block-page-shell-body {
  display: block;
  margin-top: 16px;
}
.ilife-block-page-shell-body > * + .ilife-block {
  margin-top: 16px;
}
@media (max-width: 640px) {
  .ilife-block-page-shell {
    padding: 20px 16px 60px;
  }
  .ilife-block-page-shell-title {
    font-size: 22px;
  }
}
.ilife-block-toc {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 16px;
}
.ilife-block-toc a {
  display: inline-flex;
  align-items: center;
  box-sizing: border-box;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--blue2);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.ilife-block-toc a:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ilife-block-caliber {
  margin: 0 0 8px;
  color: var(--fg2);
  font-size: 12px;
  line-height: 1.5;
}
.ilife-block-caliber:has(> span) {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: baseline;
}
.ilife-block-caliber > span + span {
  padding-left: 8px;
  border-left: 1px solid rgba(210, 210, 215, .6);
}
.ilife-block-conclusion {
  margin: 0 0 16px;
  padding: 12px 16px;
  border-left: 3px solid var(--blue);
  border-radius: 14px;
  background: var(--card);
  color: var(--blue2);
  font-size: 15px;
  font-weight: 600;
}
.ilife-block-prose {
  margin: 8px 0 0;
  color: var(--fg);
  font-size: 15px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.ilife-block-copy-block-hint {
  margin: 0 0 8px;
  color: var(--fg2);
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.ilife-block-op-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin: 16px 0;
  padding: 14px;

  border-left: 4px solid var(--line);
  border-radius: 14px;
  background: var(--card);

.ilife-block-op-head-ok {

}

.ilife-block-op-head-danger {

@media print {

/* #525 页面级移动端配方 · 只对根类 .ilife-page-ui 的页面生效 */
/* ① 图片与矢量图兜底：任何一张图都不许撑破容器（结果型页面的第一类溢出源）。 */
.ilife-page-ui img,
.ilife-page-ui svg {
  max-width: 100%;
}
.ilife-page-ui img {
  height: auto;
}
/* ② 复制区债之一（**置灰规则的定义地已上移到 `style.ts` 的 `copyButton` 区**——
   它对所有页面都成立，不属「移动端配方」，故本件不再重述第二条：同一件事只留一个定义地）。
   本件只在窄屏把命中高度补齐；宽度档的 44px 由 `ACTION_BAR_DEFAULTS.minHeightPx` 统一给。 */
/* ③ 页内定位：带 id 的区块被锚点跳转命中时，标题与视口顶留 20px（不贴着边缘）。 */
.ilife-page-ui .ilife-block-page-shell-body > *[id] {
  scroll-margin-top: 20px;
}
/* ④ 表格：列数极多的表仍可横滑时的兜底（细滚动条＋触屏惯性）。 */
.ilife-page-ui .ilife-block-data-table {
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
/* ⑤ 触摸区：**全宽档**所有页内可点元素命中区 ≥44×44px。
   #525 收口：这一条原来只在 ≤820 那条媒体查询里，实测 1440 档样板页的页内导航（`a`）
   只有 27px 高 —— 44px 是**全宽档**口径（与 `.ilife-copy-btn` 同值），故移出媒体查询。
   只加 `min-height` 与最小内距，不动任何既有选择器的语义。 */
.ilife-page-ui .ilife-copy-btn,
.ilife-page-ui .ilife-copy-menu-item,
.ilife-page-ui .ilife-action-btn,
.ilife-page-ui .ilife-block-disclosure-summary,
.ilife-page-ui .ilife-block-param-form-input,
.ilife-page-ui .ilife-block-toc a {
  min-height: 44px;
}
/* 页内导航按胶囊排（inline 元素上 min-height 不生效，须转 inline-flex）。 */
.ilife-page-ui .ilife-block-toc a {
  display: inline-flex;
  align-items: center;
  padding-top: 0;
  padding-bottom: 0;
}
/* ⑥ 窄屏（≤640）：安全区留白、字号节奏、读数卡栅格、页内导航横滑、表格卡片化。 */
@media (max-width: 640px) {
  /* 安全区：手机横放与「小白条」机型上正文不许贴边；页脚留 60px 与 HELP 640 档逐值同。 */
  .ilife-page-ui .ilife-block-page-shell {
    padding: 20px max(16px, env(safe-area-inset-right, 0px))
      calc(60px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  /* 字号下限：正文类文本一档不落（表格单元格／口径行／列表行／事实条标签 ≥12px）。 */
  .ilife-page-ui .ilife-block-caliber,
  .ilife-page-ui .ilife-block-list-rows-row,
  .ilife-page-ui .ilife-block-kpi-card-detail {
    font-size: 12px;
  }
  /* 读数卡：两格并排（150px 下限在 358px 可用宽里正好两格，不再被 auto-fit 挤成三格）。 */
  .ilife-page-ui .ilife-block-kpi-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .ilife-page-ui .ilife-block-kpi-card {
    padding: 12px;
  }
  /* 页内导航：一条横滑的胶囊轨（换行会把标题挤出首屏；横滑不占纵向高度）。 */
  .ilife-page-ui .ilife-block-toc {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .ilife-page-ui .ilife-block-toc a {
    flex: 0 0 auto;
  }
  /* 表格卡片化：每个数据格带列头文本（`td[data-label]`，由 `renderDataTable` 写入）时，
     窄屏把「一行多列」摊成「一格两行：列头 ＋ 值」，列头不再挤在 390px 里。
     属性缺席时本段全部是空选择器 ⇒ 自动退回 #457 的紧凑表形态，不静默出错。 */
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) .ilife-block-data-table-table,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tbody,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td {
    display: block;
    width: auto;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) thead {
    display: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr {
    padding: 4px 0;
    border-top: 1px solid rgba(210, 210, 215, .6);
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr:first-child {
    border-top: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3px 10px;
    border-bottom: 0;
    text-align: left;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td::before {
    content: attr(data-label);
    flex: 0 0 auto;
    color: var(--fg2);
    font-size: 12px;
    font-weight: 600;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td.ilife-block-data-table-cell-right {
    min-width: 0;
  }
}
/* ⑦ 原「≤400 档：读数卡塌单列」这一条**已撤**（#728 逐页审计）。
   撤因（多席独立量到）：主流手机宽 390 正落在 `max-width: 400` 里 ⇒ ⑥ 那条「两格并排」
   在 390 上**永远不生效**，8 张读数卡一路单列排下去、吃掉整页 40～45% 的高度
   （实测卡块 y313..1164＝852px，是视口 844px 的 1.01 倍），而卡里往往只放「未给」「1 笔」这种两三个字。
   两格并排后同一批卡约占 17%；320 档每格仍有 1fr 兜底、值不裁（`overflow-wrap` 在卡值位已有）。
   这是本配方**唯一**一条被撤掉的规则，撤的是档位不是能力（⑥ 的两格并排就是它的替代）。 */
   #728 逐页审计实测（多席独立量到）：改前这类表在 ≤640 走 ⑥ 的卡片化，每一格都
   `td::before{content:attr(data-label)}` ⇒ 8 行的表在 390 档渲染成 **16 条列头线**
   （`哪一项 … 记录编号` / `记成什么 … 116`），表体 491px 里约 224px 是纯重复；
   同一张表在 1280 档只印一遍列头。判别器＝`thead tr > th:nth-child(2):last-child`
   （第二枚表头就是最后一枚 ⇒ 恰两列）。三列及以上的表（候选表、多列明细）一行不动。 */
@media (max-width: 640px) {
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) thead {
    display: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) table,
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tbody {
    display: block;
    width: auto;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tr {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(210, 210, 215, .6);
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tr:first-child {
    border-top: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td {
    display: block;
    width: auto;
    padding: 0;
    border-bottom: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td::before {
    content: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td:first-child {
    color: var(--fg2);
    font-weight: 600;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td:last-child {
    text-align: right;
    overflow-wrap: anywhere;
  }
}
/* 宽档同一张表：键贴左缘、值贴右缘。改前两列都靠左，880px 的卡里右侧约 736px（84%）是空的，
   8 行合计约 6000px 空白横线（多席逐像素量到）。 */
@media (min-width: 641px) {
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td:last-child {
    text-align: right;
  }
}
/* ⑧ 宽屏把可用宽用起来（#525 第二轮；来源＝#525 席位版面档重判里**双方都认的那一条**
   「1280 档没把宽屏用起来」，以及编排者 2026-09-15 的补记：页面模板 960 在 1280 档左右各空 140px）。
   口径＝「宽屏不空荡、正文不散」：页面模板从 `blocks.ts` 的 960（那儿是别票写集，本件不改它）
   放宽到 **1280**，正文收成 **880px 一列**居中，栅格类与真二维数据（读数卡／表／图／键值行／
   列表行）满铺可用宽。为什么用栅格而不是 12 条 `max-width`：正文类块在各票里长得不一样，
   靠「不漏掉某个类名」的清单法必然漏（第一版注入候选就漏了无类名的 `section`），
   栅格是**默认收窄、显式放宽**，漏不掉。
   `box-sizing: border-box` 是本条的前提：本仓没有 `*{box-sizing}` 全局复位（`blocks.ts` 的
   pageShell 区注明「不搬 HELP 那一条」），页面模板是 content-box ⇒ 不写它则 `max-width` 只管内容宽、
   实占 1320（1440 档左右各空 60，不是 80）。 */
@media (min-width: 1001px) {
  .ilife-page-ui .ilife-block-page-shell {
    box-sizing: border-box;
    max-width: 1280px;
  }
  .ilife-page-ui .ilife-block-page-shell-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 880px minmax(0, 1fr);
  }
  .ilife-page-ui .ilife-block-page-shell-body > * {
    grid-column: 2;
  }
  /* 宽的走满铺（`:where()` 保零权重，覆盖既有 `auto-fit` 时按「同权重、后出现」取胜） */
  .ilife-page-ui .ilife-block-page-shell-body > :where(
    .ilife-block-kpi-card-grid,
    .ilife-block-data-table,
    .ilife-block-chart-block,
    .ilife-block-detail-section,
    .ilife-block-list-rows
  ) {
    grid-column: 1 / -1;
  }
  /* #728 收口：页头三级（眉标／标题／副题）跟着正文列走。
     ⑧ 只把**正文**那层收成 880 居中，页头是它的兄弟节点 ⇒ 不写这一条，标题会贴在版心最左、
     正文居中，整页左右不对称（t728 复评实测：标题 x≈26、正文 x≈202）。
     只收宽屏档；窄屏页头与正文同为 16px 内距，本来就对齐。 */
  .ilife-page-ui .ilife-block-page-shell-eyebrow,
  .ilife-page-ui .ilife-block-page-shell-title,
  .ilife-page-ui .ilife-block-page-shell-subtitle {
    max-width: 880px;
    margin-left: auto;
    margin-right: auto;
  }
  /* 读数卡一行四张：960 档的 `auto-fit minmax(150px,1fr)` 只排得出 2 张，一行两张在宽屏上
     就是「右半边空着」。四张同高靠既有 `grid-auto-rows: 1fr`（本件不动它）。 */
  .ilife-page-ui .ilife-block-kpi-card-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
/* ⑨ 状态字抬到与正文同档（#525 第二轮票面第 3 条：状态类文字在手机档偏小）。
   390 档的徽章（`block-chip`）与读数卡说明（`block-kpi-card-detail`）都是 12px，与正文差 3px、
   与读数卡标签 12px 齐平 ⇒ 「状态」看不出是另一类信息。抬到 **13px**：
   ① 不越过正文 15px（层级仍在，不靠加粗抢戏）；② 高于 #524 基准 §3.2 的 390 档下限 12px 一档；
   ③ 与 HELP 侧 13px 那一档（`helpShell.ts` 常见档 13）逐值同。 */
.ilife-page-ui .ilife-block-chip,
.ilife-page-ui .ilife-block-kpi-card-detail {
  font-size: 13px;
}
/* ⑩ 提示块图标：`⚠️`／`✅` 这类**字形图标**在手机上小且糊（用户裁定第 5 条的同一类债）。
   根类之下把它换成**带文字的图标位**：字形隐去，底盘保留（`kind` 的语义色仍在），
   文字用 `font-size:0` 收起后由 `::after` 写一个可读的标签。
   只改观感：`aria-hidden` 的那颗字形本来就不参与朗读，标签是替代它的可见文字。
   选择器必须与 `blocks.ts` 640 档那条**同名同层**（`.block-feedback-block-note .…-icon`）：
   权重都是 3，本条在后 ⇒ 宽窄两档都盖得住（只用两颗类名会在 ≤640 档输给那条媒体查询）。
   **#733 改**：改前这条用 `font-size: 0` 收字形 ＋ `::after { content: "已完成" }` 把词画在屏幕上——
   词只活在 CSS 里（实测 32/32 页：产物里「已完成」只出现 1 次就是那行 `content:`，`<body>` 里 0 次）⇒
   不可选中、不可搜索、不可复制、屏读器读不到、打印与 PDF 取不到字。
   现在词由区块层写成**真文字节点**（`blocks.ts` 的 note 区，字形与词各一枚子件），
   本条只做「藏字形、显词」这一件事 ⇒ 屏幕上的样子与改前一模一样，词回到文档流里。 */
.ilife-page-ui .ilife-block-feedback-block-note .ilife-block-feedback-block-note-icon {
  width: auto;
  min-width: 44px;
  padding: 0 10px;
  border-radius: 999px;
  font-weight: 600;
}
.ilife-page-ui .ilife-block-feedback-block-note .ilife-block-feedback-block-note-icon-glyph {
  display: none;
}
.ilife-page-ui .ilife-block-feedback-block-note .ilife-block-feedback-block-note-icon-text {
  display: inline;
  font-size: 12px;
  line-height: 1;
}
/* ⑪ 桌面档（≥1001，与 ⑧ 同一条断点）：参数表单两列并排、读数卡与正文列同宽节奏。
   #728 实测的病：单列表单在 390 档每格约 350px 宽、到 1280 档被拉到版心宽（880px），
   读到的是「一列长条」而不是「一张要填的表」——桌面端「没有版式，只有一条宽度补丁」。
   两列把「一屏要填的格」收进一屏；说明句与预览位跨两列（它们不是一格）。
   只收本配方启用页（`pageUi` 是各包 opt-in 的开关），未启用的页一行不变。 */
@media (min-width: 1001px) {
  .ilife-page-ui .ilife-block-param-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 24px;
    align-items: start;
  }
  .ilife-page-ui .ilife-block-param-form-description,
  .ilife-page-ui .ilife-block-param-form-preview {
    grid-column: 1 / -1;
  }
}
/* ⑫ toast 关闭键的命中区：那一段（规则 ＋ 逐条记账）另立一件 `pageUiToast.ts`
   —— 本件加它会 366 LF、越过本包 `AGENTS.md` 钉的 350 LF 告警线；拆的口子也正好是
   层与层的接缝：本件管「版面与页内控件怎么摆」，那一件管「helpers 运行时注入的浮动件
   怎么摆」（后者挂在 document.body 下、不在版面根之内，连启用方式都多一道）。
   取值仍从本件的 `PAGE_LIMITS` 来，规则文本仍只有一处定义。 */
/* ⑫ toast 关闭键的命中区（全宽档；#870）。
   来源：#870 接线后，页面按钮的复制提示由公共层 helpers 出，而这个键是那一档里
   唯一一个视觉尺寸只有 26px 高的可点元素（实测 62×26，压 t849 §2「触摸档可点元素
   命中区 ≥44×44px，零不足」这条硬线）。
   做法照本仓 #642 的既有先例（HELP 外壳三个小关闭键）：**命中区用绝对定位的 ::after 覆盖层
   撑到 44×44，视觉尺寸一个字不动** —— 与直接把 min-height 抬到 44px 相比，它不改那个键在
   深色卡里的观感（卡高、字位都不动），只把可点面放大。
   ① 键自身 `position: relative`（**必需**：覆盖层绝对定位的锚点就是它；写成 static 的话锚点
      会落到视口，可点面跑到页角去）；`min-width` 只补横向。
   ② 覆盖层 `inset: 50% auto auto 50%` ＋ `translate(-50%,-50%)`：中心对齐、向外撑，
      不参与布局（绝对定位），故卡面尺寸逐值不变。
   ③ **本条的适用条件**：`.ilife-toast-stack` 与它里面每次弹出的 `.ilife-toast` 由 helpers
      运行时挂在 `document.body` 下（不在版面根之内）⇒ 想让本条命中，启用 pageUi 的整页装配
      要在 `document.body` 上带一颗同样的标记（本配方的 opt-in 开关本来就是「页面声明自己是
      pageUi 页」；带标记 ＝ 这一页接受本配方的全部行为）。
   ④ 与 `pageUi.ts` ⑤ 那条的分工：⑤ 管页内控件（`.copy-btn` 那一族），本件管 helpers 运行时
      **注入**的那一颗（它不在页内标记里，⑤ 的选择器扫不到）。 */
.ilife-page-ui .ilife-toast-close {
  position: relative;
  min-width: 44px;
}
.ilife-page-ui .ilife-toast-close::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
}

    box.setAttribute("aria-live", "polite");
    var icon = document.createElement("span");
    icon.className = ICON_CLASS;
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = bad ? ICON_FAIL : ICON_OK;
    var body = document.createElement("div");
    body.className = BODY_CLASS;
    var titleRow = document.createElement("div");
    titleRow.className = TITLE_ROW_CLASS;
    var title = document.createElement("span");
    title.className = TITLE_CLASS;
    title.textContent = bad ? msg : (fmt ? FORMAT_OK_MSG + "（" + fmt + "）" : msg);
    titleRow.appendChild(title);
    if (bad) {
      var chip = document.createElement("span");
      chip.className = CHIP_CLASS + " " + CHIP_DANGER_CLASS;
      chip.textContent = FAIL_BADGE;
      titleRow.appendChild(chip);
    }
    body.appendChild(titleRow);
    var detail = document.createElement("div");
    detail.className = DETAIL_CLASS;
    detail.textContent = bad ? FAIL_DETAIL : OK_DETAIL;
    body.appendChild(detail);
    box.appendChild(icon);
    box.appendChild(body);
    var close = document.createElement("button");
    close.type = "button";
    close.className = CLOSE_CLASS;
    close.textContent = CLOSE_LABEL;
    box.appendChild(close);
    host.appendChild(box);
    while (host.children.length > cap) host.removeChild(host.children[0]);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, TIMEOUT_MS);
  }

  function initHelpShell() {
    var shell = document.querySelector(SHELL_SEL);
    if (!shell) return;
    var cards = allOf(shell, "." + CARD_CLASS);
    if (cards.length === 0) return;
    injectCardCopy(cards);
    initSheetPreview(cards);
    initSearch(shell, cards);
    initBackTop();
  }

  function allOf(root, sel) {
    return Array.prototype.slice.call(root.querySelectorAll(sel));
  }

  function attrSel(name, value) {
    return "[" + name + "=\"" + value + "\"]";
  }

  function hasClass(el, name) {
    return (" " + el.className + " ").indexOf(" " + name + " ") > -1;
  }

  function addClass(el, name) {
    if (hasClass(el, name)) return;
    el.className = el.className ? el.className + " " + name : name;
  }

  function removeClass(el, name) {
    if (!el.className) return;
    var parts = el.className.split(" ");
    var kept = [];
    for (var i = 0; i < parts.length; i++) { if (parts[i] && parts[i] !== name) kept.push(parts[i]); }
    el.className = kept.join(" ");
  }

  /* 卡级复制按钮（#88 R1-1）：卡头注入 1 个按钮——actionId／文案恒读冻结常量，
     文本取同卡 `<pre class="prompt">` 的**原文**（＝该卡 prompt 逐字，与 F3 卡面同源）；
     读不到 <pre> 才回落同卡 Sheet 内 prompt 按钮的 data-t，两者都无才跳过
     （#88 S5／B 段红队 S3-a：真实help模板恒有 <pre>，故 436/436 恒有按钮，不静默丢卡）→ 复用既有委派。 */
  function injectCardCopy(cards) {
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.querySelector("." + CARD_COPY_CLASS)) continue;
      var pre = card.querySelector("." + PROMPT_CLASS);
      var src = pre !== null ? pre : card.querySelector(attrSel(ACTION_ATTR, COPY_ACTION));
      if (src === null) continue;
      var text = pre !== null ? pre.textContent : src.getAttribute(TEXT_ATTR);
      if (text === null) continue;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = CARD_COPY_CLASS;
      btn.textContent = COPY_LABEL;
      btn.setAttribute(ACTION_ATTR, COPY_ACTION);
      btn.setAttribute(TEXT_ATTR, text);
      var head = card.querySelector("." + CARD_TOP_CLASS);
      if (head) head.appendChild(btn); else card.insertBefore(btn, card.firstChild);
    }
  }

  /* Sheet 参数实时预览：静态值换输入框，输入即重组「prompt ＋ 空行 ＋ label: value 行」。 */
  function initSheetPreview(cards) {
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var pre = card.querySelector("." + PROMPT_CLASS);
      if (!pre) continue;
      if (pre.getAttribute(PROMPT_ATTR) === null) pre.setAttribute(PROMPT_ATTR, pre.textContent);
      var fields = allOf(card, "." + FIELD_CLASS);
      for (var j = 0; j < fields.length; j++) bindField(card, fields[j]);
    }
  }

  function bindField(card, field) {
    if (field.querySelector("." + FIELD_INPUT_CLASS)) return;
    var value = field.querySelector("." + FIELD_VALUE_CLASS);
    var input = document.createElement("input");
    input.type = "text";
    input.className = FIELD_INPUT_CLASS;
    input.value = value ? value.textContent : "";
    input.setAttribute("value", input.value);
    var hint = field.querySelector("." + FIELD_HINT_CLASS);
    if (hint) input.setAttribute("placeholder", hint.textContent);
    input.addEventListener("input", function () { refreshPreview(card); });
    if (value && value.parentNode === field) field.replaceChild(input, value);
    else field.appendChild(input);
  }

  function refreshPreview(card) {
    var pre = card.querySelector("." + PROMPT_CLASS);
    if (!pre) return;
    var base = pre.getAttribute(PROMPT_ATTR);
    if (base === null) return;
    var lines = fieldLines(card);
    var text = lines.length > 0 ? base + LF2 + lines.join(LF) : base;
    pre.textContent = text;
    syncCopyText(card, text, lines);
    if (searchTerm !== "") markCard(card, searchTerm);
  }

  function fieldLines(card) {
    var fields = allOf(card, "." + FIELD_CLASS);
    var lines = [];
    for (var i = 0; i < fields.length; i++) {
      var input = fields[i].querySelector("." + FIELD_INPUT_CLASS);
      var labelEl = fields[i].querySelector("." + FIELD_LABEL_CLASS);
      var label = labelEl ? labelEl.textContent : "";
      var raw = input ? input.value : "";
      var val = raw.replace(/^\s+|\s+$/g, "");
      if (val !== "") lines.push(label + ": " + val);
    }
    return lines;
  }

  /* 复制按钮文本同步：prompt 目标（卡头 ＋ Sheet 内）＝ 预览文本；params 目标＝label: value 行，
     无字段时回落该卡 CLI 文本（与冻结help模板 paramsText 同口径）。 */
  function syncCopyText(card, text, lines) {
    var buttons = allOf(card, "[" + ACTION_ATTR + "]");
    for (var i = 0; i < buttons.length; i++) {
      var id = buttons[i].getAttribute(ACTION_ATTR);
      if (id === COPY_ACTION) buttons[i].setAttribute(TEXT_ATTR, text);
      else if (id === PARAMS_ACTION) buttons[i].setAttribute(TEXT_ATTR, lines.length > 0 ? lines.join(LF) : cliTextOf(card));
    }
  }

  function cliTextOf(card) {
    var cli = card.querySelector("." + CLI_CLASS);
    return cli ? cli.textContent : "";
  }

  /* 搜索：过滤 ＋ mark 标签高亮 ＋ 自动展开 ＋ 命中计数 ＋ 清空 ＋ 跳页。 */
  function initSearch(shell, cards) {
    var tabBar = shell.querySelector("." + TAB_BAR_CLASS);
    if (!tabBar || !tabBar.parentNode) return;
    if (shell.querySelector("." + SEARCH_BOX_CLASS)) return;
    var box = document.createElement("div");
    box.className = SEARCH_BOX_CLASS;
    var input = document.createElement("input");
    input.type = "search";
    input.className = SEARCH_INPUT_CLASS;
    input.setAttribute("placeholder", SEARCH_PLACEHOLDER);
    input.setAttribute("aria-label", SEARCH_ARIA);
    input.setAttribute("autocomplete", "off");
    var clear = document.createElement("button");
    clear.type = "button";
    clear.className = SEARCH_CLEAR_CLASS;
    clear.textContent = CLEAR_LABEL;
    clear.setAttribute("aria-label", CLEAR_ARIA);
    var count = document.createElement("span");
    count.className = HITCOUNT_CLASS;
    count.setAttribute("role", "status");
    box.appendChild(input);
    box.appendChild(clear);
    box.appendChild(count);
    tabBar.parentNode.insertBefore(box, tabBar.nextSibling);
    var state = { sheets: [], subgroups: [], pages: [], index: 0 };
    input.addEventListener("input", function () { runSearch(shell, cards, input, count, state); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      if (state.pages.length === 0) return;
      state.index = (state.index + 1) % state.pages.length;
      jumpTo(state.pages[state.index]);
    });
    clear.addEventListener("click", function () {
      input.value = "";
      runSearch(shell, cards, input, count, state);
      input.focus();
    });
  }

  function runSearch(shell, cards, input, count, state) {
    var term = input.value.replace(/^\s+|\s+$/g, "").toLowerCase();
    resetSearch(shell, cards, state);
    searchTerm = term;
    if (term === "") { count.textContent = ""; state.pages = []; state.index = 0; return; }
    var hits = [];
    var i;
    for (i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.textContent.toLowerCase().indexOf(term) < 0) { addClass(card, CARD_HIDDEN_CLASS); continue; }
      hits.push(card);
      markCard(card, term);
      var sheet = card.querySelector("." + SHEET_CLASS);
      if (sheet && !sheet.open) { sheet.open = true; state.sheets.push(sheet); }
    }
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) {
      var inner = allOf(subgroups[i], "." + CARD_CLASS);
      var visible = false;
      for (var j = 0; j < inner.length; j++) { if (hits.indexOf(inner[j]) > -1) { visible = true; break; } }
      if (visible) { if (!subgroups[i].open) { subgroups[i].open = true; state.subgroups.push(subgroups[i]); } }
      else addClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
    }
    var pages = allOf(shell, "." + PAGE_CLASS);
    var hitPages = [];
    for (i = 0; i < pages.length; i++) {
      var pageCards = allOf(pages[i], "." + CARD_CLASS);
      for (var k = 0; k < pageCards.length; k++) { if (hits.indexOf(pageCards[k]) > -1) { hitPages.push(pages[i]); break; } }
    }
    state.pages = hitPages;
    state.index = 0;
    count.textContent = hits.length > 0 ? HIT_PREFIX + hits.length + HIT_SUFFIX : HIT_EMPTY;
    jumpTo(hitPages[0]);
  }

  function resetSearch(shell, cards, state) {
    var i;
    for (i = 0; i < cards.length; i++) {
      removeClass(cards[i], CARD_HIDDEN_CLASS);
      unmarkCard(cards[i]);
    }
    for (i = 0; i < state.sheets.length; i++) state.sheets[i].open = false;
    state.sheets = [];
    for (i = 0; i < state.subgroups.length; i++) state.subgroups[i].open = false;
    state.subgroups = [];
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) removeClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
  }

  function jumpTo(page) {
    if (!page) return;
    var radio = page.querySelector("." + TAB_INPUT_CLASS);
    if (radio && radio.checked !== true) radio.checked = true;
  }

  function markCard(card, term) {
    unmarkCard(card);
    var nodes = [];
    collectText(card, nodes);
    for (var i = 0; i < nodes.length; i++) wrapTerm(nodes[i], term);
  }

  function unmarkCard(card) {
    var marks = allOf(card, "." + CARD_MARK_CLASS);
    for (var i = 0; i < marks.length; i++) {
      var parent = marks[i].parentNode;
      if (!parent) continue;
      parent.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
      if (typeof parent.normalize === "function") parent.normalize();
    }
  }

  function collectText(root, out) {
    var kids = root.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var node = kids[i];
      if (node.nodeType === 3) { if (node.nodeValue) out.push(node); continue; }
      if (node.nodeType !== 1) continue;
      if (hasClass(node, CARD_MARK_CLASS)) continue;
      var tag = node.tagName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "INPUT") continue;
      collectText(node, out);
    }
  }

  function wrapTerm(node, term) {
    var rest = node.nodeValue;
    var at = rest.toLowerCase().indexOf(term);
    if (at < 0) return;
    var frag = document.createDocumentFragment();
    while (at > -1) {
      if (at > 0) frag.appendChild(document.createTextNode(rest.slice(0, at)));
      var mark = document.createElement("mark");
      mark.className = CARD_MARK_CLASS;
      mark.textContent = rest.slice(at, at + term.length);
      frag.appendChild(mark);
      rest = rest.slice(at + term.length);
      at = rest.toLowerCase().indexOf(term);
    }
    if (rest !== "") frag.appendChild(document.createTextNode(rest));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }

  /* 回到顶部（H-19）：scrollTop > BACKTOP_MIN_Y 才加 -show；点击平滑回顶。 */
  function initBackTop() {
    if (document.querySelector("." + BACKTOP_CLASS)) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = BACKTOP_ID;
    btn.className = BACKTOP_CLASS;
    btn.textContent = BACKTOP_LABEL;
    btn.setAttribute("aria-label", BACKTOP_ARIA);
    btn.setAttribute("title", BACKTOP_ARIA);
    btn.addEventListener("click", function () {
      var root = scrollRoot();
      if (!root) return;
      if (typeof root.scrollTo === "function") {
        try { root.scrollTo({ top: 0, behavior: "smooth" }); return; } catch (err) { root.scrollTop = 0; return; }
      }
      root.scrollTop = 0;
    });
    document.body.appendChild(btn);
    document.addEventListener("scroll", syncBackTop, true);
    syncBackTop();
  }

  function scrollRoot() {
    return document.scrollingElement || document.documentElement || document.body;
  }

  function syncBackTop() {
    var btn = document.querySelector("." + BACKTOP_CLASS);
    if (!btn) return;
    var root = scrollRoot();
    var y = root ? root.scrollTop : 0;
    if (y > BACKTOP_MIN_Y) addClass(btn, BACKTOP_SHOW_CLASS); else removeClass(btn, BACKTOP_SHOW_CLASS);
  }

  if (document.body) boot();
  else document.addEventListener("DOMContentLoaded", boot);
}());</script>
</body>
