packages:
  - 'packages/*'
# #48 R2 B①：intra-monorepo 依赖用已发布号（^0.1.0）声明，本地一律链 workspace（link:），
# 发布出的 package.json 干净无 workspace:。pnpm v9+ 起 range 默认走 registry（.npmrc 里的
# prefer-workspace-packages 已被移除，link-workspace-packages 亦只认 CLI flag），
# 唯 pnpm-workspace.yaml 内 linkWorkspacePackages 才全局生效（含 CI），锁文件永保 link:。
linkWorkspacePackages: true
# 维护者 2026-10-07 定：全跟最新，年龄门永久放开（minimumReleaseAge: 0）。
# 白名单 minimumReleaseAgeExclude 保留作记录（verify 路径实测不清白名单，只认此值）。
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - dsh-plugin-update@0.2.0
  - dsh-life-pack@0.3.30
  - dsh-life-pack@0.3.34
  - dsh-plugin-update@0.5.1
  - dsh-plugin-update@0.5.4
  - dsh-plugin-update@0.5.8
  - dsh-plugin-update@0.8.0
preferWorkspacePackages: true
