name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # P2 ADR-0001：只跑 22.13+/24，不测 18/20
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status 需与 master 求 merge-base，浅克隆无基线必挂
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # #295：命令汇总位（keys／registry／combos 镜像／REPR／EXAMPLES）改由各能力声明确定性生成后，
      #   生成物 ≠ 生成器输出即红——设计正本《命令登记与分派-方案.html》把「确定性 ＋ 哈希锁 ＋ CI 校验」
      #   列为这套方案的成立要件，缺这条生成物就会被人手改、退化成第四份手抄。
      #   需先 build 出 dist/：生成器读的是编译后的声明模块（TS 不能直接被 node 引）。
      #
      # #295 返修（A8）：**一步红不许吞掉其余门**。
      #   改前的形态：`help:examples:check` 排在前面，它一红（票外既有失败，见 #308），
      #   其后 doctor／test（含 #294 棘轮）／boundaries／snapshot:html:check／gate:selftest:html
      #   在 CI 里**一律 skipped**——等于这 5 道门在 CI 上从来没跑（蓝队实测 master 近 45 次全 failure）。
      #   处置两条：① 每道门各带 `if: always()`，互不短路（任一门红，其余照跑）；
      #   ② 已知恒红的那一步挪到 job 末尾，别挡在别的门前面。
      #   红仍然是红：失败的步没有 `continue-on-error`，job 整体照旧 failure——这不是把红变绿，
      #   是让「哪几道门真跑了」在 CI 里看得见。改这条的判据由 `test/ci-gates-295.test.mjs` 机器盯着。
      - run: pnpm gen:check
        if: always()
      - run: pnpm doctor
        if: always()
      - run: pnpm test
        if: always()
      - run: pnpm boundaries
        if: always()
      # #96：其余 5 技能 HTML 不回归门（per-skill HTML 逐件 sha256；base-* 影响面断言）
      #   本地同口径命令就是这一条：pnpm snapshot:html:check（见 tooling/skill-html-snapshot.mjs）
      - run: pnpm snapshot:html:check
        if: always()
      # #96：门禁工具自证（协议 §2.4.6：不在 canonical pnpm test 的 glob 内，须单独触发）
      #   ⚠ 该 script 自身即经持锁包装器，且**用独立锁目录** `.scratch/locks-selftest`
      #   （D-1 自锁修复）：调用方**不得**再套 `run-locked`／`pnpm gate:run`，否则外层持主锁等子进程、
      #   内层等独立锁——虽不再死锁，但会多一层无意义嵌套；本地同口径命令就是这一条。
      - run: pnpm gate:selftest:html
        if: always()
      # changeset status 按字面 merge-base master HEAD：显式建本地 master 基线
      # 主仓签出 master 时冒号写法被拒，回退普通 fetch（本地 master 本来就在）
      - name: 取 master 基线
        if: always()
        run: git fetch origin master:master || git fetch origin master
      - run: pnpm changeset:status
        if: always()
      # #99：SKILL.md「例」列逐行可执行门（99 行 spawn 真 CLI 断言 exit 0；需先 build 出 dist/）
      #   判据与 #81「exec ⟺ exit 0」同源：同一份标准种子库 docs/research/t81-seed.mjs
      #   ⚠ 今天这道门是票外既有红（`calorie.view.exercise-review`，已转票 #308）：它排在最末，
      #   红的是它自己，不再拖累上面任何一道门。
      - run: pnpm help:examples:check
        if: always()

  publish-gates:
    # #48 发布门禁三门（R2 A+B）：G1 禁 workspace 外泄 + G2 tarball 清单 + G3 fresh-tmp 安装态双路
    # 样板期仅卡路里线 --only；复制到其余 5 对后去掉 --only 跑全量 13 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish:pre
      - run: pnpm publish:tarball
      - run: pnpm publish:fresh
      # #95：模板资产门（单包显式复跑，不吃 --only 全量口径的漂移）
      #   G2：tarball 清单逐件含 templates/*.html；G3：fresh 安装态 loadTemplate 真读 6 件
      #   返修（A1-1／A1-2／A2-1）：临时根必须在仓库之外（协议 §2.1）＋ 门必须说真话（逐件／未跑记账）
      - name: 模板资产门（skill-calorie）
        run: |
          node tooling/check-publish.mjs --tarball --only skill-calorie
          node tooling/check-publish.mjs --fresh-tmp --only skill-calorie
          node tooling/check-publish.mjs --tmp-hygiene
          node docs/research/t95-g3-honesty.mjs
      - name: 打包实证与清理守卫自证（#95 返修）
        run: |
          node docs/research/t95-publish-evidence.mjs
          node docs/research/t95-publish-evidence.mjs --mutate
          node docs/research/t95-publish-evidence.mjs --guard-selftest
          node docs/research/t95-f1-attribution.mjs

  win-detail:
    # Win 人工细验位：中文路径/换行/CRLF/doctor 强提示
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm doctor
      - run: pnpm test
