name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # P2 ADR-0001：只跑 22.13+/24，不测 18/20
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status 需与 master 求 merge-base，浅克隆无基线必挂
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm doctor
      - run: pnpm test
      - run: pnpm boundaries
      # Q92-①：构建忘写快照致误导 → CI 重 resolve 后 diff，不等 fail
      - run: pnpm snapshot:check
      - run: pnpm changeset:status

  # Q92-②：手改快照 → 快照只许构建写，git 校验拦截
  snapshot-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 快照文件只许由构建改（手改即 fail）
        run: |
          if git diff --name-only origin/master...HEAD -- packages/hunter-skills/skill.snapshot.json | grep -q .; then
            node tooling/write-snapshot.mjs --check
          else
            echo "snapshot untouched, skip"
          fi

  win-detail:
    # Win 人工细验位：中文路径/换行/CRLF/doctor 强提示
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm doctor
      - run: pnpm test
