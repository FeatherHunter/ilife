<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 固定位</title>
<!--SHARED-CSS-->
<style>
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:20px;padding:22px 24px;margin-bottom:14px;border:1px solid #e8ecf1}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#eef4ff;color:#007aff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.lead{color:#6e6e73;font-size:14px;margin-top:6px}
.receipt{background:#f2fbf5;border:1px solid #c8ecd5;border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;border:1px solid #eef0f3}
.card h2{font-size:15px;margin-bottom:12px}
.card h2 .hint{font-size:11px;color:#86868b;font-weight:400}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f3;font-size:13px}
.frow:last-child{border-bottom:none}
.frow .inf{flex:1;min-width:0}
.frow .inf .n{font-weight:600}
.frow .inf .p{color:#86868b;font-size:12px;margin-top:2px}
.frow .inf .p b{color:#6e6e73}
.oktag{display:inline-block;background:#eef4ff;color:#007aff;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
.warntag{display:inline-block;background:#ffeaea;color:#c0392b;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
.curlist{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.currow{font-size:12px;color:#6e6e73;background:#f8fafc;border-radius:8px;padding:6px 10px}
.empty{background:#fff;border-radius:18px;padding:36px 20px;text-align:center;color:#86868b}
.empty h2{font-size:18px;color:#1d1d1f;margin-bottom:6px}
.panel{background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;border:1px solid #d2d2d7}
.panel h3{font-size:15px;margin-bottom:12px}
.fp-row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.fp-row label{font-size:12px;color:#6e6e73;font-weight:600}
.fp-row input{border:1px solid #d2d2d7;border-radius:12px;padding:12px;font-size:14px;min-height:44px}
.fp-row input:focus{outline:none;border-color:#007aff}
.fp-preview{background:#f6f8fa;border:1px solid #e8eaed;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-top:4px}
.fp-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:13px;background:#007aff;color:#fff;min-height:44px}
.btn.ghost{background:#fff;color:#1d1d1f;border:1px solid #d2d2d7}
.btn:disabled{opacity:.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
.page h1{font-size:24px;letter-spacing:-.02em;margin:4px 0 8px}
.cmd{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#86868b;background:#f2f4f8;border-radius:8px;padding:8px 12px;word-break:break-all;margin:0 0 14px}
@media(max-width:720px){.actions{display:grid;grid-template-columns:repeat(2,1fr)}.actions .btn:not(.ghost){grid-column:1/-1}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="page">
<h1>固定位</h1>
<p class="cmd">home-cmd-read home.location.write --params '{"op":"fixed","item_id":1,"fixed_location":"玄关/抽屉"}'</p>
<!--CONTENT-->
</div>
<!--SHARED-HELPERS-->
<script>
function showToast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function copyText(text,msg){function done(){showToast(msg)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){fallback()})}else{fallback()}function fallback(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(b){copyText(b.getAttribute('data-copy'),'提示词已复制，发给智能助手执行')}});
(function(){var item=document.getElementById('fpItem');if(!item)return;var loc=document.getElementById('fpLoc');var prev=document.getElementById('fpPreview');var copy=document.getElementById('fpCopy');function upd(){var a=item.value.trim();var b=loc.value.trim();var text='请加载「居家管家」技能，帮我设置固定位：\n物品：'+(a||'待填写')+'\n固定位：'+(b||'待填写');prev.textContent=text;var ok=!!a&&!!b;copy.disabled=!ok;if(ok)copy.setAttribute('data-copy',text)}item.addEventListener('input',upd);loc.addEventListener('input',upd);upd()})();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
