<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 位置管理</title>
<!--SHARED-CSS-->
<style>
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:20px;padding:22px 24px;margin-bottom:14px;border:1px solid #e8ecf1}.eyebrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#eef4ff;color:#007aff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.lead{color:#6e6e73;font-size:14px;margin-top:6px}
.receipt{background:#f2fbf5;border:1px solid #c8ecd5;border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;border:1px solid #eef0f3}
.card h2{font-size:15px;margin-bottom:12px}
.card h2 .hint{font-size:11px;color:#86868b;font-weight:400}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f3;font-size:13px}
.trow:last-child{border-bottom:none}
.trow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nm.isempty{color:#86868b;font-weight:500}
.trow .infc{display:flex;flex-direction:column;min-width:0;flex:1}
.trow .sub{font-size:11px;color:#86868b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ct{color:#86868b;font-size:11px;flex:none}
.trow .ops{flex:none;display:flex;gap:6px;margin-left:auto}
.opb{border:none;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;background:#f2f4f8;color:#6e6e73;min-height:44px}
.opb:hover{background:#eef4ff;color:#007aff}
.opb.danger:hover{background:#ffeaea;color:#ff3b30}
.foldbtn{border:none;background:none;cursor:pointer;font-size:11px;color:#86868b;padding:12px 8px;border-radius:8px;flex:none;min-width:44px;min-height:44px}
.foldpad{width:44px;flex:none}
.sim{border:1px solid #ffd9b3;background:#fff8f0;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:13px}
.sim .paths{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sim .pathchip{background:#fff;border:1px solid #f5d98f;border-radius:99px;padding:4px 12px;font-weight:600;color:#8a5a1a}
.sim .mig{color:#86868b;font-size:12px;margin-bottom:8px}
.empty{background:#fff;border-radius:18px;padding:36px 20px;text-align:center;color:#86868b}
.empty h2{font-size:18px;color:#1d1d1f;margin-bottom:6px}
.panel{background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;border:1px solid #d2d2d7}
.panel h3{font-size:15px;margin-bottom:12px}
.fp-row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.fp-row label{font-size:12px;color:#6e6e73;font-weight:600}
.fp-row input{border:1px solid #d2d2d7;border-radius:12px;padding:12px;font-size:14px;min-height:44px}
.fp-row input:focus{outline:none;border-color:#007aff}
.fp-row input[readonly]{background:#f2f2f5;color:#86868b}
.fp-preview{background:#f6f8fa;border:1px solid #e8eaed;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-top:4px}
.fp-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:13px;background:#007aff;color:#fff;min-height:44px}
.btn.ghost{background:#fff;color:#1d1d1f;border:1px solid #d2d2d7}
.btn:disabled{opacity:.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
.page h1{font-size:24px;letter-spacing:-.02em;margin:4px 0 8px}
.cmd{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#86868b;background:#f2f4f8;border-radius:8px;padding:8px 12px;word-break:break-all;margin:0 0 14px}
@media(max-width:720px){.actions{display:grid;grid-template-columns:repeat(2,1fr)}.actions .btn:not(.ghost){grid-column:1/-1}.actions .btn{width:100%}.trow .ops{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="page">
<h1>管位置</h1>
<div hidden><p class="cmd">home-cmd-read home.location.write --params '{"op":"manage","action":"add","path":"客厅/电视柜"}'</p></div>
<!--CONTENT-->
</div>
<!--SHARED-HELPERS-->
<script>
function showToast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function copyText(text,msg){function done(){showToast(msg)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){fallback()})}else{fallback()}function fallback(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(b){copyText(b.getAttribute('data-copy'),'提示词已复制，发给智能助手执行');return}var f=e.target.closest('.foldbtn');if(f){var tree=f.closest('.tree');if(!tree)return;var rows=tree.querySelectorAll('.trow');var i=+f.getAttribute('data-i');var end=+f.getAttribute('data-end');for(var k=i+1;k<=end;k++){if(rows[k])rows[k].style.display=rows[k].style.display==='none'?'':'none'}f.textContent=f.textContent==='展开'?'收起':'展开'}});
(function(){var main=document.getElementById('fpMain');if(!main)return;var src=document.getElementById('fpSrc');var prev=document.getElementById('fpPreview');var copy=document.getElementById('fpCopy');var mode=document.getElementById('formPanel').getAttribute('data-mode')||'create';var srcPath=src?src.value:'';function upd(){var v=main.value.trim();var text=mode==='rename'?'请加载「居家管家」技能，帮我改名位置：\n源位置：'+srcPath+'\n新名称：'+(v||'待填写'):'请加载「居家管家」技能，帮我新建位置：\n位置：'+(v||'待填写');prev.textContent=text;var ok=mode==='create'?!!v:(!!v&&v!==srcPath);copy.disabled=!ok;if(ok)copy.setAttribute('data-copy',text)}main.addEventListener('input',upd);upd()})();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
