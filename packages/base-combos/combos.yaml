scenarios:
  - id: L1.1
    name: 饮食支出
    wake_word: 协同饼干记账（饮食支出）
    external: 饼干记账
    external_ref: 查分类（餐饮本月）
    external_data: 本月餐饮分类支出汇总加分类占比加日均
    calorie_ref: 卡路里看饮食总览本月摄入总热量除以日均
    merge_logic: 按同月对齐，餐饮支出总额对照摄入热量总额，算每千卡成本，分类支出占比对摄入分类占比
    present: 本月支出对摄入双卡加元单千卡性价比加分类对比加一句话总结
    status: 保留
  - id: L1.2
    name: 饮食预算
    wake_word: 协同饼干记账（饮食预算）
    external: 饼干记账
    external_ref: 看预算结果含各分类进度条提取餐饮
    external_data: 本月餐饮预算额度加已支出加剩余加执行率
    calorie_ref: 卡路里看营养目标进度本月摄入对目标偏差
    merge_logic: 钱预算对照热量预算双维度，支出进度对摄入进度，找预算超支与摄入超支的关联日
    present: 双预算进度卡钱加热量加超支风险提示加一句话总结
    status: 保留
  - id: L1.3
    name: 高频食物成本
    wake_word: 协同饼干记账（高频食物成本）
    external: 饼干记账
    external_ref: 搜备注食物名关键词
    external_data: 按备注关键词近似聚合的高频消费食物名次数金额
    calorie_ref: 卡路里看频繁吃榜高频食物名称次数
    merge_logic: 备注关键词对照食物名近似匹配，算常吃食物单次成本
    present: 高频食物成本对照标注近似加一句话总结
    status: 降级
    downgrade_note: 饼干记账无食物名结构化字段只有分类加备注文本，只能按备注关键词近似，结果须用户确认
  - id: L1.5
    name: 按天支出
    wake_word: 协同饼干记账（按天支出）
    external: 饼干记账
    external_ref: 查某天加看月度餐饮分类
    external_data: 每日餐饮支出明细按天对齐
    calorie_ref: 卡路里看某段时间饮食每日摄入
    merge_logic: 按天对齐支出与摄入，找花钱多且吃得多或花钱少但吃得好的日子，日均对比
    present: 日粒度支出对摄入双轴加异常日标注加一句话总结
    status: 保留
  - id: L1.6
    name: 按餐别支出
    wake_word: 协同饼干记账（按餐别支出）
    external: 饼干记账
    external_ref: 查分类餐饮加搜备注时段近似
    external_data: 按时间段除以备注近似的餐别支出早午晚
    calorie_ref: 卡路里看全部餐别分布最近7天餐别摄入
    merge_logic: 卡路里餐别早午晚对照记账按时间段近似匹配，餐别支出对餐别摄入
    present: 餐别支出对照餐别摄入标注近似加一句话总结
    status: 降级
    downgrade_note: 记账无餐别字段，只能按备注除以时间段近似，结果须用户确认
  - id: L2.1
    name: 运动时间窗
    wake_word: 联动作息管家（运动时间窗）
    external: 作息管家
    external_ref: 查作息范围日期范围统计结果含分类聚合
    external_data: 运动时段分布作息分类聚合何时在运动
    calorie_ref: 卡路里看运动类型分布实际运动时间分布
    merge_logic: 作息侧计划的运动时段对卡路里实际的运动时段，重叠度加最佳运动时间窗建议
    present: 双时段分布对照加最佳运动时间窗建议加一句话总结
    status: 保留
  - id: L2.2
    name: 作息异常影响
    wake_word: 联动作息管家（作息异常影响）
    external: 作息管家
    external_ref: T5异常检测
    external_data: 作息异常日熬夜加班睡眠不足等默认7天窗口
    calorie_ref: 卡路里看体重曲线异常日前后体重
    merge_logic: 异常日标记对照体重变化，异常日对正常日体重变化均值对比
    present: 异常日时间线加体重变化对照加一句话总结
    status: 保留
  - id: L2.3
    name: 运动时段对饮食时段
    wake_word: 联动作息管家（运动时段对饮食时段）
    external: 作息管家
    external_ref: 查作息时间轴运动加餐饮分类
    external_data: 每日运动时段加餐饮时段
    calorie_ref: 卡路里看今日饮食记录时间
    merge_logic: 运动结束时间对照下一餐时间间隔分析运动后多久吃饭
    present: 运动用餐间隔分布加建议加一句话总结
    status: 保留
  - id: L2.4
    name: 睡眠时长对减重
    wake_word: 联动作息管家（睡眠时长对减重）
    external: 作息管家
    external_ref: 汇总作息日期范围结果含睡眠统计
    external_data: 每日睡眠时长睡眠分类聚合主睡眠段
    calorie_ref: 卡路里看体重曲线同期每日体重
    merge_logic: 按天对齐睡眠时长与体重变化，睡眠分位分组对比各组体重变化均值算相关性
    present: 双轴折线睡眠对照体重加分位分组体重变化加相关系数加一句话总结
    status: 保留
  - id: L2.5
    name: 早餐时间对体重
    wake_word: 联动作息管家（早餐时间对体重）
    external: 作息管家
    external_ref: 查作息餐饮分类6到10点时段近似
    external_data: 早餐时段6到10点用餐记录近似开始时间
    calorie_ref: 卡路里看早餐最近7天加看体重曲线
    merge_logic: 早餐时间早晚分组对照体重变化，早吃对晚吃组体重变化对比
    present: 早餐时间分组对体重变化标注近似加一句话总结
    status: 降级
    downgrade_note: 作息分类含有餐饮但无早餐专门标签，只能按6到10点用餐记录近似
  - id: L2.6
    name: 睡眠质量对运动表现
    wake_word: 联动作息管家（睡眠质量对运动表现）
    external: 作息管家
    external_ref: 汇总作息日期范围结果含睡眠统计
    external_data: 睡眠时长除以异常日无主观质量字段用时长为代理
    calorie_ref: 卡路里看运动趋势每日运动消耗
    merge_logic: 睡眠分组对照次日运动消耗均值对比
    present: 睡眠分组对运动消耗加一句话总结
    status: 保留
