<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配置面板 · 方向原型 30 版（不同物种，不是不同皮肤）</title>
<!--
  原型件（不是生产代码，不参与构建，不承载任何真逻辑）。
  用途：把「饼干记账设置面板」这一屏按 30 个**方向**画出来——不是同一个东西换皮肤，
        而是换物种：看板／清单／向导／时间轴／目录树／资源管理器／面包屑／关系图／
        yaml 本体／diff／终端／JSON／代码块／对话／命令面板／搜索／数据表／属性网格／
        iOS 列表／属性页／大字排版／工程风／纸感／玻璃分层。
  颜色取真值（现场：底 #080808／卡面 #101010／正文 #e0e0e0／强调 #f8b080）。
  内容逐字取自真面板（packages/plugin-bill-ilife/src/settings.ts 与 client.ts）。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#050505;color:#cfcfd4;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit}

/* 外壳 */
.tb{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 20px;background:#101013;border-bottom:1px solid #232329}
.tb h1{font-size:14.5px;margin:0;font-weight:600;color:#e8e8ec}
.tb .sub{font-size:12.5px;color:#8b8b95}
.tb .sp{flex:1}
.tbtn{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid #2e2e36;background:#17171c;color:#d8d8de;cursor:pointer}
.tbtn:hover{border-color:#3d3d47}
.tbtn.on{background:#e8e8ec;color:#111;border-color:#e8e8ec}
.tbtn.acc{background:#2f6fed;border-color:#2f6fed;color:#fff}
.prog{font-size:12.5px;color:#9a9aa4}
.stagewrap{display:flex;justify-content:center;padding:18px 14px 130px}
.stage{width:1040px;flex:0 0 auto;background:var(--bg);color:var(--text);border-radius:12px;padding:24px 28px 28px;font-family:var(--font,inherit)}
.strip{width:1040px;flex:0 0 auto;padding:10px 14px;border:1px solid #232329;border-radius:10px;background:#101013;margin-bottom:12px}
.strip .s1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.strip .no{font-size:13px;color:#8b8b95;font-variant-numeric:tabular-nums}
.strip .nm{font-size:15px;font-weight:600;color:#e8e8ec}
.strip .fam{font-size:11.5px;color:#cfcfd4;border:1px solid #2b2b33;border-radius:999px;padding:1px 8px;background:#17171c}
.strip .what{font-size:12.5px;color:#9a9aa4;margin-top:5px;line-height:1.6}

/* 通用件 */
.pgrow{display:flex;align-items:center;gap:10px}
.pgh1{font-size:19px;font-weight:640;margin:0;letter-spacing:.2px;color:var(--text)}
.pgacts{margin-left:auto;display:flex;align-items:center;gap:8px}
.ico{color:var(--muted);font-size:15px;line-height:1}
.pgver{color:var(--muted);font-size:12.5px;margin-top:3px}
.tabs{display:flex;flex-wrap:wrap;margin:14px 0 15px;gap:8px}
.tab{font-size:13px;cursor:pointer;background:none;border:1px solid var(--line2);color:var(--muted);padding:5px 12px;border-radius:999px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card+.card{margin-top:14px}
.ctitle{font-size:14.5px;font-weight:640}
.ctitle.sm{font-size:13px;font-weight:600}
.cmeta{color:var(--muted);font-size:12.5px;margin-top:5px;word-break:break-all;line-height:1.6}
.cmeta .k{color:var(--faint);margin-right:6px}
.mono,code{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6}
.faint{color:var(--faint);font-size:12px;line-height:1.6}
.btn{font-size:12.5px;padding:5px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:500}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.mini{font-size:11.5px;padding:2px 8px;color:var(--muted)}
.btn[disabled]{opacity:.4}
.f{width:100%;background:var(--inputBg);border:1px solid var(--inputLine);border-radius:6px;color:var(--text);padding:6px 10px;font-family:var(--font);font-size:13px}
.chipr{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--faint);margin-left:8px;font-weight:400;white-space:nowrap}
.lt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.lt.ok{background:#4ec9a0}.lt.warn{background:#e0a33e}.lt.off{background:#4a4a52}
.badge{font-size:10.5px;border:1px solid var(--line2);border-radius:999px;padding:0 6px;color:var(--faint)}
.rowl{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowl:last-child{border-bottom:0}
.kv{display:flex;flex-direction:column;min-width:0;flex:1}
.kv .k2{font-size:13px;font-weight:550}
.kv .v2{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;word-break:break-all}

/* A 状态优先 */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.stcard{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--surface2)}
.stcard .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.stcard .p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
.stcard .m{font-size:11.5px;color:var(--faint);margin-top:7px;display:flex;gap:10px}
.ledger{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.ledger .big{font-size:14px;font-weight:620}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile2{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--surface2)}
.tile2 .n{font-size:23px;font-weight:660;letter-spacing:-.6px}
.tile2 .c{font-size:11.5px;color:var(--faint);margin-top:4px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.wcell{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--surface2)}
.wcell.open{grid-column:1/-1;border-color:var(--line2)}
.wcell .wn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.wcell .ws{font-size:11.5px;color:var(--faint);margin-top:6px}

/* B 一屏一事 */
.drawer{display:grid;grid-template-columns:1fr 388px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:13px}
.dlist{background:var(--surface)}
.drow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow.on{background:var(--surface2)}
.dpanel{background:var(--surface2);border-left:1px solid var(--line);padding:15px}
.acc .asec{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--surface2);overflow:hidden}
.acc summary{cursor:pointer;padding:12px 15px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:'›';color:var(--muted)}
.acc details[open] summary::before{transform:rotate(90deg);display:inline-block}
.acc .abody{padding:2px 15px 14px}
.steps{display:flex;gap:10px;align-items:center;margin-top:2px}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint)}
.step .num{width:21px;height:21px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px}
.step.on{color:var(--text)}.step.on .num{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.tl{position:relative;padding-left:24px;margin-top:14px}
.tl::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tlnode{position:relative;padding:10px 0}
.tlnode::before{content:'';position:absolute;left:-22px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.tlnode.on::before{border-color:var(--accent);background:var(--accent)}
.tlnode .nt{font-size:13px;font-weight:550}
.tlnode .nv{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}

/* C 文件系统 */
.tree{font-size:12.5px;margin-top:12px}
.tnode{display:flex;gap:9px;align-items:center;padding:6px 0}
.tnode .glyph{color:var(--faint);width:13px;text-align:center}
.tnode .nm{color:var(--text);font-weight:550}
.tnode .vv{font-family:var(--mono);color:var(--muted);margin-left:auto}
.tkids{margin-left:15px;border-left:1px solid var(--line);padding-left:11px}
.expl{display:grid;grid-template-columns:320px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:13px}
.expl .pane{border-right:1px solid var(--line);background:var(--surface2);padding:10px 0}
.expl .pane2{padding:12px 14px}
.crumb{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.crumb .seg{font-family:var(--mono);font-size:12.5px;padding:5px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);cursor:pointer;white-space:nowrap}
.crumb .seg.on{border-color:var(--accent);color:var(--accent)}
.crumb .sp{color:var(--faint)}
.gmap{position:relative;margin-top:16px;height:280px}
.gbox{position:absolute;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);padding:10px 13px;font-size:12.5px}
.gbox .gt{font-weight:600}.gbox .gv{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
.gline{position:absolute;background:var(--line2)}
.glab{position:absolute;font-size:11px;color:var(--faint);background:var(--bg);padding:0 6px}

/* D 文本本体 */
.code{background:#0a0a0c;border:1px solid var(--line);border-radius:9px;padding:11px 0;font-family:var(--mono);font-size:12.5px;line-height:1.95;overflow-x:auto;margin-top:13px}
.code .ln{display:flex;gap:12px;padding:0 15px;white-space:pre}
.code .no{color:#4a4a52;user-select:none;min-width:16px;text-align:right}
.Tk{color:#8ab4f8}.Ts{color:#c3e88d}.Tc{color:#63636b}.Tn{color:#f78c6c}
.dif{background:#0a0a0c;border:1px solid var(--line);border-radius:9px;font-family:var(--mono);font-size:12.5px;overflow:hidden;margin-top:13px}
.dif .h{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11.5px}
.dif .l{padding:2px 13px}
.dif .del{background:rgba(224,90,80,.13);color:#e08d86}
.dif .add{background:rgba(78,201,160,.13);color:#7ed3b2}
.term{background:#0a0a0c;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:13px}
.term .tbar{display:flex;gap:6px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line)}
.term .dot{width:10px;height:10px;border-radius:50%;background:#33333a}
.term .bd{padding:13px 15px;font-family:var(--mono);font-size:12.5px;line-height:2}
.term .ps{color:var(--accent)}
.term .cur{display:inline-block;width:8px;height:14px;background:var(--text);vertical-align:-2px}

/* E 对话与命令 */
.chatbox{display:flex;gap:8px;margin-top:13px}
.msg{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.msg:last-child{border-bottom:0}
.msg .av{width:24px;height:24px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 auto}
.cmdk{border:1px solid var(--line2);border-radius:12px;background:var(--surface2);overflow:hidden;margin-top:13px}
.cmdk .q{width:100%;border:0;background:transparent;color:var(--text);font-size:14px;padding:15px 17px;border-bottom:1px solid var(--line);outline:none}
.cmdk .it{display:flex;align-items:center;gap:11px;padding:10px 17px;font-size:13px}
.cmdk .it.on{background:var(--surface3)}
.cmdk .it .kb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.banner{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid rgba(224,163,62,.45);background:rgba(224,163,62,.10);border-radius:9px;font-size:12.5px;margin-top:13px}
.banner .btns{margin-left:auto;display:flex;gap:7px}
.sres{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:11px}
.sres .grp{padding:9px 14px;font-size:11.5px;color:var(--faint);background:var(--surface2);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.sres .grp:first-child{border-top:0}
.sres .it{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.sres .it:last-child{border-bottom:0}
.sres .it .mt{margin-left:auto;color:var(--faint);font-size:12px}

/* F 表格与密度 */
table.tb3{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:13px}
table.tb3 th{text-align:left;font-weight:600;color:var(--faint);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tb3 td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb3 tr:last-child td{border-bottom:0}
.pgrid{display:grid;grid-template-columns:170px 1fr;font-size:12.5px;margin-top:13px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pgrid .pk{padding:6px 12px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.pgrid .pv{padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.ios{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:13px}
.ios .ir{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--line);font-size:13.5px}
.ios .ir:last-child{border-bottom:0}
.ios .ir .val{margin-left:auto;color:var(--muted);font-size:12.5px;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ios .ir .ch{color:var(--faint)}
.wtabs{display:flex;gap:0;border-bottom:1px solid var(--line2);margin-top:13px}
.wtab{padding:7px 16px;font-size:12.5px;color:var(--muted);border:1px solid transparent;border-bottom:0;cursor:pointer}
.wtab.on{color:var(--text);background:var(--surface2);border-color:var(--line2);border-radius:7px 7px 0 0}
.wfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* G 排版与材质 */
.big{font-size:30px;font-weight:640;letter-spacing:-.8px;line-height:1.25}
.bigv{font-family:var(--mono);font-size:21px;margin-top:6px;word-break:break-all}
.bigk{font-size:12.5px;color:var(--faint);letter-spacing:1.2px;margin-top:22px;text-transform:uppercase}
.brut{--bg:#000;--surface:#000;--surface2:#000;--line:#2a2a2a;--line2:#4a4a4a;--text:#fff;--muted:#b8b8b8;--faint:#8a8a8a;--accent:#ffd23f;--accentInk:#000}
.brut .bsect{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--accent);border-bottom:1px solid var(--line2);padding-bottom:6px;margin-top:20px}
.brut .brow{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:7px 0;font-family:var(--mono);font-size:12.5px;border-bottom:1px solid #141414}
.paper{--bg:#f4f2ee;--surface:#fbfaf7;--surface2:#f1efe9;--line:#e3dfd6;--line2:#d6d1c6;--text:#26241f;--muted:#6b665c;--faint:#938d81;--accent:#b4632b;--accentInk:#fff;--inputBg:#fff;--inputLine:#d6d1c6}
.paper .ptitle{font-size:20px;font-weight:620;letter-spacing:.2px}
.paper .prow{padding:16px 0;border-bottom:1px solid var(--line)}
.paper .pu{font-family:var(--mono);font-size:13px;border-bottom:1px dashed var(--line2);padding-bottom:3px;display:inline-block}
.gl3{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.gl3 .g3in{background:var(--surface3);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.gl3 .g3deep{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}

/* 总览 */
.ov{padding:20px 0 90px}
.ovgrid{display:grid;grid-template-columns:repeat(3,354px);gap:16px;justify-content:center}
.tile{border:1px solid #232329;border-radius:12px;overflow:hidden;background:#101013}
.tilehead{padding:8px 10px;border-bottom:1px solid #202027;display:flex;gap:8px;align-items:baseline}
.tilehead b{font-weight:600;color:#e8e8ec;font-size:12.5px}
.tilehead .tt{color:#8b8b95;font-size:11.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{font-size:11px;border-radius:999px;padding:1px 7px;white-space:nowrap}
.vb.g{background:rgba(78,201,160,.18);color:#4ec9a0}
.vb.b{background:rgba(224,104,95,.16);color:#e0685f}
.vb.n{background:#1b1b21;color:#77777f}
.tilebox{width:354px;max-height:340px;overflow:hidden;cursor:zoom-in;position:relative}
.tilebox .scaler{zoom:.34038}
.tilebox .stage{border-radius:0;padding-bottom:14px}
.tilefoot{padding:7px 10px;border-top:1px solid #202027;display:flex;gap:6px;align-items:center}
.tilefoot .mini{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid #2e2e36;background:#17171c;color:#c8c8d0;cursor:pointer}
.tilefoot .mini.g.on{background:rgba(78,201,160,.2);border-color:#4ec9a0;color:#4ec9a0}
.tilefoot .mini.b.on{background:rgba(224,104,95,.18);border-color:#e0685f;color:#e0685f}

/* 底栏与浮层 */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 20px;background:rgba(16,16,19,.97);border-top:1px solid #26262c}
.bbar .nav{font-size:12.5px;padding:5px 12px;border-radius:8px;border:1px solid #2e2e36;background:#17171c;color:#d8d8de;cursor:pointer}
.bbar .navk{font-size:12.5px;color:#9a9aa4;min-width:250px}
.vote{font-size:13px;padding:6px 16px;border-radius:8px;border:1px solid #2e2e36;background:#17171c;color:#d8d8de;cursor:pointer}
.vote.g.on{background:#175c46;border-color:#2f9e78;color:#d6fff0}
.vote.b.on{background:#5c2420;border-color:#b1493f;color:#ffdfdc}
.bnote{flex:1;min-width:170px;font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid #2e2e36;background:#141418;color:#e0e0e6}
.kbd{font-size:11px;color:#77777f;border:1px solid #2e2e36;border-radius:5px;padding:0 5px}
.mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:820px;max-width:100%;max-height:88vh;background:#141418;border:1px solid #2b2b33;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-size:15px;color:#e8e8ec}
.modal p{margin:0;font-size:12.5px;color:#8b8b95;line-height:1.65}
.modal textarea{width:100%;height:48vh;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.7;color:#dfe3ea;background:#0e0e11;border:1px solid #2b2b33;border-radius:10px;padding:11px}
.modal .mrow{display:flex;gap:9px;justify-content:flex-end}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="tb">
  <h1>配置面板 · 方向原型 30 版</h1>
  <span class="sub">逐版点「好看／不好看」→ 右上「导出判定」贴回</span>
  <span class="sp"></span>
  <span class="prog" id="prog"></span>
  <button class="tbtn" id="btnOv">总览</button>
  <button class="tbtn on" id="btnOne">逐版</button>

  <button class="tbtn acc" id="btnExp">导出判定</button>
</div>
<div id="view"></div>

  <button class="nav" id="next">下一版 ›</button>

</footer>

    <textarea id="exp" readonly></textarea>
    <div class="mrow"><button class="tbtn" id="copyBtn">复制</button><button class="tbtn" id="closeExp">关闭</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ══ 内容（逐字取自真面板） ══ */
var D={
  page:'爱生活', ver:'总管 dsh-life-pack · 0.3.6',
  tabs:['饼干记账','卡路里','备忘录','作息管家','居家管家','私家大厨'],
  card:'饼干记账 · 配置',
  cfg:'C:\\Users\\辰辰洋洋\\.ilife\\bill.yaml',
  dir:'C:\\Users\\辰辰洋洋\\.ilife\\data',
  db:'C:\\Users\\辰辰洋洋\\.ilife\\data\\biscuit_accountant.db',
  goals:'C:\\Users\\辰辰洋洋\\.ilife\\data\\goals.json',
  html:'C:\\Users\\辰辰洋洋\\.ilife\\data\\biscuit_accountant_html',
  bdir:'C:\\Users\\辰辰洋洋\\.ilife\\data\\backup',
  bstem:'biscuit_20260921_1830.db',
  hl:{lab:'配置体检', stat:'还没体检', act:'体检一次'}
};

/* ══ 主题（真值） ══ */
var THEMES={
  live:{label:'现场',bg:'#080808',surface:'#101010',surface2:'#181818',surface3:'#202020',line:'#1c1c1c',line2:'#282828',text:'#e0e0e0',muted:'#a8a8a8',faint:'#7c7c7c',accent:'#f8b080',accentInk:'#1a1206',inputBg:'#0b0b0b',inputLine:'#282828'},
  dshDark:{label:'DSH 深色',bg:'#151517',surface:'#232324',surface2:'#2c2c2e',surface3:'#353638',line:'#2a2a2c',line2:'#3a3a3d',text:'#f9fafb',muted:'#cfd3d6',faint:'#adb2b8',accent:'#f9fafb',accentInk:'#0f1115',inputBg:'#1b1b1c',inputLine:'#3a3a3d'},
  dshLight:{label:'DSH 浅色',bg:'#ffffff',surface:'#ffffff',surface2:'#f9fafb',surface3:'#e9ecf2',line:'rgba(0,0,0,.10)',line2:'rgba(0,0,0,.18)',text:'#0f1115',muted:'#61666b',faint:'#81858c',accent:'#0f1115',accentInk:'#ffffff',inputBg:'#ffffff',inputLine:'rgba(0,0,0,.18)'}
};
var THEME='live';
function tokens(){var t=THEMES[THEME];var a=[];for(var k in t){if(k!=='label')a.push('--'+k+':'+t[k]);}
  a.push('--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
  a.push('--mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace');return a.join(';');}
function styleHost(){var el=document.getElementById('vars');if(!el){el=document.createElement('style');el.id='vars';document.head.appendChild(el);}
  el.textContent=V.map(function(v){return '[data-v="'+v.id+'"]{'+tokens()+'}';}).join('\n');}

/* ══ 公共片段 ══ */
function head(withTabs){
  return '<div class="pgrow"><h1 class="pgh1">'+esc(D.page)+'</h1><div class="pgacts">'+
    '<button class="btn">检查更新</button><span class="ico">★</span><span class="ico">◍</span></div></div>'+
    '<div class="pgver">'+esc(D.ver)+'</div>'+
    '<div class="pgrow" style="margin-top:15px"><span style="font-weight:600;font-size:13.5px">'+esc(D.hl.lab)+'</span>'+
    '<span class="faint">'+esc(D.hl.stat)+'</span><button class="btn" style="margin-left:auto">'+esc(D.hl.act)+'</button></div>'+
    (withTabs===false?'':'<div class="tabs">'+D.tabs.map(function(t,i){return '<button class="tab'+(i===0?' on':'')+'">'+esc(t)+'</button>';}).join('')+'</div>');
}
function cardOpen(t){return '<div class="card"><div class="ctitle">'+esc(t||D.card)+'</div>';}
function metas(){return '<div class="cmeta"><span class="k">配置文件</span><span class="mono">'+esc(D.cfg)+'</span></div>'+
  '<div class="cmeta"><span class="k">数据目录</span><span class="mono">'+esc(D.dir)+'</span></div>';}
function roLine(k,v,m){return '<div class="rowl"><span class="lt '+(m||'off')+'"></span><div class="kv"><div class="k2">'+esc(k)+'<span class="chipr">只读</span></div><div class="v2">'+esc(v)+'</div></div></div>';}
function rwLine(k,v){return '<div class="rowl"><span class="lt ok"></span><div class="kv"><div class="k2">'+esc(k)+'</div><div class="v2">'+esc(v)+'</div></div><button class="btn mini">浏览</button></div>';}

/* ══ 30 个方向 ══ */
var V=[];
function add(id,fam,name,what,fn){V.push({id:id,fam:fam,name:name,what:what,fn:fn});}

/* A · 状态优先 */
add(1,'状态优先','检查台','配置项降级、状态升格：四个落点各一张卡，卡上是灯＋路径＋体积／最近写入。看的不是「能改什么」，是「哪里不对」。',function(){
  return head()+cardOpen('饼干记账 · 落点检查台')+
  '<div class="ledger"><span class="lt warn"></span><span class="big">4 个落点 · 3 就绪 · 1 还没建</span><span style="margin-left:auto;color:var(--faint);font-size:12px">最近读盘：刚刚</span></div>'+
  '<div class="cards2">'+
  '<div class="stcard"><div class="t"><span class="lt warn"></span>数据目录</div><div class="p">'+esc(D.dir)+'</div><div class="m"><span>12.4 MB</span><span>可写</span><span>1 分钟前写过</span></div></div>'+
  '<div class="stcard"><div class="t"><span class="lt ok"></span>库文件</div><div class="p">'+esc(D.db)+'</div><div class="m"><span>7.1 MB</span><span>7412 行</span><span>刚刚</span></div></div>'+
  '<div class="stcard"><div class="t"><span class="lt ok"></span>预算／账户文件</div><div class="p">'+esc(D.goals)+'</div><div class="m"><span>3 个目标</span><span>昨天</span></div></div>'+
  '<div class="stcard"><div class="t"><span class="lt off"></span>HELP 产物目录</div><div class="p">'+esc(D.html)+'</div><div class="m"><span>目录还没建</span><span>说一次「饼干记账HELP」即生成</span></div></div>'+
  '</div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri">体检一次</button><button class="btn">打开数据目录</button><button class="btn ghost">备份</button></div>'+
  '</div>';
});
add(2,'状态优先','总账 + 清单','一句话总账打头，四条落点只报「名字＋路径＋灯」，不画框不画输入框。最少装饰的状态流。',function(){
  return head()+cardOpen()+
  '<div style="display:flex;align-items:baseline;gap:12px"><div style="font-size:22px;font-weight:640;letter-spacing:-.4px">3 / 4 落点就绪</div><span class="faint">缺：HELP 产物目录（说一次「饼干记账HELP」即生成）</span></div>'+
  metas()+'<div style="margin-top:14px">'+
  roLine('数据目录',D.dir,'warn')+roLine('库文件名',D.db,'ok')+roLine('预算／账户文件名',D.goals,'ok')+roLine('HELP 产物目录名',D.html,'off')+
  roLine('备份目录',D.bdir,'ok')+roLine('备份文件名前缀',D.bstem,'ok')+
  '</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri">体检一次</button><button class="btn">重新读取</button><button class="btn ghost">重置为默认</button></div></div>';
});
add(3,'状态优先','仪表磁贴','三个大数字磁贴打头（占用／备份份数／上次体检），落点清单缩到下面。面板先回答「我的数据现在什么状况」。',function(){
  return head()+cardOpen()+
  '<div class="tiles"><div class="tile2"><div class="n">12.4 MB</div><div class="c">数据目录占用</div></div>'+
  '<div class="tile2"><div class="n">7 份</div><div class="c">备份（最近 3 天前）</div></div>'+
  '<div class="tile2"><div class="n">—</div><div class="c">上次体检：还没体检</div></div></div>'+
  metas()+'<div style="margin-top:14px">'+roLine('数据目录',D.dir,'warn')+roLine('库文件名',D.db,'ok')+roLine('预算／账户文件名',D.goals,'ok')+roLine('HELP 产物目录名',D.html,'off')+'</div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri">体检一次</button><button class="btn">打开数据目录</button></div></div>';
});
add(4,'状态优先','六家状态墙','整屏是六家的灯墙（跨技能），饼干记账那格展开显示它的落点。配置退成二级——先看全局再钻。',function(){
  var names=['饼干记账','卡路里','备忘录','作息管家','居家管家','私家大厨'];
  var st=['1 个落点待建','全部就绪','全部就绪','全部就绪','全部就绪','全部就绪'];
  var cells=names.map(function(n,i){
    if(i!==0) return '<div class="wcell"><div class="wn"><span class="lt ok"></span>'+n+'</div><div class="ws">'+st[i]+'</div></div>';
    return '<div class="wcell open"><div class="wn"><span class="lt warn"></span>'+n+'<span class="faint" style="margin-left:auto;font-weight:400">当前</span></div><div class="ws">'+st[i]+'</div>'+
      '<div style="margin-top:10px">'+roLine('数据目录',D.dir,'warn')+roLine('库文件名',D.db,'ok')+roLine('预算／账户文件名',D.goals,'ok')+roLine('HELP 产物目录名',D.html,'off')+
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri">体检一次</button><button class="btn">打开数据目录</button></div></div></div>';
  }).join('');
  return head(false)+'<div class="wall">'+cells+'</div>';
});

/* B · 一屏一事 */
add(5,'一屏一事','抽屉检查器','列表只留四行摘要，点谁谁从右侧滑出抽屉（原型里第 1 行已展开）。一次只占一屏一件事，长表单被切断。',function(){
  return head()+cardOpen()+
  '<div class="drawer"><div class="dlist">'+
  '<div class="drow on"><span class="lt warn"></span><div class="kv"><div class="k2">数据目录</div><div class="v2">'+esc(D.dir)+'</div></div><span class="faint">›</span></div>'+
  '<div class="drow"><span class="lt ok"></span><div class="kv"><div class="k2">库文件名</div><div class="v2">biscuit_accountant.db</div></div><span class="faint">›</span></div>'+
  '<div class="drow"><span class="lt ok"></span><div class="kv"><div class="k2">预算／账户文件名</div><div class="v2">goals.json</div></div><span class="faint">›</span></div>'+
  '<div class="drow"><span class="lt off"></span><div class="kv"><div class="k2">HELP 产物目录名</div><div class="v2">biscuit_accountant_html</div></div><span class="faint">›</span></div>'+
  '</div><div class="dpanel"><div style="font-size:13px;font-weight:600">数据目录</div>'+
  '<div class="muted" style="margin-top:6px">库文件与备份的根目录。留空＝用默认目录。</div>'+
  '<input class="f" style="margin-top:10px" value="'+esc(D.dir)+'">'+
  '<div style="display:flex;gap:7px;margin-top:9px"><button class="btn pri">保存</button><button class="btn">浏览</button><button class="btn ghost">恢复默认</button></div>'+
  '<div class="faint" style="margin-top:14px">这个目录里现在有 3 个文件：</div>'+
  '<div class="mono faint" style="margin-top:5px;line-height:1.9">biscuit_accountant.db<br>goals.json<br>backup/</div></div></div></div>';
});
add(6,'一屏一事','折叠手风琴','四段折叠，每段标题直接显示当前值，默认只开第一段。信息总量不变，占屏面积减半。',function(){
  return head()+cardOpen()+
  '<div class="acc"><details open><summary><span class="lt warn"></span>数据目录<span class="faint" style="margin-left:auto;font-weight:400;font-family:var(--mono);font-size:11.5px">…\\.ilife\\data</span></summary>'+
  '<div class="abody"><div class="muted">库文件与备份的根目录。留空＝用默认目录。</div><input class="f" style="margin-top:8px" value="'+esc(D.dir)+'"><div style="display:flex;gap:7px;margin-top:9px"><button class="btn pri">保存</button><button class="btn">浏览</button></div></div></details>'+
  '<details><summary><span class="lt ok"></span>库文件名<span class="faint" style="margin-left:auto;font-weight:400">biscuit_accountant.db</span></summary><div class="abody"><div class="mono faint">'+esc(D.db)+'</div></div></details>'+
  '<details><summary><span class="lt ok"></span>预算／账户文件名<span class="faint" style="margin-left:auto;font-weight:400">goals.json</span></summary><div class="abody"><div class="mono faint">'+esc(D.goals)+'</div></div></details>'+
  '<details><summary><span class="lt off"></span>HELP 产物目录名<span class="faint" style="margin-left:auto;font-weight:400">还没建</span></summary><div class="abody"><div class="mono faint">'+esc(D.html)+'</div></div></details>'+
  '</div></div>';
});
add(7,'一屏一事','向导三步','配置变成一条三步流程：数据放哪 → 产物放哪 → 体检。一次一屏，带进度与「跳过」。首配友好，回访要能跳。',function(){
  return head(false)+'<div class="card"><div class="steps">'+
  '<span class="step on"><span class="num">1</span>数据放哪</span><span class="faint">›</span>'+
  '<span class="step"><span class="num">2</span>产物放哪</span><span class="faint">›</span>'+
  '<span class="step"><span class="num">3</span>体检</span></div>'+
  '<div style="margin-top:22px;font-size:19px;font-weight:620">你的账本放在哪？</div>'+
  '<div class="muted" style="margin-top:7px">库文件、预算文件、备份都会放进这个目录里的子目录。选一个已经有数据的位置，技能就跟上。</div>'+
  '<input class="f" style="margin-top:14px;font-size:13.5px;padding:9px 12px" value="'+esc(D.dir)+'">'+
  '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
  '<button class="btn">默认位置（.ilife\\data）</button><button class="btn">上次用过的位置</button><button class="btn">浏览…</button></div>'+
  '<div style="display:flex;gap:9px;align-items:center;margin-top:22px"><button class="btn pri">下一步</button><button class="btn ghost">跳过这一步</button><span class="faint" style="margin-left:auto">第 1 / 3 步</span></div></div></div>';
});
add(8,'一屏一事','纵向站点时间轴','把落点按「技能一次运行的读写顺序」排成竖线：启动 → 读库 → 写产物 → 备份。用户看懂的是数据怎么流，不是字段怎么填。',function(){
  return head()+cardOpen()+
  '<div class="muted">技能每次运行都按这条线走。任何一站不通，后面的产物就出不来。</div><div class="tl">'+
  '<div class="tlnode on"><div class="nt">① 启动 · 读配置</div><div class="nv mono">'+esc(D.cfg)+'</div></div>'+
  '<div class="tlnode"><div class="nt">② 打开账本</div><div class="nv mono">'+esc(D.db)+'</div></div>'+
  '<div class="tlnode"><div class="nt">③ 写结果页</div><div class="nv mono">'+esc(D.html)+'</div><div class="faint">目录还没建 —— 说一次「饼干记账HELP」就会建</div></div>'+
  '<div class="tlnode"><div class="nt">④ 备份</div><div class="nv mono">'+esc(D.bdir)+'\\'+esc(D.bstem)+'</div></div>'+
  '</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri">从第 ① 站跑一遍体检</button><button class="btn">打开数据目录</button></div></div>';
});
add(9,'一屏一事','单问一屏','整个面板只剩一个问题「库文件放哪？」，一个大输入框 + 三个推荐位置；其余四项折叠成一行小字。极端减法。',function(){
  return head(false)+'<div class="card" style="padding:26px 24px">'+
  '<div style="font-size:24px;font-weight:640;letter-spacing:-.4px">库文件放哪？</div>'+
  '<div class="muted" style="margin-top:8px">改这一个就行——预算文件、备份、结果页都跟着它走。</div>'+
  '<input class="f" style="margin-top:16px;font-size:14px;padding:11px 13px" value="'+esc(D.dir)+'">'+
  '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pri">就这么定</button><button class="btn">浏览…</button><button class="btn ghost">用默认位置</button></div>'+
  '<div class="faint" style="margin-top:20px;border-top:1px solid var(--line);padding-top:12px">其余 4 项（库文件名 · 预算／账户文件名 · HELP 产物目录名 · 备份目录）都由技能算好放在同一个目录里 <span style="color:var(--accent);cursor:pointer">展开看</span></div></div></div>';
});

/* C · 文件系统 */
add(10,'文件系统','真目录树','落点画成一棵真目录树，节点带角色徽标，还没落盘的目录画虚线。用户在自己的文件系统里理解配置。',function(){
  return head()+cardOpen()+
  '<div class="tree"><div class="tnode"><span class="glyph">▾</span><span class="nm">C:\\</span></div><div class="tkids">'+
  '<div class="tnode"><span class="glyph">▾</span><span class="nm">Users</span></div><div class="tkids">'+
  '<div class="tnode"><span class="glyph">▾</span><span class="nm">辰辰洋洋</span></div><div class="tkids">'+
  '<div class="tnode"><span class="glyph">▾</span><span class="nm">.ilife</span></div><div class="tkids">'+
  '<div class="tnode" style="background:var(--surface2);border-radius:6px;padding:6px 8px;margin:2px 0"><span class="glyph">▾</span><span class="nm">data</span><span class="badge">数据目录</span><span class="vv">12.4 MB</span></div>'+
  '<div class="tkids">'+
  '<div class="tnode"><span class="glyph">·</span><span class="nm">biscuit_accountant.db</span><span class="badge">库</span><span class="vv">7.1 MB</span></div>'+
  '<div class="tnode"><span class="glyph">·</span><span class="nm">goals.json</span><span class="badge">预算／账户</span><span class="vv">412 B</span></div>'+
  '<div class="tnode"><span class="glyph">▸</span><span class="nm" style="color:var(--muted)">biscuit_accountant_html</span><span class="badge">产物</span><span class="vv" style="color:var(--faint)">还没建</span></div>'+
  '<div class="tnode"><span class="glyph">▸</span><span class="nm">backup</span><span class="badge">备份</span><span class="vv">7 份</span></div>'+
  '</div></div><div class="tnode"><span class="glyph">·</span><span class="nm">bill.yaml</span><span class="badge">配置文件</span></div>'+
  '</div></div></div></div></div></div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri">在资源管理器里打开 data</button><button class="btn">改数据目录</button><button class="btn ghost">体检一次</button></div></div>';
});
add(11,'文件系统','双栏资源管理器','左边目录树、右边详情栏（Windows 资源管理器那一套）。左边选位置，右边看这个位置的四个落点。',function(){
  return head()+cardOpen()+
  '<div class="expl"><div class="pane">'+
  '<div class="tnode" style="padding:6px 14px"><span class="glyph">▾</span><span class="nm">.ilife</span></div>'+

/* ══ 渲染与交互 ══ */
/* 归一化：把每个方向的输出丢进游离节点再取回来。
   浏览器解析片段时会忽略多余的 (多出来的) 结束标签、并自动补齐未闭合的，
   于是 30 个手写方向里任何一处 div 不平衡都不会再撑破外层网格。 */
function norm(html){var t=document.createElement('div');t.innerHTML=html;return t.innerHTML;}
function stageHTML(v){return '<div class="stage" data-v="'+v.id+'">'+norm(v.fn())+'</div>';}
function stripHTML(v){return '<div class="strip"><div class="s1"><span class="no">方向 '+v.id+' / '+V.length+'</span><span class="nm">'+esc(v.name)+'</span><span class="fam">'+esc(v.fam)+'</span></div>'+
  '<div class="what">'+esc(v.what)+'</div></div>';}
var KEY='ilife-panel-dir-v1';
var store={votes:{},top:''};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);store.votes=p.votes||{};store.top=p.top||'';}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var cur=1,mode='one';
function vById(id){for(var i=0;i<V.length;i++){if(V[i].id===id)return V[i];}return V[0];}
var view=document.getElementById('view'),bbar=document.getElementById('bbar');
function renderOne(){
  var v=vById(cur);
  document.title='方向 '+v.id+' · '+v.name;
  view.innerHTML='<div class="stagewrap" style="flex-direction:column;align-items:center">'+stripHTML(v)+stageHTML(v)+'</div>';
  bbar.classList.remove('hidden');
  var rec=store.votes[v.id]||{};
  document.getElementById('vg').classList.toggle('on',rec.vote==='good');
  document.getElementById('vb').classList.toggle('on',rec.vote==='bad');
  document.getElementById('bnote').value=rec.note||'';
  document.getElementById('navk').textContent='方向 '+v.id+' · '+v.name;
  updateProg();
}
function tileHTML(v){
  var rec=store.votes[v.id]||{};
  var cls=rec.vote==='good'?'g':(rec.vote==='bad'?'b':'n');
  var txt=rec.vote==='good'?'好看':(rec.vote==='bad'?'不好看':'未评');
  return '<div class="tile"><div class="tilehead"><b>'+v.id+'</b><span class="tt">'+esc(v.name)+'</span><span class="vb '+cls+'">'+txt+'</span></div>'+
  '<div class="tilebox" data-open="'+v.id+'" title="点开看整版"><div class="scaler">'+stageHTML(v)+'</div></div>'+
  '<div class="tilefoot"><button class="mini g'+(rec.vote==='good'?' on':'')+'" data-vote="'+v.id+':good">好看</button>'+
  '<button class="mini b'+(rec.vote==='bad'?' on':'')+'" data-vote="'+v.id+':bad">不好看</button>'+
  '<span style="flex:1"></span><span style="font-size:11px;color:#66666e">'+esc(v.fam)+'</span></div></div>';
}
function renderOverview(){
  document.title='方向原型 · 总览 30 版';
  view.innerHTML='<div class="ov"><div style="max-width:1100px;margin:0 auto 16px;font-size:12.5px;color:#8b8b95;line-height:1.8">'+
  '30 个方向：不是同一个东西换皮肤，是换物种。点格子看整版，或直接点格子下方「好看／不好看」。<br>'+
  '最想留下的三版：<input id="topin" class="bnote" style="display:inline-block;width:250px;min-width:0;padding:3px 8px" placeholder="填序号，例：01、16、27" value="'+esc(store.top)+'"></div>'+
  '<div class="ovgrid">'+V.map(tileHTML).join('')+'</div></div>';
  bbar.classList.add('hidden');updateProg();
}
function updateProg(){
  var g=0,b=0;V.forEach(function(v){var r=store.votes[v.id];if(r&&r.vote==='good')g++;if(r&&r.vote==='bad')b++;});
  document.getElementById('prog').textContent='已评 '+(g+b)+' / '+V.length+'（好看 '+g+' · 不好看 '+b+'）';
}
function vote(kind){
  var id=vById(cur).id,rec=store.votes[id]||{};
  rec.vote=(rec.vote===kind)?null:kind;if(!rec.vote)delete rec.vote;
  rec.note=document.getElementById('bnote').value||'';
  store.votes[id]=rec;persist();renderOne();
}
function goto(id){cur=Math.min(V.length,Math.max(1,id));renderOne();}
document.getElementById('vg').onclick=function(){vote('good');};
document.getElementById('vb').onclick=function(){vote('bad');};
document.getElementById('prev').onclick=function(){goto(cur-1);};
document.getElementById('next').onclick=function(){goto(cur+1);};
document.getElementById('bnote').oninput=function(){var id=vById(cur).id,rec=store.votes[id]||{};rec.note=this.value;store.votes[id]=rec;persist();};
function syncMode(){document.getElementById('btnOne').classList.toggle('on',mode==='one');document.getElementById('btnOv').classList.toggle('on',mode==='ov');}
document.getElementById('btnOne').onclick=function(){mode='one';syncMode();renderOne();};
document.getElementById('btnOv').onclick=function(){mode='ov';syncMode();renderOverview();};
var TK=['live','dshDark','dshLight'],ti=0;
document.getElementById('btnTheme').onclick=function(){ti=(ti+1)%TK.length;THEME=TK[ti];styleHost();this.textContent='主题：'+THEMES[THEME].label;if(mode==='one')renderOne();else renderOverview();};
view.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.getAttribute)return;
  if(t.getAttribute('data-open')){goto(parseInt(t.getAttribute('data-open'),10));return;}
  if(t.getAttribute('data-vote')){
    var a=t.getAttribute('data-vote').split(':'),id=parseInt(a[0],10),k=a[1];
    var rec=store.votes[id]||{};rec.vote=(rec.vote===k)?null:k;if(!rec.vote)delete rec.vote;
    store.votes[id]=rec;persist();renderOverview();return;
  }
});
view.addEventListener('input',function(e){if(e.target&&e.target.id==='topin'){store.top=e.target.value;persist();}});
document.addEventListener('keydown',function(e){
  if(mode!=='one')return;
  var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='ArrowLeft'){goto(cur-1);}
  else if(e.key==='ArrowRight'){goto(cur+1);}
  else if(e.key==='1'){vote('good');}
  else if(e.key==='2'){vote('bad');}
  else if(e.key==='0'){var id=vById(cur).id;store.votes[id]={note:''};persist();renderOne();}
});
function pad(x){return x<10?'0'+x:''+x;}
function exportText(){
  var g=[],b=[],n=[];
  V.forEach(function(v){var r=store.votes[v.id];if(r&&r.vote==='good')g.push(v.id);else if(r&&r.vote==='bad')b.push(v.id);else n.push(v.id);});
  var L=[];
  L.push('配置面板 · 方向原型判定回执（30 版 · 主题＝'+THEMES[THEME].label+'）');
  L.push('');
  L.push('好看（'+g.length+'）：'+(g.map(pad).join('、')||'—'));
  L.push('不好看（'+b.length+'）：'+(b.map(pad).join('、')||'—'));
  L.push('未评（'+n.length+'）：'+(n.map(pad).join('、')||'—'));
  L.push('最想留下的三版：'+(store.top||'—'));
  L.push('');
  L.push('— 逐版备注 —');
  V.forEach(function(v){var r=store.votes[v.id];if(r&&r.note)L.push(pad(v.id)+' '+v.name+'：'+r.note);});
  L.push('');
  L.push('— 逐版（序号|族|方向|判定|备注）—');
  V.forEach(function(v){var r=store.votes[v.id]||{};L.push([pad(v.id),v.fam,v.name,(r.vote||'none'),(r.note||'').replace(/\|/g,'/')].join('|'));});
  return L.join('\n');
}
document.getElementById('btnExp').onclick=function(){document.getElementById('exp').value=exportText();document.getElementById('mask').classList.remove('hidden');};
document.getElementById('closeExp').onclick=function(){document.getElementById('mask').classList.add('hidden');};
document.getElementById('copyBtn').onclick=function(){
  var ta=document.getElementById('exp');ta.select();
  try{document.execCommand('copy');this.textContent='已复制';}catch(e){this.textContent='请手动全选复制';}
  var self=this;setTimeout(function(){self.textContent='复制';},1600);
};
document.getElementById('mask').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
styleHost();syncMode();
var q=/[?&]v=(\d+)/.exec(location.search),dv=q?parseInt(q[1],10):0;
if(dv>=1&&dv<=V.length){mode='one';cur=dv;syncMode();renderOne();}else{mode='ov';syncMode();renderOverview();}
})();
</script>
