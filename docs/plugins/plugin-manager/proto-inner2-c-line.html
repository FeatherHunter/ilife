  next.disabled = (plan.spread === plan.spreadCount - 1);
  if (location.search.indexOf('debug') >= 0) {
    document.querySelector('.note').textContent = '页数 ' + plan.pageCount + ' · 跨页 ' + plan.spreadCount + ' · 纸 ' + plan.sheets.length + ' · 书签宽 ' + plan.tab.width.toFixed(2) + '%';
  }
}
function faceTab(pg, side, off) {
  return "<span class='tab on' style='" + side + ":" + (off * 2) + "%'>" + pg + "</span>";
}
function pageByNumber(plan, n) {
  if (n === null) return null;
  for (var i = 0; i < plan.pages.length; i++) if (plan.pages[i].page === n) return plan.pages[i];
  return null;
}
function turnLeaf(dir) {
  if (busy) return;
  var plan = planManual(SCENES, sp);
  var k = dir > 0 ? sp + 1 : sp;
  var sheet = plan.sheets[k];
  if (!sheet) return;
  var facing = sheet.facing;
  var other = facing === sheet.front ? sheet.back : sheet.front;
  if (facing === null || other === null) return;
  busy = true;
  var book = document.getElementById('sp');
  var leaf = document.createElement('div');
  leaf.className = 'leaf ' + (dir > 0 ? 'R' : 'L');
  var target = planManual(SCENES, sp + dir);
  var frontPage = pageByNumber(plan, facing);
  var backPage = pageByNumber(target, other);
  leaf.innerHTML = "<div class='face front'>" + (frontPage ? pageBody(frontPage) : '') + faceTab(facing, dir > 0 ? 'left' : 'right', sheet.tabOffset) + "</div>" +
                   "<div class='face back'>" + (backPage ? pageBody(backPage) : '') + faceTab(other, dir > 0 ? 'right' : 'left', sheet.tabOffset) + "</div>";
  var hidden = document.getElementById("sh" + k);
  if (hidden) hidden.style.visibility = "hidden";
  book.appendChild(leaf);
  void leaf.offsetWidth;
  leaf.classList.add(dir > 0 ? 'toL' : 'toR');
  leaf.addEventListener('animationend', function (e) {
    if (e.target !== leaf) return;
    sp += dir; render(); leaf.remove(); busy = false;
  });
}
prev.addEventListener('click', function () { if (sp > 0) turnLeaf(-1); });
next.addEventListener('click', function () { if (sp < planManual(SCENES, sp).spreadCount - 1) turnLeaf(1); });
render();
if (location.search.indexOf('bare') >= 0) document.body.classList.add('bare');
if (location.search.indexOf('alpha') >= 0) document.body.classList.add('alpha');
if (location.search.indexOf('turn') >= 0) setTimeout(function () { document.getElementById('next').click(); }, 120);
</script>
</body></html>
