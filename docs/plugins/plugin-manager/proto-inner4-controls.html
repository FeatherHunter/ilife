        var goo = one('.goo'), dot = one('.goo b');
        stage.addEventListener('pointermove', function (e) { var r = goo.getBoundingClientRect(); var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
          goo.style.transform = 'translate(' + dx * .16 + 'px,' + dy * .16 + 'px) scale(' + (1 + Math.abs(dx) / 900) + ',' + (1 - Math.abs(dx) / 1400) + ')';
          goo.style.borderRadius = (50 + dx * .35) + '% ' + (50 - dx * .35) + '% ' + (50 - dy * .3) + '% ' + (50 + dy * .3) + '%';
          dot.style.transform = 'translate(' + dx * .45 + 'px,' + dy * .45 + 'px)'; });
        stage.addEventListener('pointerleave', function () { goo.style.transform = ''; goo.style.borderRadius = '50%'; dot.style.transform = ''; });
      }
      if (kind === 'parallax') {
        var pc = one('.pcard');
        stage.addEventListener('pointermove', function (e) { var r = stage.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
          pc.style.transform = 'perspective(600px) rotateY(' + px * 26 + 'deg) rotateX(' + (-py * 22) + 'deg)'; });
        stage.addEventListener('pointerleave', function () { pc.style.transform = ''; });
      }
      if (kind === 'center') {
        var items = all('.strip b');
        stage.addEventListener('pointermove', function (e) { var best = null, bd = 1e9;
          items.forEach(function (n) { var r = n.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)); if (d < bd) { bd = d; best = n; } });
          items.forEach(function (n) { n.classList.toggle('focus', n === best); }); });
        stage.addEventListener('pointerleave', function () { items.forEach(function (n) { n.classList.remove('focus'); }); });
      }
      if (kind === 'liquidtab') {
        var box = one('.ltabs'), ind = one('.ltabs i'), tabs = all('.ltabs b');
        tabs.forEach(function (t, i) {
          t.addEventListener('click', function () {
            box.classList.add('stretch');
            ind.style.width = t.offsetWidth + 'px'; ind.style.transform = 'translateX(' + (t.offsetLeft - 4) + 'px)';
            setTimeout(function () { box.classList.remove('stretch'); }, 240);
          });
        });
      }
      if (kind === 'expand') {
        one('.thumb').addEventListener('click', function () {
          var lb = overlay(page, "<div class='lightbox'><b data-close>收起</b></div>");
          lb.querySelector('.lightbox').animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.9,.25,1.3)' });
        });
      }
      if (kind === 'swipe') {
        var tray = one('.tray'), idx = 0, sx = 0, dragging = false, startX = 0;
        var apply = function (i, anim) { tray.style.transition = anim ? 'transform .45s cubic-bezier(.2,.9,.25,1.35)' : 'none'; tray.style.transform = 'translateX(' + (-i * 33.333) + '%)'; };
        tray.addEventListener('pointerdown', function (e) { dragging = true; startX = e.clientX; sx = -idx * 33.333; tray.setPointerCapture(e.pointerId); });
        tray.addEventListener('pointermove', function (e) { if (!dragging) return; var r = tray.parentNode.getBoundingClientRect(); tray.style.transition = 'none'; tray.style.transform = 'translateX(' + (sx + (e.clientX - startX) / r.width * 100) + '%)'; });
        tray.addEventListener('pointerup', function (e) { if (!dragging) return; dragging = false; var r = tray.parentNode.getBoundingClientRect(); var moved = (e.clientX - startX) / r.width; if (moved < -.12) idx = Math.min(2, idx + 1); else if (moved > .12) idx = Math.max(0, idx - 1); apply(idx, true); });
      }
      if (kind === 'collide') {
        var cs = all('.chips b');
        cs.forEach(function (c) { c.addEventListener('click', function () { flip(cs, function () { cs.forEach(function (x) { x.classList.remove('big'); }); c.classList.add('big'); }); }); });
      }
      if (kind === 'multi') {
        all('.chips b').forEach(function (c) { c.addEventListener('click', function () { c.classList.toggle('on'); }); });
      }
      if (kind === 'remove') {
        all('.chips b i').forEach(function (x) {
          x.addEventListener('click', function (e) {
            e.stopPropagation();
            var chip = x.parentNode, rest = all('.chips b').filter(function (n) { return n !== chip; });
            flip(rest, function () { chip.remove(); });
          });
        });
      }
      if (kind === 'suggest') {
        var inp = one('input'), ul = one('ul'), pool = ['饼干记账 HELP', '卡路里 HELP', '作息管家 HELP', '私家大厨 HELP', '居家管家 HELP'];
        inp.addEventListener('input', function () {
          var v = inp.value.trim(), hit = pool.filter(function (t) { return v === '' || t.indexOf(v) >= 0; });
          ul.innerHTML = hit.map(function (t) { return '<li>' + t + '</li>'; }).join('');
          ul.classList.toggle('open', hit.length > 0);
          Array.prototype.slice.call(ul.querySelectorAll('li')).forEach(function (li) { li.addEventListener('click', function () { inp.value = li.textContent; ul.classList.remove('open'); }); });
        });
        inp.addEventListener('blur', function () { setTimeout(function () { ul.classList.remove('open'); }, 160); });
      }
      if (kind === 'ruler') {
        var rl = one('.ruler'), mk = one('.mark'), vv = one('.val'), on = false;
        var set = function (e) { var r = rl.getBoundingClientRect(); var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); mk.style.left = (p * 100) + '%'; vv.textContent = Math.round(p * 100); };
        rl.addEventListener('pointerdown', function (e) { on = true; rl.setPointerCapture(e.pointerId); set(e); });
        rl.addEventListener('pointermove', function (e) { if (on) set(e); });
        rl.addEventListener('pointerup', function () { on = false; });
      }
      if (kind === 'ripple') {
        var rb = one('.ripple');
        rb.addEventListener('pointerdown', function (e) { var r = rb.getBoundingClientRect(); var s = document.createElement('span'); s.className = 'rp';
          var d = Math.max(r.width, r.height); s.style.width = s.style.height = d + 'px'; s.style.left = (e.clientX - r.left - d / 2) + 'px'; s.style.top = (e.clientY - r.top - d / 2) + 'px';
          rb.appendChild(s); setTimeout(function () { s.remove(); }, 620); });
      }
      if (kind === 'hold') {
        var hb = one('.holdbtn'), bar = one('.bar'), tt = one('.t'), timer = null, t0 = 0;
        var stop = function () { if (timer) clearInterval(timer); timer = null; setTimeout(function () { bar.style.width = '0'; tt.textContent = '0.0s'; }, 900); };
        hb.addEventListener('pointerdown', function () { t0 = Date.now(); timer = setInterval(function () { var s = (Date.now() - t0) / 1000; bar.style.width = Math.min(100, s * 18) + '%'; tt.textContent = s.toFixed(1) + 's'; }, 60); });
        hb.addEventListener('pointerup', stop); hb.addEventListener('pointerleave', stop);
      }
      if (kind === 'curves') {
        var cv = one('.curves');
        cv.addEventListener('click', function () { cv.classList.toggle('go'); setTimeout(function () { cv.classList.toggle('go'); }, 1200); });
      }
      if (kind === 'mouse') {
        var dr = one('.drag'), dx0 = 0, dy0 = 0, moving = false;
        dr.addEventListener('pointerdown', function (e) { moving = true; dx0 = e.clientX; dy0 = e.clientY; dr.classList.add('dragging'); dr.setPointerCapture(e.pointerId); });
        dr.addEventListener('pointermove', function (e) { if (!moving) return; dr.style.transform = 'translate(' + (e.clientX - dx0) + 'px,' + (e.clientY - dy0) + 'px)'; });
        dr.addEventListener('pointerup', function () { moving = false; dr.classList.remove('dragging'); dr.style.transition = 'transform .3s cubic-bezier(.2,.9,.25,1.5)'; dr.style.transform = ''; });
      }
      if (kind === 'popover') { var po = one('.po'); po.addEventListener('click', function () { po.classList.toggle('open'); }); }
      if (kind === 'dropdown') {
        var dd = one('.dd');
        dd.querySelector('button').addEventListener('click', function () { dd.classList.toggle('open'); });
        Array.prototype.slice.call(dd.querySelectorAll('li')).forEach(function (li) { li.addEventListener('click', function () { dd.querySelector('button').textContent = li.textContent + ' ▾'; dd.classList.remove('open'); }); });
      }
      if (kind === 'modal') one('.dm-btn').addEventListener('click', function () {
        overlay(page, "<div class='mcard'><b>modal</b><em>整张纸面被遮住，卡片居中；点空白或右上角关掉。</em><button class='xbtn' data-close>✕</button></div>");
      });
      if (kind === 'sheet') one('.dm-btn').addEventListener('click', function () {
        overlay(page, "<div class='sheetc'><b>bottomsheet</b><em>从纸面底部升起，往上拖或点空白关掉。</em></div>");
      });
      if (kind === 'drawer') one('.dm-btn').addEventListener('click', function () {
        overlay(page, "<div class='drawerc'><b>drawer</b><em>从纸面右侧滑出。</em></div>");
      });
      if (kind === 'toast') one('.dm-btn').addEventListener('click', function () {
        var t = document.createElement('div'); t.className = 'toastc'; t.textContent = one('.dm-btn').getAttribute('data-toast');
        page.appendChild(t); setTimeout(function () { t.style.transition = 'opacity .3s ease'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 320); }, 1400);
      });
      if (kind === 'notice') one('.dm-btn').addEventListener('click', function () {
        var n = document.createElement('div'); n.className = 'noticec';
        n.innerHTML = "<b>结果已发回飞书</b><em>点这里收起</em>";
        page.appendChild(n);
        n.addEventListener('click', function () { n.style.transition = 'transform .3s ease,opacity .3s ease'; n.style.transform = 'translateX(110%)'; n.style.opacity = '0'; setTimeout(function () { n.remove(); }, 320); });
      });
      if (kind === 'popconfirm') {
        var pcw = one('.pc');
        pcw.querySelector('.dm-btn').addEventListener('click', function () { pcw.classList.toggle('open'); });
        pcw.querySelector('.yes').addEventListener('click', function () { pcw.classList.remove('open'); var b = pcw.querySelector('.dm-btn'); b.textContent = '已删除'; b.disabled = true; });
        pcw.querySelector('.no2').addEventListener('click', function () { pcw.classList.remove('open'); });
      }
      if (kind === 'progress') {
        var pb = one('.pb i'), v = 0;
        setInterval(function () { v = v >= 100 ? 0 : v + 2; pb.style.width = v + '%'; }, 90);
      }
    })(stages[si]);
  }
}
render();

</script>
</body></html>
