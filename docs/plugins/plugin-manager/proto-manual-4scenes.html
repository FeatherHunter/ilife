// 手册书排版（票 #1193 → 施工 #1195）：场景表 → 页／跨页／纸／书签，一次算清。
// 纯计算：零 DOM、零宿主知识。界面只读这里算出来的结果，不自己再算一遍。
// 几何口径见 docs/plugins/plugin-manager/书籍外壳-定稿.md（用户 2026-10-08 认可的定稿）。
//
// 规则：一个场景＝一页 → 页数＝场景数 → 跨页＝⌈页数/2⌉ → 纸＝⌊页数/2⌋+1。
// 一张纸一个书签：正面印偶数页、反面印奇数页，翻过去号码自动换成反面那一页；
// 纸一多，书签与间距一起等比收窄，保证最外那枚不越出「中缝 → 纸边」这半边。
// 书签几何。单位一律是「纸面宽度的百分比」，取自定稿件；要调形状改这一处。
const TAB_WIDTH = 5.9;
const TAB_HEIGHT = 5.4;
const TAB_FONT = 1.9;
const TAB_RADIUS = 0.9;
const TAB_FIRST = 5.5; // 第一枚离中缝多远
const TAB_PITCH = 7.1; // 相邻两枚的间距
const HALF = 50; // 中缝到纸边的跨度
const EDGE = 1; // 留一点边，别贴到红框
const MIN_WIDTH = 3; // 再窄就印不下号了
/** 纸一多就等比收窄：缩小倍数取「排得下」与「不放大」里小的那个。 */
function tabScale(sheetCount) {
    const span = TAB_FIRST + TAB_PITCH * (sheetCount - 1) + TAB_WIDTH;
    return Math.min(1, (HALF - EDGE) / span);
}
/**
 * 把场景表排成一本书在某一跨页上的样子。
 * @param scenes 场景清单，顺序就是页码顺序
 * @param spread 要看第几个跨页（从 0 起）；越界会被夹到第一／最后一跨页
 */
export function planManual(scenes, spread) {
    const pageCount = scenes.length;
    const spreadCount = Math.max(1, Math.ceil(pageCount / 2));
    const at = Math.min(Math.max(spread, 0), spreadCount - 1);
    const pages = [];
    if (pageCount > 0) {
        for (const page of [2 * at + 1, 2 * at + 2]) {
            if (page > pageCount)
                continue;
            const scene = scenes[page - 1];
            pages.push({ page, key: scene.key, title: scene.title, side: page % 2 === 1 ? 'left' : 'right', state: scene.state });
        }
    }
    const sheetCount = pageCount === 0 ? 0 : Math.floor(pageCount / 2) + 1;
    const scale = tabScale(sheetCount === 0 ? 1 : sheetCount);
    const sheets = [];
    for (let sheet = 0; sheet < sheetCount; sheet++) {
        const front = sheet === 0 ? 1 : 2 * sheet;
        const backRaw = sheet === 0 ? null : 2 * sheet + 1;
        const back = backRaw !== null && backRaw <= pageCount ? backRaw : null;
        const onLeft = sheet === 0 || sheet <= at;
        sheets.push({
            sheet,
            front,
            back,
            facing: sheet === 0 ? 1 : onLeft ? (back ?? front) : front,
            side: onLeft ? 'left' : 'right',

        });

    return {
        spread: at,
        spreadCount,
        pageCount,
        pages,
        sheets,
        tab: {
            width: TAB_WIDTH * scale,
            height: TAB_HEIGHT * scale,
            font: TAB_FONT * scale,
            radius: TAB_RADIUS * scale,

function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function sceneOf(page) { for (var i = 0; i < SCENES.length; i++) if (SCENES[i].key === page.key) return SCENES[i]; return null; }
function allPages() { var p0 = planManual(SCENES, 0), out = []; for (var i = 0; i < p0.spreadCount; i++) { var ps = planManual(SCENES, i).pages; for (var j = 0; j < ps.length; j++) out.push(ps[j]); } return out; }
function sceneSpread(key) { var ps = allPages(); for (var i = 0; i < ps.length; i++) if (ps[i].key === key) return Math.floor((ps[i].page - 1) / 2); return 0; }
function tocBody(ec) {
  ec = (ec === '' ? '' : ' enter');
  var ps = allPages(), rows = '';
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i], s = sceneOf(p), pend = p.state === 'pending';
    rows += "<li" + (pend ? " class='todo-row'" : "") + " data-jump='" + (pend ? ps[ps.length - 1].page : p.page) + "'><span class='no'>" + p.page + "</span><span>" + esc(s && s.kind === 'contents' ? '目录' : p.title) + "</span><span class='pg-no'>" + (pend ? '待补充' : '第 ' + p.page + ' 页') + "</span></li>";
  }
  return "<div class='pg" + ec + "'><h2>目录</h2><div class='kick'>这本手册里有什么</div><div class='hr'></div><ul class='toc'>" + rows + "</ul></div>";
}
function switchHtml(cur) {
  var h = '';
  for (var i = 0; i < SCENES.length; i++) {
    var s = SCENES[i];
    if (!s.name) continue;
    h += "<b style='font-weight:400;font-size:12px;padding:4px 10px;border-radius:5px;color:" + (s.key === cur ? "#3a2607" : "#6b5f45") + ";background:" + (s.key === cur ? "#f0dfa8" : "transparent") + ";cursor:pointer' data-go='" + s.key + "'>" + esc(s.name) + "</b>";
  }
  return "<div class='switch' style='display:flex;gap:2px;background:#efe3c6;border:1px solid #ddd0b0;border-radius:6px;padding:2px;margin-bottom:10px;align-self:flex-start'><i style='position:absolute'></i>" + h + "</div>";
}

function stepsHtml(s, page) {
  var h = '';
  for (var i = 0; i < s.steps.length; i++) h += "<li><span class='n'>" + (i + 1) + "</span><span>" + s.steps[i] + "</span></li>";
  return "<ul class='ol'>" + h + "</ul>";
}
function shotHtml(src) { return "<div class='shot'><div class='thumb' data-shot='" + src + "'><img src='" + src + "' alt='配置面板数据目录示意'></div><span>点开看整张图</span></div>"; }
function fragHtml(s) { return s.frag ? "<div class='frag' data-copy='" + esc(s.frag) + "'>" + esc(s.frag) + "<em>点一下复制</em></div>" : ''; }
function pageBody(page, enter) {
  var ec = enter === false ? '' : ' enter';
  var s = sceneOf(page);
  if (!s) return '';
  if (s.kind === 'contents') return tocBody(ec);
  if (s.state === 'pending') { var rows = ''; var items = s.items || []; for (var k = 0; k < items.length; k++) { var nb = String(items[k]).replace(/\D/g, '') || String(k + 1); rows += "<div class='bar todo'><span class='num'>" + esc(nb) + "</span><span>后续场景，待补充</span><span class='lock'>🔒</span></div>"; } return "<div class='pg" + ec + "'><h2>后续场景</h2><div class='hr'></div>" + rows + "</div>"; }
  return "<div class='pg" + ec + "'>" + "<h2>" + esc(s.title) + "</h2><div class='kick'>" + esc(s.kicker) + "</div><div class='hr'></div>" +
    (s.lead ? "<p class='lead'>" + s.lead + "</p>" : '') + stepsHtml(s, page) + shotHtmlIf(s) + fragHtml(s) + noteHtml(s) + "</div>";
}
function panelHtml() { return "<div class='panel'><div class='p-title'><b>数据目录</b><span class='p-mod'>可改</span></div><div class='p-desc'>库文件与备份的根目录。留空 = 用默认目录。</div><div class='p-input'>D:\\2Study\\StudyNotes\\.db</div><div class='p-btns'><span class='p-btn'>浏览文件夹</span><span class='p-btn'>复制</span></div><div class='p-bar'><span class='p-btn'>保存</span><span class='p-btn'>重置为默认</span><span class='p-btn'>重新读取</span><span class='p-note'>没有未保存的改动</span></div></div>"; }
function shotHtmlIf(s) { if (s.panelStatic) return panelHtml(); return s.shot ? shotHtml(s.shot) : ''; }
function noteHtml(s) { return s.note ? "<div class='tail'>" + s.note + "</div>" : ''; }
function applyTabGeometry(plan) {
  var r = document.documentElement.style;
  r.setProperty('--tab-w', plan.tab.width + '%');
  r.setProperty('--tab-h', 'calc(var(--paper-w) * ' + (plan.tab.height / 100) + ')');
  r.setProperty('--tab-font', 'calc(var(--paper-w) * ' + (plan.tab.font / 100) + ')');
  r.setProperty('--tab-r', 'calc(var(--paper-w) * ' + (plan.tab.radius / 100) + ')');
}
function titleOf(pg) { if (!pg || pg < 1 || pg > SCENES.length) return ''; var s = SCENES[pg - 1]; return (s && (s.name || s.title)) || ''; }
function renderTabs(plan) {
  var html = '';
  for (var i = 0; i < plan.sheets.length; i++) {
    var sh = plan.sheets[i];
    var on = (sh.facing === plan.spread * 2 + 1 || sh.facing === plan.spread * 2 + 2) ? ' on' : '';
    var side = sh.side === 'left' ? 'right' : 'left';
    var ot = sh.facing === sh.front ? sh.back : sh.front;
    html += "<span class='tab" + on + "' id='sh" + sh.sheet + "' data-pg='" + sh.facing + "' data-other='" + (ot || '') + "' style='" + side + ":calc(50% + " + sh.tabOffset + "%)'>" + sh.facing + "</span>";
  }
  layer.innerHTML = html;
  var tabs = layer.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) (function (t) {
    t.addEventListener('click', function () {
      var pg = parseInt((t.textContent || ''), 10);
      if (!pg || busy) return;
      var target = Math.floor((pg - 1) / 2);
      if (target === sp) return;
      sp = target; render();
    });
    t.addEventListener('mouseenter', function (e) {
      var pg = parseInt(t.getAttribute('data-pg') || '', 10);
      var ot = parseInt(t.getAttribute('data-other') || '', 10);
      if (!pg) return;
      var s1 = (pg >= 1 && pg <= SCENES.length) ? SCENES[pg - 1] : null;
      var s2 = (ot >= 1 && ot <= SCENES.length) ? SCENES[ot - 1] : null;
      var n1 = s1 ? (s1.name || s1.title) : '', n2 = s2 ? (s2.name || s2.title) : '';
      var l1 = (s1 && s1.state === 'pending') ? "<span class='tp-lock'>🔒</span>" : '';
      var l2 = (s2 && s2.state === 'pending') ? "<span class='tp-lock'>🔒</span>" : '';
      var pop = document.getElementById('tabpop');
      if (!pop) { pop = document.createElement('div'); pop.id = 'tabpop'; pop.className = 'tabpop'; document.body.appendChild(pop);
        pop.addEventListener('mouseleave', function () { pop.style.display = 'none'; });
        pop.addEventListener('click', function () { var go = parseInt(pop.getAttribute('data-go') || '', 10); pop.style.display = 'none'; if (!go || busy) return; var target = Math.floor((go - 1) / 2); if (target === sp) return; sp = target; render(); });
      }
      pop.setAttribute('data-go', pg);
      pop.innerHTML = "<div><span class='tp-no'>" + pg + "</span><span class='tp-cur'>" + esc(n1) + "</span>" + l1 + "</div>" + (s2 ? "<div class='tp-sub'><span class='tp-no back'>" + ot + "</span><span class='tp-cur'>" + esc(n2) + "</span>" + l2 + "</div>" : '') + "<div class='tp-go'>点一下翻到这一页 ›</div>";
      pop.style.display = 'block';
      var pw = 230, ph = 130, cx = e.clientX || 0, cy = e.clientY || 0;
      var lx = cx + 12, ly = cy + 16;
      if (lx + pw > window.innerWidth) lx = cx - pw;
      if (ly + ph > window.innerHeight) ly = cy - ph;
      pop.style.left = lx + 'px';
      pop.style.top = ly + 'px';
    });
    t.addEventListener('mouseleave', function (e) {
      var pop = document.getElementById('tabpop');
      if (!pop) return;
      var to = e.relatedTarget;
      if (to && (to === pop || (pop.contains && pop.contains(to)))) return;
      pop.style.display = 'none';
    });
  })(tabs[i]);
}
function renderPages(plan, enter) {
  var left = null, right = null;
  for (var i = 0; i < plan.pages.length; i++) { if (plan.pages[i].side === 'left') left = plan.pages[i]; else right = plan.pages[i]; }
  var l = document.getElementById('pl'), r = document.getElementById('pr');
  l.innerHTML = left ? pageBody(left, enter) : '';
  r.innerHTML = right ? pageBody(right, enter) : '';
  wire(l); wire(r);
  dimSwitcher(l); dimSwitcher(r);
}
function dimSwitcher(page) {
  var sw = page.querySelector('.switch');
  if (!sw) return;
  var ind = sw.querySelector('i'), cur = sw.querySelector('b.on') || sw.querySelector('b');
  if (!cur) return;
  ind.style.width = cur.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + (cur.offsetLeft - 4) + 'px)';
}
function render(enter) {
  var plan = planManual(SCENES, sp);
  applyTabGeometry(plan); renderTabs(plan); renderPages(plan, enter);
  if (prev) prev.disabled = (plan.spread === 0);
  if (next) next.disabled = (plan.spread === plan.spreadCount - 1);
}
var FIXED_H = -1;
function freezeHeight() {
  var book = document.getElementById('sp');
  if (FIXED_H >= 0) { book.style.height = FIXED_H + 'px'; book.style.minHeight = FIXED_H + 'px'; return FIXED_H; }
  var keep = sp, maxH = 0, counts = planManual(SCENES, 0).spreadCount, i, h;
  book.style.visibility = 'hidden';
  book.style.minHeight = '0px';
  book.style.height = 'auto';
  for (i = 0; i < counts; i++) {
    sp = i; render(false);
    h = Math.max(document.getElementById('pl').scrollHeight, document.getElementById('pr').scrollHeight);
    if (h > maxH) maxH = h;
  }
  sp = keep; render(false);
  book.style.visibility = '';
  var cap = Math.min(book.clientWidth / 1.41421356, window.innerHeight * 0.8);
  FIXED_H = Math.max(1, Math.min(maxH, Math.floor(cap)));
  book.style.height = FIXED_H + 'px';
  book.style.minHeight = FIXED_H + 'px';
  window.__bookStats = { fixed: FIXED_H, tallest: maxH, cap: Math.floor(cap), spreads: counts };
  if (window.console) console.log('[manual] 书高冻住', window.__bookStats);
  return FIXED_H;
}
window.__freezeBook = freezeHeight;
window.addEventListener('resize', function () { FIXED_H = -1; var book = document.getElementById('sp'); if (book) { book.style.height = ''; book.style.minHeight = ''; } });
function faceTab(pg, side, off) { return "<span class='tab on' style='" + side + ":" + (off * 2) + "%'>" + pg + "</span>"; }
function pageByNumber(plan, n) { for (var i = 0; i < plan.pages.length; i++) if (plan.pages[i].page === n) return plan.pages[i]; return null; }
function turnLeaf(dir) {
  if (busy) return;
  var plan = planManual(SCENES, sp), k = dir > 0 ? sp + 1 : sp, sheet = plan.sheets[k];
  if (!sheet) return;
  var facing = sheet.facing, other = facing === sheet.front ? sheet.back : sheet.front;
  if (facing === null || other === null) return;
  busy = true;
  var book = document.getElementById('sp'), leaf = document.createElement('div');
  leaf.className = 'leaf ' + (dir > 0 ? 'R' : 'L');
  var target = planManual(SCENES, sp + dir);
  var fp = pageByNumber(plan, facing), bp = pageByNumber(target, other);
  var preSide = dir > 0 ? 'right' : 'left', prePage = null;
  for (var pi = 0; pi < target.pages.length; pi++) if (target.pages[pi].side === preSide) prePage = target.pages[pi];
  var preEl = document.getElementById(dir > 0 ? 'pr' : 'pl');
  if (preEl) { if (prePage) { preEl.innerHTML = pageBody(prePage, false); wire(preEl); dimSwitcher(preEl); } else { preEl.innerHTML = ''; } }
  leaf.innerHTML = "<div class='face front'>" + (fp ? pageBody(fp, false) : '') + faceTab(facing, dir > 0 ? 'left' : 'right', sheet.tabOffset) + "</div>" +
                   "<div class='face back'>" + (bp ? pageBody(bp, false) : '') + faceTab(other, dir > 0 ? 'right' : 'left', sheet.tabOffset) + "</div>";
  var hidden = document.getElementById('sh' + k);
  if (hidden) hidden.style.visibility = 'hidden';
  book.appendChild(leaf);
  void leaf.offsetWidth;
  leaf.classList.add(dir > 0 ? 'toL' : 'toR');
  leaf.addEventListener('animationend', function (e) {
    if (e.target !== leaf) return;
    sp += dir; render(false); leaf.remove(); busy = false;
  });
}
if (prev) prev.addEventListener('click', function () { if (sp > 0) turnLeaf(-1); });
if (next) next.addEventListener('click', function () { if (sp < planManual(SCENES, sp).spreadCount - 1) turnLeaf(1); });
function wire(page) {
  if (!page || !page.querySelector) return;
  var jumps = page.querySelectorAll('[data-jump]');
  for (var ji = 0; ji < jumps.length; ji++) (function (j) {
    j.addEventListener('click', function () {
      var pg = parseInt(j.getAttribute('data-jump'), 10);
      if (!pg || busy) return;
      var target = Math.floor((pg - 1) / 2);
      if (target === sp) return;
      sp = target; render();
    });
  })(jumps[ji]);
  var sw = page.querySelector('.switch');
  if (sw) {
    var tabs = sw.querySelectorAll('b'), ind = sw.querySelector('i');
    for (var i = 0; i < tabs.length; i++) (function (t) {
      t.addEventListener('click', function () {
        sw.classList.add('stretch');
        ind.style.width = t.offsetWidth + 'px'; ind.style.transform = 'translateX(' + (t.offsetLeft - 4) + 'px)';
        setTimeout(function () { sw.classList.remove('stretch'); }, 240);
        setTimeout(function () { sp = sceneSpread(t.getAttribute('data-go')); render(); }, 180);
      });
    })(tabs[i]);
  }
  var frag = page.querySelector('[data-copy]');
  if (frag) frag.addEventListener('click', function () {
    var txt = frag.getAttribute('data-copy');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
    var t = document.createElement('div'); t.className = 'toastc'; t.textContent = '已复制：' + txt;
    page.appendChild(t); setTimeout(function () { t.style.transition = 'opacity .3s ease'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 320); }, 1200);
  });
  var thumb = page.querySelector('[data-shot]');
  if (thumb) thumb.addEventListener('click', function () {
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = "<b>配置面板 › 数据目录</b><img src='" + thumb.getAttribute('data-shot') + "' alt='配置面板数据目录大图'><span class='x'>✕ 收起</span>";
    page.appendChild(box);
    box.addEventListener('click', function (e) { if (e.target === box || e.target.className === 'x') box.remove(); });
  });
}
render();

</script>
</body></html>
