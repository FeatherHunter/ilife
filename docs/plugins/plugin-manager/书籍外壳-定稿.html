  定稿日：2026-10-08；票：#1193（原型）→ #1195（施工）

    · 外框（红＋金）：.scroll/.frame/.frameweave/.paper/.paperfiber/.foreR/.foreB/.book/.spine 与 #roughFrame 滤镜，

-->

<script type="module">
// 手册书排版（票 #1193 → 施工 #1195）：场景表 → 页／跨页／纸／书签，一次算清。
// 纯计算：零 DOM、零宿主知识。界面只读这里算出来的结果，不自己再算一遍。
// 几何口径见 docs/plugins/plugin-manager/书籍外壳-定稿.md（用户 2026-10-08 认可的定稿）。
//
// 规则：一个场景＝一页 → 页数＝场景数 → 跨页＝⌈页数/2⌉ → 纸＝⌊页数/2⌋+1。
// 一张纸一个书签：正面印偶数页、反面印奇数页，翻过去号码自动换成反面那一页；
// 纸一多，书签与间距一起等比收窄，保证最外那枚不越出「中缝 → 纸边」这半边。
// 书签几何。单位一律是「纸面宽度的百分比」，取自定稿件；要调形状改这一处。
const TAB_WIDTH = 5.9;
const TAB_HEIGHT = 5.4;
const TAB_FONT = 1.9;
const TAB_RADIUS = 0.9;
const TAB_FIRST = 5.5; // 第一枚离中缝多远
const TAB_PITCH = 7.1; // 相邻两枚的间距
const HALF = 50; // 中缝到纸边的跨度
const EDGE = 1; // 留一点边，别贴到红框
const MIN_WIDTH = 3; // 再窄就印不下号了
/** 纸一多就等比收窄：缩小倍数取「排得下」与「不放大」里小的那个。 */
function tabScale(sheetCount) {
    const span = TAB_FIRST + TAB_PITCH * (sheetCount - 1) + TAB_WIDTH;
    return Math.min(1, (HALF - EDGE) / span);
}
/**
 * 把场景表排成一本书在某一跨页上的样子。
 * @param scenes 场景清单，顺序就是页码顺序
 * @param spread 要看第几个跨页（从 0 起）；越界会被夹到第一／最后一跨页
 */
export function planManual(scenes, spread) {
    const pageCount = scenes.length;
    const spreadCount = Math.max(1, Math.ceil(pageCount / 2));
    const at = Math.min(Math.max(spread, 0), spreadCount - 1);
    const pages = [];
    if (pageCount > 0) {
        for (const page of [2 * at + 1, 2 * at + 2]) {
            if (page > pageCount)
                continue;
            const scene = scenes[page - 1];
            pages.push({ page, key: scene.key, title: scene.title, side: page % 2 === 1 ? 'left' : 'right', state: scene.state });
        }
    }
    const sheetCount = pageCount === 0 ? 0 : Math.floor(pageCount / 2) + 1;
    const scale = tabScale(sheetCount === 0 ? 1 : sheetCount);
    const sheets = [];
    for (let sheet = 0; sheet < sheetCount; sheet++) {
        const front = sheet === 0 ? 1 : 2 * sheet;
        const backRaw = sheet === 0 ? null : 2 * sheet + 1;
        const back = backRaw !== null && backRaw <= pageCount ? backRaw : null;
        const onLeft = sheet === 0 || sheet <= at;
        sheets.push({
            sheet,
            front,
            back,
            facing: sheet === 0 ? 1 : onLeft ? (back ?? front) : front,
            side: onLeft ? 'left' : 'right',
            tabOffset: (TAB_FIRST + TAB_PITCH * sheet) * scale,
        });
    }
    return {
        spread: at,
        spreadCount,
        pageCount,
        pages,
        sheets,
        tab: {
            width: TAB_WIDTH * scale,
            height: TAB_HEIGHT * scale,
            font: TAB_FONT * scale,
            radius: TAB_RADIUS * scale,
            overflow: TAB_WIDTH * scale < MIN_WIDTH,
        },
    };
}

// 场景表：现在 4 个场景（正文待填）。加场景就往这个数组里加一条，页数／书签会自动跟着变。
var SCENES = [
  { key: 'basic',   title: '基本使用：对 AI 说 xxx help', state: 'written' },
  { key: 'datadir', title: '数据目录：自己备份，不加密',     state: 'written' },
  { key: 'im',      title: '增强体验：装 IM 插件绑飞书',     state: 'written' },
  { key: 'imflow',  title: '增强流程：IM 全流程 8 步',       state: 'written' }
];

var sp = 0, busy = false;
var layer = document.getElementById('tabs');
var prev = document.getElementById('prev'), next = document.getElementById('next');

// 界面只读 planManual 算出来的结果：书签多宽、离中缝多远、这一跨页看哪两页
function applyTabGeometry(plan) {
  var r = document.documentElement.style;
  r.setProperty('--tab-w', plan.tab.width + '%');
  r.setProperty('--tab-h', 'calc(var(--paper-w) * ' + (plan.tab.height / 100) + ')');
  r.setProperty('--tab-font', 'calc(var(--paper-w) * ' + (plan.tab.font / 100) + ')');
  r.setProperty('--tab-r', 'calc(var(--paper-w) * ' + (plan.tab.radius / 100) + ')');
}
function renderTabs(plan) {
  var html = "";
  for (var i = 0; i < plan.sheets.length; i++) {
    var s = plan.sheets[i];
    var on = (s.facing === plan.spread * 2 + 1 || s.facing === plan.spread * 2 + 2) ? " on" : "";
    var side = s.side === "left" ? "right" : "left";
    html += "<span class='tab" + on + "' id='sh" + s.sheet + "' style='" + side + ":calc(50% + " + s.tabOffset + "%)'>" + s.facing + "</span>";
  }
  layer.innerHTML = html;
  var tabs = layer.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) (function (t) {
    t.addEventListener("click", function () {
      var pg = parseInt((t.textContent || ""), 10);
      if (!pg || busy) return;
      var target = Math.floor((pg - 1) / 2);
      if (target === sp) return;
      sp = target; render();
    });
  })(tabs[i]);
}
// 正文留空（内部版式还没定）；?debug=1 时把这一页装的是哪个场景写出来
function pageBody(page) {
  if (location.search.indexOf('debug') < 0) return '';
  return "<div class='dbg'>第 " + page.page + " 页 · " + page.side + " · " + page.key + " · " + page.title + (page.state === 'pending' ? ' · 待定' : '') + "</div>";
}
function renderPages(plan) {
  var left = null, right = null;
  for (var i = 0; i < plan.pages.length; i++) {
    if (plan.pages[i].side === "left") left = plan.pages[i]; else right = plan.pages[i];
  }
  document.getElementById('pl').innerHTML = left ? pageBody(left) : '';
  document.getElementById('pr').innerHTML = right ? pageBody(right) : '';
}
function render() {
  var plan = planManual(SCENES, sp);
  applyTabGeometry(plan); renderTabs(plan); renderPages(plan);
  prev.disabled = (plan.spread === 0);
  next.disabled = (plan.spread === plan.spreadCount - 1);
  if (location.search.indexOf('debug') >= 0) {
    document.querySelector('.note').textContent = '页数 ' + plan.pageCount + ' · 跨页 ' + plan.spreadCount + ' · 纸 ' + plan.sheets.length + ' · 书签宽 ' + plan.tab.width.toFixed(2) + '%' + (plan.tab.overflow ? ' · 已到书签下限' : '');
  }
}
function faceTab(pg, side, off) {
  return "<span class='tab on' style='" + side + ":" + (off * 2) + "%'>" + pg + "</span>";
}
function turnLeaf(dir) {
  if (busy) return;
  var plan = planManual(SCENES, sp);
  var k = dir > 0 ? sp + 1 : sp;
  var sheet = plan.sheets[k];
  if (!sheet) return;
  var facing = sheet.facing;
  var other = facing === sheet.front ? sheet.back : sheet.front;
  if (facing === null || other === null) return;
  busy = true;
  var book = document.getElementById('sp');
  var leaf = document.createElement('div');
  leaf.className = 'leaf ' + (dir > 0 ? 'R' : 'L');
  leaf.innerHTML = "<div class='face front'>" + faceTab(facing, dir > 0 ? 'left' : 'right', sheet.tabOffset) + "</div>" +
                   "<div class='face back'>" + faceTab(other, dir > 0 ? 'right' : 'left', sheet.tabOffset) + "</div>";
  var hidden = document.getElementById("sh" + k);
  if (hidden) hidden.style.visibility = "hidden";
  book.appendChild(leaf);
  void leaf.offsetWidth;
  leaf.classList.add(dir > 0 ? 'toL' : 'toR');
  leaf.addEventListener('animationend', function (e) {
    if (e.target !== leaf) return;
    sp += dir; render(); leaf.remove(); busy = false;
  });
}
prev.addEventListener('click', function () { if (sp > 0) turnLeaf(-1); });
next.addEventListener('click', function () { if (sp < planManual(SCENES, sp).spreadCount - 1) turnLeaf(1); });
render();
</script>
