 *   贴屏幕底部出现, 旧的向上顶, 间距 8px）; 超 N 挤掉最旧（FIFO）; 单条独立计时消失
 */
(function(){
  var stack = null;
  var styleInjected = false;
  var DEFAULT_MAX = 5;
  var MOBILE_MAX = 3;
  var ICONS = { copy:'📋', ok:'✅', warn:'⚠️', danger:'❌', info:'💡' };
  var CSS = '.hm-toast-stack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none}.hm-toast{position:relative;transform:scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)}.hm-toast.show{opacity:1;transform:scale(1);pointer-events:auto}.hm-toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}.hm-toast-body{flex:1;min-width:0}.hm-toast-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hm-toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}.hm-toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}.hm-toast-lines{font-size:11px;line-height:1.55;color:#c8c8cc}.hm-toast-code{background:rgba(0,0,0,.32);border-radius:8px;padding:8px 10px;font-size:10.5px;line-height:1.5;color:#aeb0b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;margin-top:6px;max-height:140px;overflow:auto}.hm-toast-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;flex-shrink:0}.hm-toast-chip.ok{background:rgba(52,199,89,.18);color:#4dd96b}.hm-toast-chip.warn{background:rgba(255,149,0,.18);color:#ffb340}.hm-toast-chip.danger{background:rgba(255,59,48,.18);color:#ff6961}.hm-toast-chip.gray{background:rgba(255,255,255,.12);color:#c8c8cc}.hm-toast-count{font-size:10px;font-weight:700;color:#c8c8cc;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;flex-shrink:0}.hm-toast-act{font-size:11px;font-weight:600;color:#4dd96b;border:none;background:none;cursor:pointer;padding:2px 4px;flex-shrink:0;font-family:inherit}.hm-toast-act:active{opacity:.7}.hm-toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}.hm-toast-close:active{background:rgba(255,255,255,.2)}@media(max-width:820px){.hm-toast-stack{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:none;align-items:stretch}.hm-toast{transform:scale(.95);max-width:none;min-width:0}.hm-toast.show{transform:scale(1)}}';

  function ensureStyle(){
    if(styleInjected) return;
    styleInjected = true;
    var st = document.createElement('style');
    st.id = 'hm-toast-style';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  function getStack(){
    if(!stack){
      stack = document.createElement('div');
      /* 栈要带 CSS 那条 fixed 定位规则的选择器类名（`.hm-toast-stack`）：只写 id 时提示落在文档流末尾，不悬浮。 */
      stack.className = 'hm-toast-stack';
      stack.id = 'hm-toast-stack';
      document.body.appendChild(stack);
    }
    return stack;
  }

  function isMobile(){
    return window.matchMedia('(max-width: 820px)').matches;
  }

  /* 栈容量 = 栈内各 toast maxStack 的最大值（空栈默认 5）; 移动端 ≤820px 收窄为 3 */
  function stackCap(){
    var cap = 0;
    if(stack) stack.querySelectorAll('.hm-toast').forEach(function(t){
      var m = parseInt(t.getAttribute('data-max')||DEFAULT_MAX, 10);
      if(m > cap) cap = m;
    });
    if(cap === 0) cap = DEFAULT_MAX;
    if(isMobile() && cap > MOBILE_MAX) cap = MOBILE_MAX;
    return cap;
  }

  /* 超 N 挤掉最旧（FIFO） */
  function evictOldest(){
    var cap = stackCap();
    while(stack.querySelectorAll('.hm-toast').length > cap){
      var oldest = stack.querySelector('.hm-toast');
      if(!oldest) break;
      clearTimeout(oldest._timer);
      oldest.remove();
    }
  }

  function dismiss(t){
    if(!t || !t.isConnected) return;
    clearTimeout(t._timer);
    t.classList.remove('show');
    setTimeout(function(){
      if(t.isConnected) t.remove();
    }, 250);
  }

  function show(item){
    var opts = item.opts;
    var container = getStack();
    ensureStyle();
    var msg = item.msg, detail = item.detail;
    var t = document.createElement('div');
    t.className = 'hm-toast';
    t.setAttribute('role','status');
    t.setAttribute('aria-live','polite');
    t.setAttribute('data-max', String(opts.maxStack || DEFAULT_MAX));
    var icon = ICONS[opts.icon] || opts.icon || '📋';
    var titleRow = '<span class="hm-toast-title">'+esc(msg)+'</span>';
    if(opts.badge){
      var b = opts.badge;
      var btype = ['ok','warn','danger'].indexOf(b.type)>=0 ? b.type : 'ok';
      titleRow += '<span class="hm-toast-chip '+btype+'">'+esc(b.text)+'</span>';
    }
    if(opts.count){
      titleRow += '<span class="hm-toast-count">'+esc(opts.count)+'</span>';
    }
    if(opts.actions && opts.actions.length){
      opts.actions.slice(0,2).forEach(function(a){
        titleRow += '<button class="hm-toast-act" data-act="'+esc(a.label)+'">'+esc(a.label)+'</button>';
      });
    }
    var bodyHtml = '<div class="hm-toast-title-row">'+titleRow+'</div>';
    if(detail){
      bodyHtml += '<div class="hm-toast-detail">'+esc(detail)+'</div>';
    }
    if(opts.lines && opts.lines.length){
      bodyHtml += '<div class="hm-toast-lines">'+opts.lines.map(function(l){return esc(l);}).join('<br>')+'</div>';
    }
    if(opts.code){
      bodyHtml += '<div class="hm-toast-code">'+esc(opts.code)+'</div>';
    }
    t.innerHTML = '<div class="hm-toast-icon">'+icon+'</div><div class="hm-toast-body">'+bodyHtml+'</div><button class="hm-toast-close">✓ 知道了</button>';
    container.appendChild(t);
    evictOldest();
    if(opts.actions && opts.actions.length){
      var actBtns = t.querySelectorAll('.hm-toast-act');
      opts.actions.slice(0,2).forEach(function(a, i){
        actBtns[i].addEventListener('click', function(){
          var f = a.onClick;
          dismiss(t);
          if(f) setTimeout(f, 0);
        });
      });
    }
    t.querySelector('.hm-toast-close').addEventListener('click', function(){ dismiss(t); });
    var timer = setTimeout(function(){ dismiss(t); }, opts.timeout || 4500);
    t._timer = timer;
    requestAnimationFrame(function(){ t.classList.add('show'); });
  }

  window.toast = function(msg, detail, options){
    options = options || {};
    show({ msg: msg, detail: detail || '', opts: options });
  };
  /* 清空栈（技能页面销毁/测试用）：移除当前全部显示 */
  window.__hmToastFlush = function(){
    if(!stack) return;
    stack.querySelectorAll('.hm-toast').forEach(function(t){ clearTimeout(t._timer); t.remove(); });
  };
})();

/* ── snapshot 结构校验（违规直接报错）── */
function _validateSnapshot(s){
  if(!s || typeof s !== 'object'){
    throw new Error('snapshot 违规: scene.snapshot 必须是对象');
  }
  if(typeof s.title !== 'string' || !s.title.trim()){
    throw new Error('snapshot 违规: title 必须是非空字符串');
  }
  if(!Array.isArray(s.summary)){
    throw new Error('snapshot 违规: summary 必须是数组');
  }
  if(!Array.isArray(s.sections)){
    throw new Error('snapshot 违规: sections 必须是数组');
  }
  s.sections.forEach(function(sec, i){
    if(!sec || typeof sec !== 'object' || typeof sec.heading !== 'string' || !Array.isArray(sec.rows)){
      throw new Error('snapshot 违规: sections['+i+'] 必须含 heading(字符串) + rows(数组)');
    }
  });
  return true;
}

/* 行渲染: 支持字符串 或 {text, sensitive}（脱敏）*/
function _rowText(r){
  if(r && typeof r === 'object' && !Array.isArray(r)){
    if(r.sensitive) return '****（敏感字段已脱敏）';
    return String(r.text ?? '');
  }
  return String(r ?? '');
}

/* ── buildDataText v1.2（snapshot 结构化 · 领域无关 · format 支持）──
 * buildDataText(p, format?)  format: 'text'(默认) | 'json' | 'csv'
 */
function buildDataText(p, format){
  var d = p && p.data || {};
  var me = d.meta || {};
  var s = d.scene || {};
  var snap = s.snapshot;
  _validateSnapshot(snap);
  format = format || 'text';

  if(format === 'json'){
    return JSON.stringify(snap, null, 2);
  }
  if(format === 'csv'){
    var out = [];
    out.push(snap.title);
    out.push(snap.summary.map(_rowText).join('; '));
    snap.sections.forEach(function(sec){
      out.push('[' + sec.heading + ']');
      sec.rows.forEach(function(r){ out.push(_rowText(r)); });
    });
    return out.join('\n');
  }

  var L = ['【'+(me.skill_name||me.command_cn||'')+' · '+(me.command_cn||'')+'】'];
  L.push('场景: '+(me.command_cn||'')+(s.scene_id?('('+s.scene_id+')'):'')+(me.wake_word?(' · 唤醒词「'+me.wake_word+'」'):''));
  L.push('时间: '+(me.occurred_at||''));
  if(snap.summary.length){
    snap.summary.forEach(function(x){ L.push(_rowText(x)); });
  }
  snap.sections.forEach(function(sec){
    if(!sec.rows.length) return;
    L.push('▍'+sec.heading);
    sec.rows.forEach(function(r){ L.push('  · '+_rowText(r)); });
  });
  return L.join('\n');
}

/* ── buildLogText v1.2（6 段日志 · format 支持）── */
function buildLogText(p, format){
  var d = p && p.data || {};
  var me = d.meta || {};
  var s = d.scene || {};
  var cl = d.copy_log || s.copy_log || {};
  format = format || 'text';

  var L = ['① 场景标识'];
  L.push('  命  令: '+(me.command_cn||''));
  L.push('  唤醒词: '+(me.wake_word||'(未知)'));
  L.push('  场景名: '+(me.command_cn||'')+(s.scene_id?('('+s.scene_id+')'):''));
  L.push('');
  L.push('② AI 思考链');
  L.push('  '+(cl.thinking||'(本地渲染 · 无 AI 链)'));
  L.push('');
  L.push('③ 底层数据结构');
  L.push('  '+(cl.data_structure||'(只读查询)'));
  L.push('');
  L.push('④ 调用链');
  L.push('  '+(cl.call_chain||'(未知)'));
  L.push('');
  L.push('⑤ 时间戳 + 版本');
  L.push('  本地时间: '+(cl.timestamp||me.occurred_at||'(未知)'));
  L.push('  版  本: '+(me.skill_version||'(未知)'));
  L.push('');
  L.push('⑥ 异常信息');
  L.push('  '+(cl.exception||'无'));
  return L.join('\n');
}

/* ── metaHeader / remindersBlock（v1.1 保留）── */
function metaHeader(p, m){var me=p.data.meta||{};var stage=m&&m.stage?('<span class="stage">'+esc(m.stage)+'</span>'):'';return '<header class="hero"><div class="eyebrow" style="color:#8e8e93;font-size:11px;font-weight:600">'+esc(me.command_cn||'')+' · '+esc(me.occurred_at||'')+'</div><h1>'+esc(m&&m.title||me.command_cn||'')+'</h1>'+(m&&m.lead?'<p class="lead">'+esc(m.lead)+'</p>':'')+stage+'</header>';}
function remindersBlock(p){var rs=arr(p.data.reminders);if(!rs.length)return '';return '<section class="remind"><h2>顺路提醒</h2>'+rs.map(r=>'<div class="remind-item '+(r.type==='warn'?'warn':r.type==='danger'?'bad':'')+'">'+esc(r.text)+'</div>').join('')+'</section>';}

/* ── actionBar v1.2（场景按钮 + 复制数据/日志 ghost）──
 * actionBar(p, extra?, opts?)  opts: { preview, formatMenu, download }
 */
function actionBar(p, extra, opts){
  window.__hmPayload = p;
  opts = opts || {};
  var btns = arr(extra || []);
  var sb = opts.noSb ? [] : arr(p && p.data && p.data.scene && p.data.scene.buttons || []);
  var html = '<div class="hm-actions">';
  btns.concat(sb).forEach(function(b){
    html += '<button class="copy '+(b.kind||'')+'" onclick="copyText(this.dataset.t)" data-t="'+esc(b.text).replace(/"/g,'&quot;')+'">'+esc(b.label)+'</button>';
  });
  html += '<button class="copy ghost" onclick="'+(opts.preview?'window.__hmCopyData(true)':'copyText(buildDataText(window.__hmPayload))')+'">复制数据</button>';
  html += '<button class="copy ghost" onclick="'+(opts.preview?'window.__hmCopyLog(true)':'copyText(buildLogText(window.__hmPayload))')+'">复制日志</button>';
  html += '</div>';
  if(opts.preview){
    html += '<div class="hm-preview-overlay" id="hm-preview" style="display:none">'
      + '<div class="hm-preview-panel"><div class="hm-preview-head"><span id="hm-preview-title">复制预览</span>'
      + '<button class="hm-preview-close" onclick="document.getElementById(\'hm-preview\').style.display=\'none\'">✕</button></div>'
      + '<pre class="hm-preview-body" id="hm-preview-body"></pre>'
      + '<div class="hm-preview-actions"><button class="copy primary" id="hm-preview-confirm">复制</button>'
      + '<button class="copy" onclick="document.getElementById(\'hm-preview\').style.display=\'none\'">取消</button></div>'
      + '</div></div>';
  }
  return html;
}

/* 复制预览面板（actionBar preview 模式） */
function _showCopyPreview(kind){
  var p = window.__hmPayload;
  var body = document.getElementById('hm-preview-body');
  var title = document.getElementById('hm-preview-title');
  if(!body) return;
  var text = kind === 'log' ? buildLogText(p) : buildDataText(p);
  title.textContent = kind === 'log' ? '复制日志 · 预览' : '复制数据 · 预览';
  body.textContent = text;
  document.getElementById('hm-preview').style.display = 'flex';
  document.getElementById('hm-preview-confirm').onclick = function(){
    copyText(text);
    document.getElementById('hm-preview').style.display = 'none';
  };
}
window.__hmCopyData = function(){ _showCopyPreview('data'); };
window.__hmCopyLog = function(){ _showCopyPreview('log'); };

/* ── formPrompt（P0 · 用户填参数表单 + 实时预览 + 空值拦截）──
 * formPrompt(fields, template) → HTML 字符串
 * fields: [{ key, label, type:'text'|'number'|'select', options?, default?, placeholder? }]
 * template: 含 {key} 占位符的 prompt 模板
 */
function formPrompt(fields, template){
  fields = arr(fields);
  var uid = 'fp' + Math.random().toString(36).slice(2,7);
  var html = '<div class="fp" id="'+uid+'">';
  fields.forEach(function(f, i){
    var fid = uid + '-f' + i;
    html += '<div class="fp-field"><label class="fp-label">'+esc(f.label)+'</label>';
    if(f.type === 'select'){
      html += '<select class="fp-input" id="'+fid+'" data-key="'+esc(f.key)+'">';
      arr(f.options).forEach(function(o){
        var sel = (String(o.value ?? o) === String(f.default ?? '')) ? ' selected' : '';
        html += '<option value="'+esc(o.value ?? o)+'"'+sel+'>'+esc(o.label ?? o)+'</option>';
      });
      html += '</select>';
    } else {
      html += '<input class="fp-input" id="'+fid+'" type="'+(f.type==='number'?'number':'text')+'" data-key="'+esc(f.key)+'" value="'+esc(f.default ?? '')+'" placeholder="'+esc(f.placeholder ?? '')+'">';
    }
    html += '</div>';
  });
  html += '<div class="fp-preview"><div class="fp-preview-label">Prompt 预览</div><pre class="fp-preview-body" id="'+uid+'-preview"></pre></div>';
  html += '<div class="fp-actions"><button class="copy primary" id="'+uid+'-btn">复制指令</button></div>';
  html += '</div>';

  function renderPreview(){
    var vals = {};
    fields.forEach(function(f, i){
      var el = document.getElementById(uid + '-f' + i);
      vals[f.key] = el ? el.value : '';
    });
    var text = String(template || '').replace(/\{(\w+)\}/g, function(_, k){ return vals[k] ?? ''; });
    document.getElementById(uid + '-preview').textContent = text;
    var btn = document.getElementById(uid + '-btn');
    var emptyRequired = fields.some(function(f){ return f.required && !vals[f.key]; });
    if(emptyRequired){
      btn.disabled = true;
      btn.textContent = '请填写必填项';
    } else {
      btn.disabled = false;
      btn.textContent = '复制指令';
    }
  }

  setTimeout(function(){
    fields.forEach(function(f, i){
      var el = document.getElementById(uid + '-f' + i);
      if(el){
        el.addEventListener('input', renderPreview);
        el.addEventListener('change', renderPreview);
      }
    });
    document.getElementById(uid + '-btn').addEventListener('click', function(){
      if(this.disabled) { toast('请先填写','必填字段未填写',{badge:{text:'提示',type:'warn'}}); return; }
      var text = document.getElementById(uid + '-preview').textContent;
      copyText(text);
    });
    renderPreview();
  }, 0);

  return html;
}

/* ── selectList（P0 · 勾选列表 + 批量操作 + 计数联动 + 行内控件 v1.9）──
 * selectList(items, batchActions?, opts?)
 * items: [{ id, title, sub?, group?, widget? }]
 *   widget（v1.9 · #327）: { type:'date'|'text'|'select', key, label?, placeholder?, options? }
 *     - options: [ {value,label} | '原始值' ]（select 用; 缺省渲染占位「请选择」）
 *     - 非法 type 降级 text（宽容渲染, 不报错）; key 缺省 'w'+行号
 * batchActions: [{ label, kind:'ok'|'danger', onClick(ids, values?) }]
 *   - v1.9: onClick 第二参 values = 勾选条目对应的行内值 { [id]: { [key]: value } }
 *     （只读勾选条目; 未填 → null, 不报错; 未勾选条目不参与）
 * opts: { onSubmit(selectedIds, values) }  —— v1.9 读取接口（选定形态, 等价 getValues）
 *   - 任意批量操作按钮点击后触发（与 onClick 并列; 无勾选时不触发, 与既有拦截一致）
 *   - values = 全部行内值 { [id]: { [key]: value } }（含未勾选条目; 未填 → null; 无 widget 条目不出现）
 * 安全: 行内 label/placeholder/option value+label 渲染一律 esc, 零注入面
 * 兼容: 未声明 widget 的既有调用渲染输出与行为完全不变（守卫测试回归 outerHTML）
 */
function selectList(items, batchActions, opts){
  items = arr(items);
  batchActions = arr(batchActions);
  opts = opts || {};
  var uid = 'sl' + Math.random().toString(36).slice(2,7);
  var groups = {};
  items.forEach(function(it){
    var g = it.group || '';
    (groups[g] = groups[g] || []).push(it);
  });
  var groupNames = Object.keys(groups);

  /* 行内控件 HTML（v1.9 · #327）: 未声明 widget → 空串, 渲染零变化 */
  function widgetHtml(it, idx){
    var w = it.widget;
    if(!w || typeof w !== 'object') return '';
    var t = w.type === 'date' ? 'date' : (w.type === 'select' ? 'select' : 'text');  // 非法 type 降级 text
    var key = w.key != null ? String(w.key) : ('w' + idx);
    var lbl = w.label ? '<span class="sl-widget-label">'+esc(w.label)+'</span>' : '';
    var inner;
    if(t === 'select'){
      inner = '<select class="sl-widget-input" data-wkey="'+esc(key)+'">';
      var os = arr(w.options);
      if(!os.length) inner += '<option value="">请选择</option>';
      os.forEach(function(o){
        var ov = (o && typeof o === 'object') ? (o.value != null ? o.value : o.label) : o;
        var ol = (o && typeof o === 'object') ? (o.label != null ? o.label : o.value) : o;
        inner += '<option value="'+esc(String(ov == null ? '' : ov))+'">'+esc(String(ol == null ? '' : ol))+'</option>';
      });
      inner += '</select>';
    } else {
      inner = '<input class="sl-widget-input" data-wkey="'+esc(key)+'" type="'+t+'"'
        + (w.placeholder ? ' placeholder="'+esc(w.placeholder)+'"' : '')
        + '>';
    }
    return '<span class="sl-widget">'+lbl+inner+'</span>';
  }

  var html = '<div class="sl" id="'+uid+'">';
  if(batchActions.length){
    html += '<div class="sl-batchbar" id="'+uid+'-batch">';
    batchActions.forEach(function(a){
      html += '<button class="copy '+(a.kind==='danger'?'red':'primary')+'" data-batch="'+esc(a.label)+'">'+esc(a.label)+'</button>';
    });
    html += '<span class="sl-count" id="'+uid+'-count">已选 0/'+items.length+'</span>';
    html += '</div>';
  }
  groupNames.forEach(function(g){
    var gItems = groups[g];
    html += '<div class="sl-group"><div class="sl-group-head">'+esc(g||'全部');
    html += ' <span class="sl-group-count">本组已选 0/'+gItems.length+'</span></div>';
    html += '<div class="sl-group-items">';
    gItems.forEach(function(it, idx){
      html += '<label class="sl-item"><input type="checkbox" data-id="'+esc(it.id)+'" data-g="'+esc(g)+'">'
        + '<span class="sl-item-body"><span class="sl-item-title">'+esc(it.title)+'</span>'
        + (it.sub?'<span class="sl-item-sub">'+esc(it.sub)+'</span>':'')
        + widgetHtml(it, idx)
        + '</span></label>';
    });
    html += '</div></div>';
  });
  html += '</div>';

  setTimeout(function(){
    var root = document.getElementById(uid);
    var checkboxes = root.querySelectorAll('input[type="checkbox"]');
    var globalCount = document.getElementById(uid + '-count');
    function update(){
      var total = checkboxes.length;
      var checked = root.querySelectorAll('input[type="checkbox"]:checked').length;
      if(globalCount) globalCount.textContent = '已选 '+checked+'/'+total;
      root.querySelectorAll('.sl-group').forEach(function(gEl){
        var boxes = gEl.querySelectorAll('input[type="checkbox"]');
        var c = gEl.querySelectorAll('input[type="checkbox"]:checked').length;
        var lbl = gEl.querySelector('.sl-group-count');
        if(lbl) lbl.textContent = '本组已选 '+c+'/'+boxes.length;
      });
      return checked;
    }
    checkboxes.forEach(function(cb){
      cb.addEventListener('change', update);
    });
    /* 行内值读取（v1.9 · #327）: 计数只随勾选态, 控件值变化不干扰 */
    function widgetVal(el){
      var v = el.value;
      return (v === '' || v === null || v === undefined) ? null : v;  // 未填统一归一 null
    }
    function readAll(){
      var out = {};
      root.querySelectorAll('.sl-item').forEach(function(itemEl){
        var cb = itemEl.querySelector('input[type="checkbox"]');
        var id = cb ? cb.getAttribute('data-id') : null;
        if(id == null) return;
        itemEl.querySelectorAll('.sl-widget-input').forEach(function(el){
          var key = el.getAttribute('data-wkey');
          if(key == null) return;
          (out[id] = out[id] || {})[key] = widgetVal(el);
        });
      });
      return out;
    }
    function readChecked(){
      var out = {};
      root.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb){
        var id = cb.getAttribute('data-id');
        var itemEl = cb.closest('.sl-item');
        itemEl.querySelectorAll('.sl-widget-input').forEach(function(el){
          var key = el.getAttribute('data-wkey');
          if(key == null) return;
          (out[id] = out[id] || {})[key] = widgetVal(el);
        });
      });
      return out;
    }
    root.querySelectorAll('[data-batch]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var ids = root.querySelectorAll('input[type="checkbox"]:checked');
        if(!ids.length){ toast('请先勾选','勾选要处理的条目',{badge:{text:'提示',type:'warn'}}); return; }
        var idList = Array.prototype.map.call(ids, function(x){ return x.getAttribute('data-id'); });
        var a = batchActions.filter(function(x){ return x.label === btn.getAttribute('data-batch'); })[0];
        if(a && a.onClick) a.onClick(idList, readChecked());  // v1.9: 第二参 = 勾选条目行内值
        if(opts.onSubmit) opts.onSubmit(idList, readAll());   // v1.9: 读取接口 = 全部行内值
      });
    });
    update();
  }, 0);

  return html;
}

/* ── confirm（P0 · 危险操作二次确认）──
 * confirm({ title, detail?, danger?, onOk })
 */
function confirm(cfg){
  cfg = cfg || {};
  var overlay = document.createElement('div');
  overlay.className = 'hm-confirm-overlay';
  overlay.innerHTML = '<div class="hm-confirm-panel">'
    + '<div class="hm-confirm-title">'+(cfg.danger?'⚠️ ':'')+esc(cfg.title||'确认操作')+'</div>'
    + (cfg.detail?'<div class="hm-confirm-detail">'+esc(cfg.detail)+'</div>':'')
    + '<div class="hm-confirm-actions">'
    + '<button class="copy '+(cfg.danger?'red':'primary')+'" data-c="1">'+(cfg.danger?'确认删除':'确认')+'</button>'
    + '<button class="copy" data-c="0">取消</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('[data-c="1"]').addEventListener('click', function(){
    overlay.remove();
    if(cfg.onOk) cfg.onOk();
  });
  overlay.querySelector('[data-c="0"]').addEventListener('click', function(){ overlay.remove(); });
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) overlay.remove();
  });
}

/* ── foldBox（P1 · 折叠区）── */
function foldBox(title, contentHtml){
  return '<details class="hm-fold"><summary>'+esc(title)+'</summary><div class="hm-fold-body">'+(contentHtml||'')+'</div></details>';
}

/* ── statusBadge（P1 · 状态徽章）──
 * statusBadge(status, text?)
 *   status: 'ok'|'warn'|'danger'|'empty'（非法值降级 'empty', 防无样式徽章）
 *   text:   自定义文案（缺省用语义默认: 成功/警告/失败/无数据）
 * 安全: status 白名单后直拼 class（无注入面）; text 经 esc
 */
var STATUS_BADGE_MAP = { ok:'成功', warn:'警告', danger:'失败', empty:'无数据' };
function statusBadge(status, text){
  status = STATUS_BADGE_MAP[status] ? status : 'empty';  // 非法/未知值降级 empty
  var txt = (text === null || text === undefined || text === '') ? STATUS_BADGE_MAP[status] : String(text);
  return '<span class="hm-status '+status+'">'+esc(txt)+'</span>';
}

/* ── emptyState（P1 · 空状态）──
 * emptyState({icon?, text, hint?, action?})
 *   icon:   emoji/文本图标（esc）
 *   text:   主文案（缺省 '暂无数据', esc）
 *   hint:   次要提示（esc）
 *   action: 操作区 HTML —— 受信 HTML 透传（调用方负责其内容安全, 通常为按钮;
 *           如含用户数据必须先 esc）。其余字段一律 esc, 防 XSS。
 */
function emptyState(cfg){
  cfg = cfg || {};
  return '<div class="hm-empty">'
    + (cfg.icon?'<div class="hm-empty-icon">'+esc(cfg.icon)+'</div>':'')
    + '<div class="hm-empty-text">'+esc(cfg.text||'暂无数据')+'</div>'
    + (cfg.hint?'<div class="hm-empty-hint">'+esc(cfg.hint)+'</div>':'')
    + (cfg.action?('<div class="hm-empty-action">'+cfg.action+'</div>'):'')
    + '</div>';
}

/* ── errorReceipt（P1 · 错误回执 · 08 规范 §6.1 三层反馈）──
 * errorReceipt({message, retryPrompt?, data?, log?, payload?})
 *   message:     错误描述（esc, 缺省 '操作失败'）
 *   retryPrompt: 修正重试按钮文案（有则渲染「修正重试」按钮, 复制该 prompt）
 *   data:        复制数据按钮内容（字符串直传; 或省略时从 payload 生成）
 *   log:         复制日志按钮内容（字符串直传; 或省略时从 payload 生成）
 *   payload:     数据信封 {status, data:{meta, scene}} —— 显式传入, 优先于全局
 *   __hmPayload: 兼容全局兜底（actionBar 已设置; 显式 payload 优先）
 * 布局: 修正重试 primary 独立一行 + 复制数据/日志 ghost 一行 2 个（08 规范奇数按钮）
 * 安全: message/data/log 经 esc + data-t 中转（onclick 仅 copyText(this.dataset.t), 零注入面）
 */
function errorReceipt(cfg){
  cfg = cfg || {};
  var payload = cfg.payload || window.__hmPayload || null;
  var dataText = cfg.data != null ? String(cfg.data) : '';
  var logText = cfg.log != null ? String(cfg.log) : '';
  // 有效数据源 = payload 含 scene.snapshot（残缺 payload 视为无数据, 不生成垃圾复制内容）
  var pValid = !!(payload && payload.data && payload.data.scene && payload.data.scene.snapshot);
  if(!dataText && pValid){
    try { dataText = buildDataText(payload); } catch(e){ dataText = ''; }  // 数据不完整 → 不渲染复制数据按钮（错误回执容错）
  }
  if(!logText && pValid){
    try { logText = buildLogText(payload); } catch(e){ logText = ''; }     // 同上
  }
  var html = '<div class="hm-error">'
    + '<div class="hm-error-title">❌ '+esc(cfg.message||'操作失败')+'</div>';
  if(cfg.retryPrompt){
    html += '<div class="hm-actions"><button class="copy primary wide" onclick="copyText(this.dataset.t)" data-t="'+esc(cfg.retryPrompt).replace(/"/g,'&quot;')+'">修正重试</button></div>';
  }
  var btns = '';
  if(dataText) btns += '<button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="'+esc(dataText).replace(/"/g,'&quot;')+'">复制数据</button>';
  if(logText) btns += '<button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="'+esc(logText).replace(/"/g,'&quot;')+'">复制日志</button>';
  if(btns) html += '<div class="hm-actions">'+btns+'</div>';
  return html + '</div>';
}

/* ── smartSelect 选择器组件（v1.14 · #312/#1280 · 复用优先·新建其次）──
 * smartSelect(inputEl, config) → { getState, getValue }
 * 字段级组件: 一页 N 实例, 每字段一容器一 config 一隐藏 input, 互不干扰。
 * **契约现状（#1280 收敛批 · 2026-10-14）**：字段管线已不再调用本函数（`mountFields` 里那一步删了，
 *   候选控件改由 `.filt` 悬浮筛选面板承担）；本函数**不再从字段形状读 `new_prefixes`／`group_by`**
 *   （两个声明键已端到端删除），弹层里的前缀胶囊与分组小标题只认本组件自己的入参
 *   `config.newPrefixes`／`config.groupBy`（显式传才生效）。代码留着，删不删另票定。
 * 定位: 与 copyText/actionBar 同级 Base 组件; 账户/分类/账本/运动类型等
 *   「复用优先·新建其次」字段通用; 零领域词, label/文案/选项/prompt 全由外部注入。
 * v1.14（用户 2026-10-13 二改）: 默认态收成一枚**一行高的触发器**, 占字段右侧那一格 ——
 *   未选值＝灰字（必填「请选择」／选填「不限」）, 已选值＝正常字色（超长省略号截断）,
 *   选填字段右侧一枚小 ✕ 清空（必填不给清空）; 触发器只是那枚隐藏 input 的外观, 回填协议不变。
 *   候选 chips／过滤框／输入新名称／＋新建／留空那一大坨不再出现在页面上, 全收进点开的弹层
 *   （.ss-sheet · 面板票 c2d16e51 的同一块, 不另写第二套）: 固定搜索框 ＋ 按一级分类分组的
 *   行式列表(小标题吸顶) ＋ 库里没有的串在首行出「＋ 新建 "<串>"」(点了＝新建并选中)
 *   ＋ 底栏新建区（前缀胶囊＝把「前缀/」填进弹层输入框; 选填字段另有「留空(不填)」）。
 *   四种关法(✕／背罩／Esc／下拉过阈值)、焦点陷阱、↑/↓＋Enter、reduced-motion 归零照旧。
 * config（snake_case, 与数据契约 form.selector.<fieldKey> 对齐）:
 *   options:         [{name, disabled}] 已有项(含停用态); 缺省 [] 且无推断/推荐/initial → 降级普通输入
 *   inferred:        string|null  AI 推断最可能的已有项
 *   recommended_new: string|null  AI 推荐新建项(不在 options 中)
 *   initial:         {name, source}|null  显式初始选中; source 白名单 = _SS_SOURCES
 *   required:        boolean  必填＝不给清空 ✕、弹层里不给「留空」(缺省 false)
 *   newPrefixes:     string[]  顶层闭集的前缀清单: 弹层底栏的胶囊, 点一下＝把「前缀/」填进弹层输入框
 *   texts.placeholder:string|null  未选值时触发器上的灰字(缺省: required ? '请选择' : '不限')
 *   texts.sheetTitle:string|null  弹层标题(缺省「选择候选」; 调用方按字段 label 传「选择 分类/名目」)
 *   texts:           {placeholder, search, newRow, emptyButton, sheetClose, hotTag, groupOther,
 *                     prefixCaption, sheetFoot, sheetEmpty, clear}
 *   theme:           {brand, brandSoft, onBrand, deep}  缺省账本藏蓝 #123A63
 * 初始选中推导（initial 缺省时）: AI 推断 > 历史预填(input.value) > AI 推荐新建 > 空
 * 行为: 触发器(值／灰字占位 ＋ 选填清空 ✕) ＋ 弹层(搜索过滤 ＋ 分组行式列表 ＋ 常用 ＋
 *       停用划线置灰 ＋ 新建入口 ＋ 前缀 ＋ 留空); 重名走比较键自动选中已有那个拼写; 绝不静默填错
 * 回填协议: input.value + dataset.source + dataset.new('1'=新建) + change 事件(bubbles)
 * 安全: 所有动态文本经 esc; 类名全 ss- 命名空间（封装纪律, 防宿主同名类冲突）
 * 校验: 结构违规直接报错（对齐 Base v1.2「违规直接报错」）
 */
var _SS_SOURCES = ['inferred','recommended_new','existing','history','custom','empty'];
var _SS_THEME = { brand:'#123a63', brandSoft:'#e9f0f7', onBrand:'#ffffff', deep:'#0b1f3b' };
/** 底部面板实例序号：行 id 用它做前缀，保证一页多实例也不撞 id（aria-activedescendant 靠 id 指行）。 */
var _SS_SHEET_SEQ = 0;
var _SS_TEXTS = {
  placeholder:'',
  search:'输入过滤候选',
  newRow:'＋ 新建',
  emptyButton:'留空(不填)',
  sheetTitle:'选择候选',
  sheetClose:'关闭',
  hotTag:'常用',
  groupOther:'其他',
  prefixCaption:'先选前缀',
  sheetFoot:'找不到？在上面输入新名称 → 新建',
  sheetEmpty:'没有匹配的候选',
  /* 空候选（#1280）：这一格一个候选都没有（pick-only 时它是唯一能给的话）；与「过滤没匹配上」分开。 */
  noOptions:'没有可选项',
  /* 计数（#1280 初版）：`{n}`＝候选总数、`{m}`＝过滤后还看得见的行数；两个模板都由调用方可覆写。 */
  countAll:'共 {n} 项',
  countFiltered:'匹配 {m} 项 / 共 {n} 项',
  clear:'清空'
};
/** 重名判定用的比较键（#1269 值级放开 · 用户 2026-10-13 定稿）：NFKC（全角折半角、兼容字符归一）
 *  ＋ 空白折叠 ＋ 大小写折叠。只用来**判定是不是同一个值**；落库与显示的字面量仍是候选／用户那一份，
 *  本函数不改写任何值（改写是命令侧去重的活）。*/
function ssNameKey(s){
  return String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, ' ').trim().toLowerCase();
}
function smartSelect(inputEl, config){
  /* ── 结构校验（违规直接报错）── */
  if(!inputEl || inputEl.tagName !== 'INPUT'){
    throw new Error('smartSelect 违规: inputEl 必须是 <input> 元素');
  }
  if(!config || typeof config !== 'object' || Array.isArray(config)){
    throw new Error('smartSelect 违规: config 必须是对象');
  }
  var options = config.options === undefined ? [] : config.options;
  if(!Array.isArray(options)){
    throw new Error('smartSelect 违规: options 必须是数组');
  }
  options.forEach(function(o, i){
    if(!o || typeof o !== 'object' || typeof o.name !== 'string' || !o.name.trim()){
      throw new Error('smartSelect 违规: options['+i+'] 必须含非空 name(字符串)');
    }
    if(o.disabled !== undefined && typeof o.disabled !== 'boolean'){
      throw new Error('smartSelect 违规: options['+i+'].disabled 必须是布尔');
    }
  });
  ['inferred','recommended_new'].forEach(function(k){
    var v = config[k];
    if(v !== undefined && v !== null && typeof v !== 'string'){
      throw new Error('smartSelect 违规: '+k+' 必须是字符串或 null');
    }
  });
  if(config.initial !== undefined && config.initial !== null){
    var ini = config.initial;
    if(!ini || typeof ini !== 'object' || typeof ini.name !== 'string'
       || _SS_SOURCES.indexOf(ini.source) < 0){
      throw new Error('smartSelect 违规: initial 必须含 name(字符串) + source(白名单 '+_SS_SOURCES.join('|')+')');
    }
  }
  if(config.texts !== undefined && (typeof config.texts !== 'object' || Array.isArray(config.texts))){
    throw new Error('smartSelect 违规: texts 必须是对象');
  }
  if(config.theme !== undefined && (typeof config.theme !== 'object' || Array.isArray(config.theme))){
    throw new Error('smartSelect 违规: theme 必须是对象');
  }
  if(config.required !== undefined && typeof config.required !== 'boolean'){
    throw new Error('smartSelect 违规: required 必须是布尔');
  }
  var newPrefixes = config.newPrefixes === undefined ? [] : config.newPrefixes;
  if(!Array.isArray(newPrefixes)){
    throw new Error('smartSelect 违规: newPrefixes 必须是数组');
  }
  newPrefixes.forEach(function(x, i){
    if(typeof x !== 'string' || !x.trim()){
      throw new Error('smartSelect 违规: newPrefixes['+i+'] 必须是非空字符串');
    }
  });
  if(config.pickOnly !== undefined && typeof config.pickOnly !== 'boolean'){
    throw new Error('smartSelect 违规: pickOnly 必须是布尔');
  }
  /* 候选项附注（#1280）：`{值: 小字}`；值是字符串这一条在控件这一层严格判（声明侧的子集校验器只判「是对象」）。 */
  var notes = (config.notes === undefined || config.notes === null) ? {} : config.notes;
  if(typeof notes !== 'object' || Array.isArray(notes)){
    throw new Error('smartSelect 违规: notes 必须是 {值: 小字} 的对象');
  }
  Object.keys(notes).forEach(function(k){
    if(typeof notes[k] !== 'string'){
      throw new Error('smartSelect 违规: notes['+k+'] 必须是小字(字符串)');
    }
  });
  if(config.groupBy !== undefined && config.groupBy !== null && ['', 'slash', 'none'].indexOf(config.groupBy) < 0){
    throw new Error('smartSelect 违规: groupBy 只能是 slash|none');
  }

  var texts = Object.assign({}, _SS_TEXTS, config.texts || {});
  var theme = Object.assign({}, _SS_THEME, config.theme || {});
  var custom = [];
  var required = !!config.required;
  /* pick-only（#1280 初版）：这一格不放开新建 ⇒ 弹层里既没有「＋ 新建」行、也没有前缀行，
     底栏除「留空(不填)」之外什么都没有（必填连留空也没有＝整条底栏不渲染）。 */
  var pickOnly = config.pickOnly === true;
  var valueNotes = notes;                     /* 值 → 行右侧小字；这份映射里没有的值不印 */
  var groupBy = String(config.groupBy || ''); /* 分组口径：''／'slash'＝值里首个 `/` 前那段；'none'＝不分组 */
  /* 未选值时触发器上的灰字：必填＝请选择／选填＝不限（调用方可按字段声明覆写，如「不写类型」） */
  var placeholder = String(texts.placeholder || (required ? '请选择' : '不限'));

  /* ── 降级模式: 无选项/无推断/无推荐/无 initial → 普通输入 ──
     pick-only 的格不进降级分支：它本来就不许用户敲新值，没候选时该给的是「没有可选项」那个空态，
     而不是一枚让人敲了的自由文本框（#1280）。 */
  var degraded = !options.length && !config.inferred && !config.recommended_new && !config.initial && !pickOnly;
  if(degraded){
    inputEl.classList.add('ss-plain');
    inputEl.style.display = '';
    inputEl.removeAttribute('hidden');
    var syncDegraded = function(){
      var v = inputEl.value;
      inputEl.dataset.source = v ? 'custom' : 'empty';
      inputEl.dataset.new = v ? '1' : '0';
    };
    syncDegraded();
    inputEl.addEventListener('input', syncDegraded);
    return {
      getState: function(){ var v = inputEl.value; return { name: v || null, mode: v ? 'custom' : 'empty' }; },
      getValue: function(){ return inputEl.value; }
    };
  }

  /* ── 初始选中推导: initial > AI 推断 > 历史预填(input.value) > AI 推荐新建 > 空 ── */
  var state;
  if(config.initial){
    state = { name: config.initial.name, mode: config.initial.source };
  } else if(config.inferred){
    state = { name: config.inferred, mode: 'inferred' };
  } else if(inputEl.value){
    state = { name: inputEl.value, mode: 'history' };
  } else if(config.recommended_new){
    state = { name: config.recommended_new, mode: 'recommended_new' };
  } else {
    state = { name: null, mode: 'empty' };
  }

  inputEl.style.display = 'none';
  var root = document.createElement('div');
  root.className = 'ss-root';
  root.style.setProperty('--ss-brand', theme.brand);
  root.style.setProperty('--ss-brand-soft', theme.brandSoft);
  root.style.setProperty('--ss-on-brand', theme.onBrand);
  root.style.setProperty('--ss-deep', theme.deep);
  inputEl.parentNode.insertBefore(root, inputEl.nextSibling);

  /** 触发器右端那枚箭头（与 .pfield .inwrap.native select 自绘箭头同一笔形，不自创风格）。 */
  var CARET_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function writeBack(){
    inputEl.value = state.name || '';
    inputEl.dataset.source = state.mode || 'empty';
    inputEl.dataset.new = (state.mode === 'recommended_new' || state.mode === 'custom') ? '1' : '0';
    inputEl.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function setSel(name, mode){
    state.name = name;
    state.mode = mode;
    render();
    writeBack();
  }

  function allNames(){
    var names = options.map(function(o){ return o.name; });
    return names.concat(custom);
  }

  /** 库里有没有这个写法（比较键口径：全角/空白/大小写差异算同一个值）——没有才给「＋ 新建」入口。 */
  function ssHasName(v){
    var key = ssNameKey(v);
    for(var i = 0; i < chipsMeta.length; i++){
      if(ssNameKey(chipsMeta[i].name) === key) return true;
    }
    return false;
  }

  /* 候选元信息 {name, mode, dis, sel}：render() 每次重建；弹层的行式列表(分组/常用/停用)读这一份。
     声明在本作用域而不是 render() 里——弹层那几个渲染函数住在 render 之外，读不到函数内声明。 */
  var chipsMeta = [];
  /** 默认态＝一枚触发器（用户 2026-10-13 二改）：值/灰字占位 ＋ 右端箭头；选填且有值时右侧一枚 ✕ 清空
   *  （必填不给清空）。候选、新建、留空都不在这里——点它开弹层（.ss-sheet）。 */
  function render(){
    chipsMeta = [];
    function pushMeta(n, m, dis){
      chipsMeta.push({ name: n, mode: m, dis: !!dis, sel: !dis && state.name === n });
    }
    if(config.inferred) pushMeta(config.inferred, 'inferred', false);
    if(config.recommended_new) pushMeta(config.recommended_new, 'recommended_new', false);
    options.forEach(function(o){
      if(o.name === config.inferred || o.name === config.recommended_new) return;
      pushMeta(o.name, 'existing', !!o.disabled);
    });
    custom.forEach(function(n){ pushMeta(n, 'custom', false); });

    var hasVal = !!state.name;
    var isOpen = !!(sheetEl && sheetEl.classList.contains('show'));
    root.innerHTML =
      '<button type="button" class="ss-trigger'+(hasVal ? '' : ' is-empty')+(hasVal && !required ? ' has-clear' : '')+'"'
      + ' data-open="1" aria-haspopup="dialog" aria-expanded="'+(isOpen ? 'true' : 'false')+'"'
      + (inputEl.disabled ? ' disabled' : '') + '>'
      + '<span class="ss-trg-text'+(hasVal ? '' : ' is-ph')+'">'+esc(hasVal ? state.name : placeholder)+'</span>'
      + '</button>'
      + '<span class="ss-trg-caret" aria-hidden="true">'+CARET_SVG+'</span>'
      + ((hasVal && !required)
          ? '<button type="button" class="ss-trg-x" data-clear="1" aria-label="'+esc(texts.clear)+'">✕</button>'
          : '');
    root.querySelector('.ss-trigger').addEventListener('click', function(e){
      if(sheetEl && sheetEl.classList.contains('show')) ssSheetClose();
      else ssSheetOpen(e.currentTarget);
    });
    var clr = root.querySelector('.ss-trg-x');
    if(clr){
      clr.addEventListener('click', function(e){
        e.stopPropagation();
        setSel(null, 'empty');   /* 清空＝回到灰字占位（选填「不限」），与弹层里的「留空」同一条回填 */
      });
    }
  }

  /* ── 底部候选面板（面板票 · 用户 2026-10-13 定稿；同日二改：它成了唯一的候选入口）─────
     点触发器开这块面板：抓手条下拉关闭 ＋ 固定搜索框（小写包含过滤）＋ 按「值里 `/` 前那一段」
     分组的行式列表（小标题吸顶）＋ 每行右侧「常用」＋ 首行新建入口 ＋ 底栏新建区（前缀／留空）。
     四种关法：✕／点背罩／Esc／抓手条下拉过阈值。开面板焦点进搜索框，关掉焦点回触发器；
     Tab 在面板内首尾循环(focus trap)；↑/↓ 移高亮、Enter 选中（行是 <button>，不是 div，带 :focus-visible 环）。
     面板挂 document.body：.sheet 自带 transform 与滚动容器，挂里面 position:fixed 会被裁。
     零依赖、纯 DOM＋CSS；合成层只动 transform／opacity。 */
  var sheetEl = null;                 /* .ss-sheet 节点（懒建，一实例一次） */
  var scrimEl = null;                 /* 背罩 */
  var sheetListEl = null;             /* 可滚动列表容器 */
  var sheetSearchEl = null;           /* 面板自己的搜索框 */
  var sheetCountEl = null;            /* 面板头部的计数行（共 N 项／匹配 M 项 / 共 N 项，#1280） */
  var sheetInst = 0;                  /* 本实例行 id 前缀（一页多实例不撞 id） */
  var sheetRaw = '';                  /* 面板过滤词原字面量（新建入口要按用户敲的原样回填） */
  var sheetQ = '';                    /* 面板过滤词（小写，供「小写包含」判定） */
  var sheetHl = -1;                   /* ↑/↓ 高亮行下标（-1=没有） */
  var sheetRows = [];                 /* 当刻可见的可点行（文档序） */
  var sheetTrigger = null;            /* 关掉后回焦点的触发器 */
  var SS_DRAG_CLOSE_PX = 96;          /* 下拉超过这个位移＝关（松手时判定） */
  var SS_DRAG_FLICK_PX = 24;          /* 轻扫最小位移 */
  var SS_DRAG_FLICK_V = 0.5;          /* 轻扫速度阈值(px/ms)；与位移二者满足其一即关 */

  function ssSheetTitle(){ return String(texts.sheetTitle || _SS_TEXTS.sheetTitle); }
  /* 一级分组＝值里 `/` 前那一段；没有 `/`（或起手就是 `/`）的归「其他」。
     #1280：抽出具名函数 `ssValueGroup`，分组口径由本组件的 config.groupBy 选（缺省＝这一条）。 */
  function ssValueGroup(n){
    var i = n.indexOf('/');
    var head = i > 0 ? n.slice(0, i).trim() : '';
    return head || String(texts.groupOther);
  }
  /* `config.groupBy:'none'` ⇒ 返回空串：前景列表只出一层，不出分组小标题（调用处按空串跳过小标题）。 */
  function ssGroupOf(n){
    return groupBy === 'none' ? '' : ssValueGroup(n);
  }
  /* 常用＝出现次数前 3：候选清单由技能侧按次数降序给（candidateLists.ts 的 rankByFrequency），
     载荷里没有次数这一格 ⇒「前 3 个已有候选」就是次数前 3 —— 顺序即频次序，不另造数据。 */
  function ssHotNames(){
    var hot = {}, n = 0;
    for(var i = 0; i < chipsMeta.length && n < 3; i++){
      var c = chipsMeta[i];
      if(c.dis || c.mode !== 'existing' || hot[c.name]) continue;
      hot[c.name] = 1; n++;
    }
    return hot;
  }
  /** 首行新建入口（用户 2026-10-13 二改）：搜索框里敲的串库里没有 ⇒ 出这一行，点了＝新建并选中。
   *  行是 <button role="option">，进 sheetRows 一起走 ↑/↓＋Enter；data-new=1 标出「这一行是新建」。 */
  function ssNewRowHtml(){
    return '<button type="button" role="option" class="ss-row ss-row-new" id="ss-row-'+sheetInst+'-new"'
      + ' data-n="'+esc(sheetRaw)+'" data-m="custom" data-new="1" aria-selected="false">'
      + '<span class="ss-row-nm">'+esc(String(texts.newRow))+' "'+esc(sheetRaw)+'"</span></button>';
  }
  function ssSheetRender(){
    var hot = ssHotNames();
    var out = [];
    /* pick-only：没有「＋ 新建」这一行（#1280）。 */
    if(!pickOnly && sheetRaw && !ssHasName(sheetRaw)) out.push(ssNewRowHtml());
    var group = null;
    var shown = 0;                                        /* 过滤之后还看得见的候选行数（＝计数里的 M） */
    for(var i = 0; i < chipsMeta.length; i++){
      var it = chipsMeta[i];
      if(sheetQ && it.name.toLowerCase().indexOf(sheetQ) < 0) continue;
      var g = ssGroupOf(it.name);
      if(g && g !== group){ group = g; out.push('<div class="ss-group-hd">'+esc(g)+'</div>'); }
      var sel = !it.dis && state.name === it.name;
      shown++;
      out.push('<button type="button" role="option" class="ss-row'+(it.dis?' is-off':'')+(sel?' is-sel':'')+'"'
        + ' id="ss-row-'+sheetInst+'-'+i+'"'
        + (it.dis ? ' disabled aria-disabled="true"' : ' data-n="'+esc(it.name)+'" data-m="'+it.mode+'"')
        + ' aria-selected="'+(sel?'true':'false')+'">'
        + '<span class="ss-row-nm">'+(sel?'✓ ':'')+esc(it.name)+(it.dis?' · 停用':'')+'</span>'
        + (valueNotes[it.name] ? '<span class="ss-row-note">'+esc(String(valueNotes[it.name]))+'</span>' : '')
        + (hot[it.name] ? '<span class="ss-row-hot">'+esc(texts.hotTag)+'</span>' : '')
        + '</button>');
    }
    var total = chipsMeta.length;                         /* 候选总数（＝计数里的 N） */
    if(!out.length) out.push('<div class="ss-sheet-empty">'+esc(total ? texts.sheetEmpty : texts.noOptions)+'</div>');
    if(sheetCountEl){
      sheetCountEl.textContent = String(shown === total ? texts.countAll : texts.countFiltered)
        .replace('{n}', String(total)).replace('{m}', String(shown));
    }
    sheetListEl.innerHTML = out.join('');
    sheetRows = [];
    var els = sheetListEl.querySelectorAll('.ss-row[data-n]');
    for(var k = 0; k < els.length; k++) sheetRows.push(els[k]);
    sheetHl = -1;
    ssSheetPaintHl();
  }
  function ssSheetPaintHl(){
    for(var i = 0; i < sheetRows.length; i++){
      sheetRows[i].classList.toggle('is-hl', i === sheetHl);
    }
    var cur = sheetHl >= 0 ? sheetRows[sheetHl] : null;
    if(!cur){ sheetSearchEl.removeAttribute('aria-activedescendant'); return; }
    try{ cur.scrollIntoView({ block:'nearest' }); }catch(e){ cur.scrollIntoView(false); }
    sheetSearchEl.setAttribute('aria-activedescendant', cur.id);
  }
  function ssSheetFocusables(){
    var out = [], els = sheetEl.querySelectorAll('button, input, [tabindex]');
    for(var i = 0; i < els.length; i++){
      if(els[i].disabled) continue;
      if(els[i].getAttribute('tabindex') === '-1') continue;
      out.push(els[i]);
    }
    return out;
  }
  function ssSheetOpen(trigger){
    if(inputEl.disabled) return;                          /* 互斥组置灰的格：不给开（与 input 同一条禁用口径） */
    if(!sheetEl) ssSheetBuild();
    sheetTrigger = trigger || null;
    sheetRaw = ''; sheetQ = '';                           /* 触发器上没有可带的过滤词：每次开都是全量候选 */
    sheetSearchEl.value = '';
    ssSheetRender();
    scrimEl.classList.add('show');
    sheetEl.classList.add('show');
    var trg = root.querySelector('.ss-trigger');
    if(trg) trg.setAttribute('aria-expanded', 'true');
    try{ sheetSearchEl.focus(); }catch(e){}
  }
  function ssSheetClose(){
    if(!sheetEl || !sheetEl.classList.contains('show')) return;
    sheetEl.classList.remove('show');
    scrimEl.classList.remove('show');
    sheetEl.style.transition = '';
    sheetEl.style.transform = '';
    /* 焦点回触发器：没重渲染时就是那一枚；选择后触发器重渲染过，按同类按钮找回来的新节点 */
    var t = (sheetTrigger && sheetTrigger.isConnected) ? sheetTrigger : root.querySelector('.ss-trigger');
    sheetTrigger = null;
    var trg = root.querySelector('.ss-trigger');
    if(trg) trg.setAttribute('aria-expanded', 'false');
    if(t){ try{ t.focus(); }catch(e){} }
  }
  function ssSheetChoose(el){
    var n = el.getAttribute('data-n');
    if(n === null) return;
    if(el.getAttribute('data-new') === '1'){
      /* 首行新建：库里没有同键写法才出现；再判一次键（并发改动兜底），命中已有就选已有那个拼写 */
      var key = ssNameKey(n), names = allNames(), hit = null;
      for(var i = 0; i < names.length; i++){
        if(ssNameKey(names[i]) === key){ hit = names[i]; break; }
      }
      if(hit){ setSel(hit, 'existing'); }
      else { custom.unshift(n); setSel(n, 'custom'); }
    } else {
      setSel(n, el.getAttribute('data-m') || 'existing');  /* 与点候选同一套回填(input.value + dataset + change) */
    }
    ssSheetClose();                                        /* 触发器此时已重渲染，焦点按找回来的那枚走 */
  }
  /** 弹层底栏的新建区（用户 2026-10-13 二改）：前缀胶囊（点一下＝把「前缀/」填进弹层输入框）
   *  ＋ 找不到的提示 ＋ 留空(不填)（选填字段才有；必填不给「留空」）。
   *  pick-only（#1280）：这一格不放开新建 ⇒ 底栏除「留空(不填)」外什么都没有；留空也没有（必填）时
   *  返回空串，整条底栏不渲染（调用处按空串跳过 .ss-sheet-foot）。 */
  function ssSheetFootHtml(){
    if(pickOnly){
      return required ? ''
        : '<div class="ss-foot-line">'
          + '<button type="button" class="ss-empty" data-empty="1">'+esc(texts.emptyButton)+'</button>'
          + '</div>';
    }
    var pfx = '';
    if(newPrefixes.length){
      pfx = '<div class="ss-pfx-row"><span class="ss-pfx-cap">'+esc(texts.prefixCaption)+'</span>';
      for(var i = 0; i < newPrefixes.length; i++){
        pfx += '<button type="button" class="ss-pfx-btn" data-pfx="'+esc(newPrefixes[i])+'">'+esc(newPrefixes[i])+'</button>';
      }
      pfx += '</div>';
    }
    return pfx
      + '<div class="ss-foot-line"><span class="ss-foot-tip">'+esc(texts.sheetFoot)+'</span>'
      + (required ? ''
          : '<button type="button" class="ss-empty" data-empty="1">'+esc(texts.emptyButton)+'</button>')
      + '</div>';
  }
  function ssSheetBuild(){
    sheetInst = (_SS_SHEET_SEQ += 1);
    scrimEl = document.createElement('div');
    scrimEl.className = 'ss-scrim';
    sheetEl = document.createElement('div');
    sheetEl.className = 'ss-sheet';
    sheetEl.setAttribute('role', 'dialog');
    sheetEl.setAttribute('aria-modal', 'true');
    sheetEl.setAttribute('aria-label', ssSheetTitle());
    sheetEl.innerHTML =
      '<div class="ss-grab" data-grab="1" aria-hidden="true"><i></i></div>'
      + '<div class="ss-sheet-head">'
      + '<div class="ss-sheet-titlebar"><div class="ss-sheet-title">'+esc(ssSheetTitle())+'</div>'
      + '<button type="button" class="ss-sheet-x" data-x="1" aria-label="'+esc(texts.sheetClose)+'">✕</button></div>'
      + '<input class="ss-search ss-sheet-search" type="search" placeholder="'+esc(texts.search)+'" aria-label="'+esc(texts.search)+'">'
      + '<div class="ss-sheet-count" data-count="1"></div>'
      + '</div>'
      + '<div class="ss-sheet-body" data-list="1" role="listbox" aria-label="'+esc(ssSheetTitle())+'"></div>'
      + (ssSheetFootHtml() ? '<div class="ss-sheet-foot">'+ssSheetFootHtml()+'</div>' : '');
    document.body.appendChild(scrimEl);
    document.body.appendChild(sheetEl);
    /* 面板挂 body（在 .ss-root 之外）：把本实例的主题变量搬过来，否则面板里的 var(--ss-brand*)
       全部落空（高亮背景会化成 transparent）。读不到就吃 CSS 里那对缺省账本藏蓝。 */
    try{
      var cs = getComputedStyle(root);
      var bv = String(cs.getPropertyValue('--ss-brand') || '').trim();
      var sv = String(cs.getPropertyValue('--ss-brand-soft') || '').trim();
      if(bv) sheetEl.style.setProperty('--ss-brand', bv);
      if(sv) sheetEl.style.setProperty('--ss-brand-soft', sv);
    }catch(err){}
    sheetListEl = sheetEl.querySelector('[data-list]');
    sheetSearchEl = sheetEl.querySelector('.ss-sheet-search');
    sheetCountEl = sheetEl.querySelector('[data-count]');
    scrimEl.addEventListener('click', ssSheetClose);
    sheetEl.querySelector('[data-x]').addEventListener('click', ssSheetClose);
    sheetSearchEl.addEventListener('input', function(){
      sheetRaw = String(sheetSearchEl.value || '').trim();
      sheetQ = sheetRaw.toLowerCase();
      ssSheetRender();
    });
    /* 前缀胶囊：点一下＝把「前缀/」填进弹层输入框（不提交，用户接着敲名字；焦点留在框里） */
    sheetEl.querySelectorAll('[data-pfx]').forEach(function(b){
      b.addEventListener('click', function(){
        sheetSearchEl.value = b.getAttribute('data-pfx') + '/';
        sheetRaw = String(sheetSearchEl.value).trim();
        sheetQ = sheetRaw.toLowerCase();
        ssSheetRender();
        try{ sheetSearchEl.focus(); }catch(e){}
      });
    });
    /* 留空(不填)：选填字段才有；与选一行同一条回填链路，选完关面板 */
    var emptyBtn = sheetEl.querySelector('[data-empty]');
    if(emptyBtn){
      emptyBtn.addEventListener('click', function(){ setSel(null, 'empty'); ssSheetClose(); });
    }
    sheetListEl.addEventListener('click', function(e){
      var row = (e.target && e.target.closest) ? e.target.closest('.ss-row[data-n]') : null;
      if(row) ssSheetChoose(row);
    });
    sheetEl.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); ssSheetClose(); return; }
      if(e.key === 'Tab'){
        var f = ssSheetFocusables();
        if(!f.length) return;
        var idx = f.indexOf(document.activeElement), last = f.length - 1;
        if(e.shiftKey && idx <= 0){ f[last].focus(); e.preventDefault(); }
        else if(!e.shiftKey && (idx === last || idx < 0)){ f[0].focus(); e.preventDefault(); }
        return;
      }
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        if(!sheetRows.length) return;
        e.preventDefault();
        var step = e.key === 'ArrowDown' ? 1 : -1;
        sheetHl = sheetHl < 0 ? (step > 0 ? 0 : sheetRows.length - 1)
                              : Math.min(sheetRows.length - 1, Math.max(0, sheetHl + step));
        ssSheetPaintHl();
        return;
      }
      if(e.key === 'Enter' && sheetHl >= 0 && sheetRows[sheetHl]){
        e.preventDefault();
        ssSheetChoose(sheetRows[sheetHl]);
      }
    });
    /* Esc 只在面板开着时接管，且走捕获段：aria-modal 的诚实口径——焦点万一不在面板里也关得掉；
       同时掐掉向外冒泡，免得同一下 Esc 把底下那层 HELP 弹层一起关掉（面板是最上面那层）。 */
    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape' || !sheetEl.classList.contains('show')) return;
      e.preventDefault(); e.stopPropagation(); ssSheetClose();
    }, true);
    /* 抓手条下拉关闭（Pointer Events 跟手）：只动 transform；松手按位移与速度判定回弹或关闭。
       列表本身照常滚动，touch-action:none 只给抓手条（用户 2026-10-13 定稿）。 */
    var grab = sheetEl.querySelector('[data-grab]');
    var dragId = null, dragFrom = 0, dragDy = 0, dragT0 = 0;
    grab.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      dragId = e.pointerId; dragFrom = e.clientY; dragDy = 0; dragT0 = Date.now();
      sheetEl.style.transition = 'none';
      grab.classList.add('is-drag');
      try{ grab.setPointerCapture(dragId); }catch(err){}
      e.preventDefault();
    });
    grab.addEventListener('pointermove', function(e){
      if(dragId === null || e.pointerId !== dragId) return;
      var dy = e.clientY - dragFrom;
      dragDy = dy > 0 ? dy : dy / 3;                    /* 上拉阻尼 */
      sheetEl.style.transform = 'translateY(' + Math.max(0, dragDy) + 'px)';
    });
    var grabEnd = function(e){
      if(dragId === null || (e && e.pointerId !== dragId)) return;
      dragId = null;
      grab.classList.remove('is-drag');
      var dt = Math.max(1, Date.now() - dragT0);
      var v = dragDy / dt;                               /* px/ms，向下为正 */
      sheetEl.style.transition = '';
      sheetEl.style.transform = '';
      if(dragDy > SS_DRAG_CLOSE_PX || (dragDy > SS_DRAG_FLICK_PX && v > SS_DRAG_FLICK_V)) ssSheetClose();
    };
    grab.addEventListener('pointerup', grabEnd);
    grab.addEventListener('pointercancel', grabEnd);
  }

  render();
  writeBack();

  return {
    getState: function(){ return { name: state.name, mode: state.mode }; },
    getValue: function(){ return inputEl.value; }
  };
}
</script>
<style>
/* Base Skill token A 组 + 控件样式 v1.11（唯一真相源 · 跨技能 · 领域无关）
 * 来源: 居家管家模板 :root token（对齐 #248/08-HTML交互规范.md 按钮规范）
 * v1.2: 新增新控件样式（formPrompt/selectList/confirm/foldBox/statusBadge/emptyState/errorReceipt/复制预览面板）
 * v1.7: .hm-actions 自约束 max-width 520px 居中（#322 · 修复复制按钮被容器拉伸成半屏宽, 胶囊语义恢复）
 * v1.9: selectList 行内控件样式（.sl-widget* · #327 · 样式走 token A 组）

/* ── token A 组（12 变量, 与组件契约 §6.4 一致）── */
:root {

  --blue: #007aff;        /* 主色（场景按钮） */
  --blue2: #0a63ce;       /* 主色深（按压态/链接） */
  --soft: #f5f8ff;        /* 浅蓝底（stage 徽章） */
  --ok: #34c759;          /* 成功/通过 */
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06);

/* ── 复制按钮基础（对齐 08 规范: ≤3 色按功能区分）── */
button.copy {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  border: none;
  background: var(--line);
  color: var(--fg);
  border-radius: 999px;
  padding: 10px 12px;
  font-weight: 700;
  cursor: pointer;
  margin: 0;
  font-size: 13.5px;
  min-height: 44px;
  min-width: 0;
  flex: 1 1 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  font-family: inherit;
}
button.copy:focus { outline: none; }
button.copy:active { filter: brightness(.93); }
button.copy:disabled { opacity: .45; cursor: not-allowed; }

/* 主场景按钮（蓝实心, 单色系） */
button.copy.primary {
  background: var(--blue);
  color: #fff;
}
button.copy.primary:active { background: var(--blue2); }

/* 危险/破坏性操作（红实心） */
button.copy.red {
  background: #ff3b30;
  color: #fff;
}
button.copy.red:active { background: #c0392b; }

/* ghost: 复制数据/复制日志 = 白底 + 轻主色描边 + 主色文字胶囊（独立一行）
 * v1.26 · #329 降权重: 描边 1px/38% 透明度 + 12px/600 + min-height 40px —— 视觉重心归主操作（VLM 两轮反馈）
 * v1.28 · 审查修复: 透明度 35%→38%（与拍板页 329-ghost对比拍板页.html B 方案所见一致） */
button.copy.ghost {
  background: var(--card);
  color: var(--blue);
  border: 1px solid var(--blue);
  border-color: color-mix(in srgb, var(--blue) 38%, transparent);
  min-height: 40px;
  font-size: 12px;
  font-weight: 600;

/* ── actionBar 网格（偶数一行 2 个; 奇数时重要按钮单独一行由模板控制 wide）── */
.hm-actions {

  max-width: 520px;

  margin-right: auto;
  box-sizing: border-box;
}
.hm-actions .copy.wide {

}

/* 成功/失败徽章（yes 函数用） */

/* ── #507 减动效归零档（照老壳 style.ts 归零档补：默认态一字不动，只在 reduce 下归零）──
 * 覆盖本母版本文件全部动效：summary 小三角 .15s／.mini 按压 .08s／.tab .08s／.copy-btn .12s／
 * .sl-item 行 .15s／.sheet-mask 淡入 .25s／.sheet 滑入 .32s／toast 入场 .22s／hmFade .18s／hmPop .22s。

<script>
/* ===== 技能身份与数据（scene-data 契约 v1 · 全外部注入）===== */
var HELP = JSON.parse(document.getElementById('help-data').textContent);
var SKILL_NAME = HELP.skill_name || '';
var TITLE = HELP.title || '能力速查台';
var SUBTITLE = HELP.subtitle || '';
var META_BLOCKS = HELP.meta_blocks || [];
var INIT_BANNER = HELP.init_banner || null;

/* 契约 v1 (groups[{id,icon,label,subgroups[{id,label,scenes[]}]}])

function normalizeScenes(scenes){

    return {
      id: s.id,
      name: s.title,
      chip: s.wake_word,
      types: (s.types && s.types.length ? s.types : []),
      dev: (s.status === '【待开发】'),

/** 时间槽位取值 → 人话表达式（空＝没选；周／月另带起止日期，命令侧不必懂 ISO 周号）。 */

  var mini = e.target.closest('.mini');
  if (mini) {
    if (e.target.closest('[data-c]')) return;
    openSheet(SCENE[mini.dataset.key]);
  }
});

/* ===== Toast（公共组件）===== */
function showToast(){
  toast('已复制', '粘贴给 AI,技能会自动执行,完成后你会拿到结果 HTML。', {icon:'copy'});
}
function toastMsg(msg){
  toast('请先填写：' + msg, '填写完整后再复制指令', {icon:'warn', badge:{text:'未完成', type:'warn'}});
}
function doCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
/* 复制成功：反馈落在按钮本身（离手最近），toast 只补充细节 */
function markCopied(){
  if (!shCopy) return;
  if (!shCopy.dataset.idle) shCopy.dataset.idle = shCopy.textContent;
  shCopy.classList.add('ok');
  shCopy.textContent = '已复制 ✓';
  clearTimeout(shCopy._ok);
  shCopy._ok = setTimeout(function(){
    shCopy.classList.remove('ok');
    shCopy.textContent = shCopy.dataset.idle || '复制';
  }, 1600);
}

/* ===== 全局复制（含参数校验）===== */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-c]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  var s = SCENE[b.dataset.pid || (b.closest('.mini') ? b.closest('.mini').dataset.key : '')];
  var text = b.dataset.c;
  if (s && s.params && s.params.length) {
    var v = readParams(s.id);
    var miss = getMissing(s, v);
    if (miss.length) {
      /* 条目 4/8（用户 2026-10-12 定稿）：场景页放行复制并列出缺项；详情页依旧阻断并指出缺在哪 */
      if (b.closest('.sheet')) {
        /* 详情页：依旧阻断 ＋ 缺的必填控件抖红框、滚到第一个缺项（条目 8） */
        flagMissing(s, v);
        toastMsg(miss.join('、'));
        return;
      }
      /* 场景页：允许复制 ＋ toast 列出缺项、提醒手动填写（条目 4） */
      text = buildPrompt(s, v);
      doCopy(text);
      toast('已复制，还缺：' + miss.join('、'), '必填字段没有填写，需手动填写', {icon:'warn', badge:{text:'待补齐', type:'warn'}});
      return;
    }
    text = buildPrompt(s, v);
  }
  doCopy(text);
  if (b.id === 'shCopy') markCopied();
  showToast();
  /* B3: 复制后不自动关弹窗 */
});
/* 条目 8（用户 2026-10-12 定稿）：缺必填时抖红框＋滚到第一个缺项居中 */
function flagMissing(s, v){
  var fm = document.querySelector('.pform[data-pid="' + s.id + '"]');
  if (!fm) return;
  var first = null;
  (s.params || []).forEach(function(p){
    if (!(p.req && !((v[p.key] || '').trim()))) return;
    var inp = fm.querySelector('[data-p="' + p.key + '"]');
    if (!inp) return;
    if (!first) first = inp.closest('.pfield');
    inp.classList.remove('hm-missing');
    void inp.offsetWidth;
    inp.classList.add('hm-missing');
    var clear = function(){ inp.classList.remove('hm-missing'); };
    inp.addEventListener('input', clear, {once:true});
    inp.addEventListener('change', clear, {once:true});
  });
  if (first) setTimeout(function(){
    first.classList.remove('nudge');
    void first.offsetWidth;
    first.classList.add('nudge');
    try { first.scrollIntoView({block:'center', behavior:'smooth'}); } catch(err){ try { first.scrollIntoView(); } catch(e2){} }
  }, 40);
  setTimeout(function(){
    var olds = fm.querySelectorAll('.hm-missing');
    for (var i = 0; i < olds.length; i++) olds[i].classList.remove('hm-missing');
  }, 1200);
}

/* ===== 轻量 popover：提示全文贴图标弹出（条目 23 定稿）===== */
var popEl = document.getElementById('pop');
var popAnchor = null;
function popHide(){
  if (!popEl) return;
  popEl.classList.remove('show');
  if (popAnchor) popAnchor.classList.remove('on');
  popAnchor = null;
}
function popShow(anchor, label, text){
  if (!popEl || !anchor) return;
  if (popAnchor === anchor && popEl.classList.contains('show')) { popHide(); return; }
  popHide();
  popAnchor = anchor;
  popEl.innerHTML = '<b>' + esc(label) + '</b><span>' + esc(text) + '</span><i class="tail"></i>';
  popEl.classList.add('show');
  anchor.classList.add('on');
  var r = anchor.getBoundingClientRect();
  var box = (anchor.parentElement && anchor.parentElement.getBoundingClientRect) ? anchor.parentElement.getBoundingClientRect() : r;
  var GAP = 9, M = 8;
  /* 宽度（用户 2026-10-13 定稿）：上限＝这一格输入框的宽度；内容短就按内容窄着来。 */
  var cap = Math.max(140, Math.min(box.width, window.innerWidth - M * 2));
  popEl.style.maxWidth = Math.round(cap) + 'px';
  var w = popEl.offsetWidth, h = popEl.offsetHeight;
  /* 向左展开：右缘贴输入框右缘（图标就在最右），不够宽往左长，再兜一道视口边距。 */
  var right = Math.min(window.innerWidth - M, Math.max(box.right, r.right));
  var left = Math.max(M, right - w);
  var above = r.top - h - GAP, below = above < M;
  popEl.style.left = Math.round(left) + 'px';
  popEl.style.top = Math.round(below ? Math.min(r.bottom + GAP, window.innerHeight - h - M) : above) + 'px';
  popEl.style.setProperty('--pop-tail', Math.round(Math.min(Math.max(14, r.left + r.width / 2 - left), w - 14)) + 'px');
  popEl.classList.toggle('below', below);
}
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.closest) return;
  var btn = t.closest('[data-pop]');
  if (btn) {
    var p = null;
    ((curScene && curScene.params) || []).forEach(function(x){ if (x.key === btn.dataset.pop) p = x; });
    popShow(btn, p ? p.label : '', p && p.hint ? p.hint : '');
    return;
  }
  if (popEl && popEl.classList.contains('show') && !t.closest('#pop')) popHide();
}, true);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') popHide(); });
window.addEventListener('scroll', popHide, true);

/* ===== 搜索（全局跨 Tab + 自动跳转 + 高亮）===== */
var sB = document.getElementById('sB');
var sClear = document.getElementById('sClear');
var lastQuery = '';
function doSearch(){
  var q = sB.value.trim().toLowerCase();
  sClear.style.display = q ? 'flex' : 'none';
  if (!q) {
    var cur = curIndex();
    Array.prototype.forEach.call(pages.children, function(pg, i){
      pg.querySelectorAll('.mini').forEach(function(m){
        m.style.display = '';
        m.querySelector('.m-name').innerHTML = esc(SCENE[m.dataset.key].name);
      });
      /* 清空搜索＝回到默认态：只第一个二级分组展开（搜索期把命中的组都打开过，不复位就留下了）。 */
      pg.querySelectorAll('.subgroup').forEach(function(sg, si){ sg.style.display = ''; sg.open = si === 0; });
    });
    /* 恢复全量后必须同步重算高度锁: 筛选期 .pages 被锁在「筛选后」的当页高, 不重算就当页被锁矮,
       后半页连同末张场景卡一起滚不到 —— 这里的 scrollTo 目标就是当前位置(不触发 scroll 事件), 兜不住这次重算 */
    lockPagesHeight();
    if (lastQuery) pages.scrollTo({left: cur * pages.clientWidth, behavior:'smooth'});
    lastQuery = '';
    document.getElementById('hitC').hidden = true;
    document.getElementById('emptyC').hidden = true;
    return;
  }
  lastQuery = q;
  var total = 0, firstHitPage = -1;
  Array.prototype.forEach.call(pages.children, function(pg, i){
    var pageHit = 0;
    pg.querySelectorAll('.mini').forEach(function(m){
      var show = m.textContent.toLowerCase().indexOf(q) > -1;
      m.style.display = show ? '' : 'none';
      if (show) pageHit++;
      var orig = SCENE[m.dataset.key].name;
      var i2 = orig.toLowerCase().indexOf(q);
      if (q && i2 >= 0) m.querySelector('.m-name').innerHTML = esc(orig.slice(0,i2)) + '<mark>' + esc(orig.slice(i2,i2+q.length)) + '</mark>' + esc(orig.slice(i2+q.length));
      else m.querySelector('.m-name').innerHTML = esc(orig);
    });
    /* 子功能组：无命中则隐藏 */
    pg.querySelectorAll('.subgroup').forEach(function(sg){
      var vis = sg.querySelectorAll('.mini:not([style*="none"])').length > 0;
      sg.style.display = vis ? '' : 'none';
      if (q && vis) sg.open = true;
    });
    total += pageHit;
    if (pageHit > 0 && firstHitPage === -1) firstHitPage = i;
  });
  if (firstHitPage >= 0 && firstHitPage !== curIndex()) {
    pages.scrollTo({left: firstHitPage * pages.clientWidth, behavior:'smooth'});
  }
  document.getElementById('hitC').hidden = false;
  document.getElementById('hitC').textContent = '匹配 ' + total + ' 个场景';
  document.getElementById('emptyC').hidden = total > 0;
}
sB.addEventListener('input', doSearch);
sClear.addEventListener('click', function(){ sB.value = ''; doSearch(); sB.focus(); });
/* 初始锁定 + 子功能组折叠/展开时高度校准 */
lockPagesHeight();
document.addEventListener('click', function(e){
  var sg = e.target.closest('.subgroup > summary');
  if (sg) setTimeout(lockPagesHeight, 60);  /* details 切换后重算 */
});
</script>
