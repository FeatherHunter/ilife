<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>改记录 回执 - 饼干记账</title>
<style>/* base-paint 共享样式资产 · ilife-base · v0.1.0 */
:root {
  --fg: #1d1d1f;
  --fg2: #6e6e73;
  --fg3: #86868b;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: #d2d2d7;
  --blue: #007aff;
  --blue2: #0a63ce;
  --soft: #f5f8ff;
  --ok: #34c759;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06);
}
/* toast */
.ilife-toast-stack {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  pointer-events: none;
}
.ilife-toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-sizing: border-box;
  min-width: 300px;
  max-width: 480px;
  padding: 13px 14px 13px 16px;
  border-radius: 14px;
  background: rgba(28, 28, 30, .94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0;
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 255, 255, .08) inset;
  font-size: 13px;
  line-height: 1.4;
  font-feature-settings: "tnum";
  pointer-events: auto;
  animation: ilife-toast-in .22s cubic-bezier(.34, 1.56, .64, 1) both;
}
@keyframes ilife-toast-in {
  from {
    opacity: 0;
    transform: scale(.9) translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.ilife-toast-danger {
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 59, 48, .45) inset;
}
.ilife-toast-icon {
  flex: 0 0 auto;
  padding-top: 1px;
  font-size: 18px;
  line-height: 1;
}
.ilife-toast-body {
  flex: 1 1 auto;
  min-width: 0;
}
.ilife-toast-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ilife-toast-title {
  margin-bottom: 2px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}
.ilife-toast-title-detail {
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.5;
}
.ilife-toast-chip {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.6;
}
.ilife-toast-chip-ok {
  background: rgba(52, 199, 89, .18);
  color: #4dd96b;
}
.ilife-toast-chip-warn {
  background: rgba(255, 149, 0, .18);
  color: #ffb340;
}
.ilife-toast-chip-danger {
  background: rgba(255, 59, 48, .18);
  color: #ff6961;
}
.ilife-toast-count {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .08);
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ilife-toast-detail {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.5;
}
.ilife-toast-lines {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.ilife-toast-code {
  margin: 6px 0 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, .32);
  color: #aeb0b8;
  font-family: "SF Mono", monospace;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
  max-height: 140px;
  overflow: auto;
}
.ilife-toast-act {
  margin: 0;
  padding: 2px 4px;
  border: 0;
  background: none;
  color: #4dd96b;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-toast-act:active {
  opacity: .7;
}
.ilife-toast-close {
  flex-shrink: 0;
  margin: 0 0 0 6px;
  padding: 5px 9px;
  border: 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, .10);
  color: #34c759;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-toast-act:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ilife-toast-close:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
@media (max-width: 820px) {
  .ilife-toast-stack {
    left: 12px;
    right: 12px;
    transform: none;
    align-items: stretch;
  }
  .ilife-toast {
    min-width: 0;
    max-width: none;
  }
}
/* action-bar */
.ilife-action-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  margin: 12px 0;
  max-width: 520px;
}
@media (min-width: 641px) {
  .ilife-action-bar {
    max-width: none;
  }
}
.ilife-action-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.ilife-action-row-ghost {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (max-width: 820px) {
  .ilife-action-row-ghost {
    position: relative;
  }
}
.ilife-action-row-ghost-single > .ilife-copy-btn {
  grid-column: 1 / -1;
}
.ilife-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-action-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-action-btn-red {
  background: #ff3b30;
  color: var(--card);
}
.ilife-action-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
.ilife-action-btn[disabled],
.ilife-action-btn:disabled {
  opacity: 1;
  border-color: var(--line);
  background: var(--soft);
  color: var(--fg3);
  cursor: not-allowed;
}
@media (max-width: 820px) {
  .ilife-action-btn {
    min-height: 44px;
  }
}
.ilife-action-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* copy-button */
.ilife-copy-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), background-color .2s ease;
}
.ilife-copy-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-copy-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
.ilife-copy-btn-wide {
  width: 100%;
}
.ilife-copy-btn:active {
  transform: scale(.96);
}
.ilife-copy-btn.copied {
  border-color: var(--ok);
  background: var(--ok);
  color: var(--card);
}
.ilife-copy-btn[disabled],
.ilife-copy-btn:disabled {
  opacity: 1;
  border-color: var(--line);
  background: var(--soft);
  color: var(--fg3);
  cursor: not-allowed;
}
.ilife-copy-btn[disabled]:active,
.ilife-copy-btn:disabled:active {
  transform: none;
}
@media (max-width: 820px) {
  .ilife-copy-btn {
    min-height: 44px;
  }
}
.ilife-copy-menu-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn {
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  content: "";
  width: 0;
  height: 0;
  margin-left: 6px;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
  transition: transform .16s ease-out;
}
.copy-menu-open.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  transform: rotate(180deg);
}
.ilife-copy-menu {
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  z-index: 20;
  min-width: 200px;
  box-sizing: border-box;
  max-width: calc(100vw - 32px);
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .16s ease-out, visibility .16s ease-out;
}
.copy-menu-open.ilife-copy-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.ilife-copy-menu-item {
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.ilife-copy-menu-item:hover {
  background: var(--soft);
}
.ilife-copy-menu-item > .ilife-copy-menu-label {
  color: var(--fg);
  font-size: 13px;
}
.ilife-copy-menu-item > .ilife-copy-menu-hint {
  color: var(--fg2);
  font-size: 11px;
  white-space: nowrap;
}
@media (max-width: 820px) {
  .ilife-copy-menu-item {
    min-height: 44px;
  }
  .ilife-copy-menu-wrap {
    position: static;
  }
  .ilife-copy-menu {
    left: 0;
    right: 0;
    width: auto;
    min-width: 0;
    max-width: none;
  }
}
.ilife-copy-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* status-badge */
.ilife-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.6;
  width: fit-content;
}
.ilife-status-badge-ok {
  background: #e6f7ec;
  color: #1f8c3d;
}
.ilife-status-badge-warn {
  background: #fff5e0;
  color: #a25b00;
}
.ilife-status-badge-danger {
  background: #fff0ee;
  color: #a83228;
}
.ilife-status-badge-empty {
  background: #f0f0f3;
  color: var(--fg2);
}
/* empty-state */
.ilife-empty {
  padding: 48px 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  text-align: center;
  color: var(--fg2);
}
.ilife-empty-icon {
  font-size: 28px;
  line-height: 1.2;
  opacity: .5;
}
.ilife-empty-text {
  margin-top: 8px;
  color: var(--fg);
  font-size: 18px;
  font-weight: 600;
}
.ilife-empty-hint {
  margin-top: 4px;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-empty-action {
  margin-top: 16px;
}
/* error-receipt */
.ilife-error:has(> .ilife-error-title) {
  margin: 12px 0;
  padding: 20px 22px;
  border: 1px solid rgba(255, 59, 48, .28);
  border-radius: 14px;
  background: rgba(255, 59, 48, .06);
  color: var(--fg);
}
.ilife-error-title {
  margin-bottom: 14px;
  color: #a83228;
  font-size: 15px;
  font-weight: 700;
}
.ilife-error-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  row-gap: 14px;
  column-gap: 8px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}
.ilife-error-actions > .ilife-copy-btn-wide {
  grid-column: 1 / -1;
}
@media (max-width: 820px) {
  .ilife-error:has(> .ilife-error-title) {
    padding: 16px 14px;
  }
}
/* charts */
.ilife-charts{position:relative;margin:0;padding:0;box-sizing:border-box;font-family:inherit;color:var(--fg,#1d1d1f);--ilife-charts-dot:9px}
.ilife-charts *{box-sizing:border-box}
.ilife-charts-svg{display:block;width:100%;height:auto;overflow:visible}
.ilife-charts-empty{padding:0}
.ilife-charts-anim .ilife-charts-line{transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-bar{transition:height .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-fillbar{transition:width .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-dot{animation:ilife-charts-fade .5s ease both}
@keyframes ilife-charts-fade{from{opacity:0}to{opacity:1}}
.ilife-charts-dot{pointer-events:none}
.ilife-charts-dot-anomaly{filter:drop-shadow(0 0 3px rgba(255,59,48,.18))}
.ilife-charts-markpoint{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.ilife-charts-scatter .ilife-charts-dot{r:calc(var(--ilife-charts-dot) / 2)}
.ilife-charts-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;line-height:1.5;color:var(--fg2,#6e6e73)}
.ilife-charts-legend-right{flex-direction:column;align-items:flex-start}
.ilife-charts-legend-bottom{flex-direction:row;justify-content:center}
.ilife-charts-legend-item{display:inline-flex;align-items:center;gap:6px}
.ilife-charts-legend-swatch{display:inline-block;width:8px;height:8px;border-radius:2px}
.ilife-charts-legend-swatch-dashed{background:repeating-linear-gradient(90deg,var(--fg3,#86868b) 0 4px,transparent 4px 8px)}
.ilife-charts-legend-value{color:var(--fg,#1d1d1f)}
.ilife-charts-legend-pct{color:var(--fg3,#86868b)}
.ilife-charts-pct{display:block;font-size:12px;color:var(--fg2,#6e6e73);text-align:right}
.ilife-charts-progress .ilife-charts-svg{min-height:12px}
.ilife-charts-spark-value{font-size:11px}
.ilife-charts-tick{font-size:9.5px}
.ilife-charts-xlabel{font-size:10px}
.ilife-charts-value{font-size:10px}
.ilife-charts-value-last{font-size:10.5px;font-weight:700}
.ilife-charts-line .ilife-charts-value-last{paint-order:stroke;stroke:var(--bg,#fff);stroke-width:3px;stroke-linejoin:round}
.ilife-charts-marktext{font-size:10px}
.ilife-charts-marktext-v{font-size:10px}
.ilife-charts-mptext{font-size:10.5px;font-weight:700}
.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}
.ilife-charts-bar .ilife-charts-value{font-size:10px}
.ilife-charts-center-label{font-size:8px}
.ilife-charts-center-value{font-size:13px;font-weight:700}
.ilife-charts-gauge-value{font-size:26px;font-weight:800}
.ilife-charts-gauge-label{font-size:11px}
@media (max-width:720px){.ilife-charts{--ilife-charts-dot:8px}.ilife-charts-line .ilife-charts-svg{height:auto}.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}.ilife-charts-legend{font-size:12px}.ilife-charts-line .ilife-charts-tick{font-size:19.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:19.4px}.ilife-charts-line .ilife-charts-value{font-size:19.4px}.ilife-charts-line .ilife-charts-value-last{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:19.4px}}
@media (min-width:721px) and (max-width:875px){.ilife-charts-line .ilife-charts-tick{font-size:12.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:12.4px}.ilife-charts-line .ilife-charts-value{font-size:12.4px}.ilife-charts-line .ilife-charts-value-last{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:12.4px}}
@media (min-width:876px){.ilife-charts-line .ilife-charts-tick{font-size:10.8px}.ilife-charts-line .ilife-charts-xlabel{font-size:10.8px}.ilife-charts-line .ilife-charts-value{font-size:10.8px}.ilife-charts-line .ilife-charts-value-last{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext-v{font-size:10.8px}}
/* help-shell */
.ilife-help-shell {
  display: block;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  color: var(--fg);
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-feature-settings: "tnum";
}
.ilife-help-shell-hero {
  margin-bottom: 20px;
}
.ilife-help-shell-eyebrow {
  margin: 0;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ilife-help-shell-title {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.2;
}
.ilife-help-shell-subtitle {
  margin: 6px 0 0;
  color: var(--fg2);
  font-size: 15px;
}
.ilife-help-shell-lead {
  margin: 4px 0 0;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-help-shell-init {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
}
.ilife-help-shell-init-title {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.ilife-help-shell-init-subtitle {
  margin: 4px 0 0;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-prompt {
  margin: 8px 0 0;
  padding: 12px;
  border-radius: 8px;
  background: var(--soft);
  color: var(--fg2);
  font-family: "SF Mono", monospace;
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-x: auto;
}
.ilife-help-shell-init-steps {
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-step {
  margin: 2px 0;
}
.ilife-help-shell-tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}
.ilife-help-shell-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.ilife-help-shell-tab-icon {
  font-size: 14px;
}
.ilife-help-shell-tab-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.ilife-help-shell-pages {
  display: block;
}
.ilife-help-shell-page {
  display: block;
}
.ilife-help-shell-page-body {
  display: none;
}
.ilife-help-shell-tab-input:checked + .ilife-help-shell-page-body {
  display: block;
}
.ilife-help-shell-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ilife-help-shell-card {
  display: block;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.ilife-help-shell-card-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

/* block-kpi-card */

/* block-data-table */

}
.ilife-block-data-table-row-marker {

  margin-right: 6px;

}

.ilife-block-data-table-carded {

.ilife-block-data-table-bar {

}
.ilife-block-data-table-footnote > .ilife-block-caliber {
  margin: 0;
}
/* block-chart-block */

  border-radius: 14px;

.ilife-block-chart-block-title {

}
.ilife-block-chart-block-canvas {

}
.ilife-block-chart-block-head {

  align-items: baseline;

}
.ilife-block-chart-block-head .ilife-block-chart-block-title {
  margin: 0;
}
.ilife-block-chart-block-unit {
  color: var(--ilife-ink-3, var(--fg3, #86868b));

  font-weight: 600;

.ilife-block-list-rows-row-no-left {

.ilife-block-list-rows-left {

}
.ilife-block-list-rows-main {

  color: var(--fg);

  white-space: nowrap;
}
.ilife-block-list-rows-right {
  color: var(--fg2);
  font-variant-numeric: tabular-nums;
}
.ilife-block-list-rows-row-done .ilife-block-list-rows-main {
  color: var(--ok);

}
.ilife-block-list-rows-two-line .ilife-block-list-rows-row {

.ilife-block-list-rows-two-line .ilife-block-list-rows-main {

}
.ilife-block-list-rows-two-line .ilife-block-list-rows-right {

}
.ilife-block-list-rows-main-line {

  font-size: 15px;

}
.ilife-block-list-rows-note {
  display: block;
  color: var(--ilife-ink-3, var(--fg3, #86868b));

  line-height: 1.45;
  overflow-wrap: anywhere;
}
.ilife-block-list-rows-unit {
  margin-left: 1px;
  font-size: 12px;
  font-weight: 400;
  color: var(--ilife-ink-3, var(--fg3, #86868b));
}
.ilife-block-list-rows-two-line .ilife-block-list-rows-row-done .ilife-block-list-rows-main-line {

/* block-pre-block */
.ilife-block-pre-block {

/* block-detail-section */
.ilife-block-detail-section {
  margin: 16px 0;

}

.ilife-block-detail-section-dev {

  color: #b25000;
  font-size: 11px;
  font-weight: 600;
}
.ilife-block-detail-section-type {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--blue2);
  font-size: 11px;
  font-weight: 600;
}
.ilife-block-detail-section-cli,
.ilife-block-detail-section-prompt {

}
/* block-disclosure */
.ilife-block-disclosure {
  margin: 12px 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
}
.ilife-block-disclosure-summary {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}
.ilife-block-disclosure-summary::-webkit-details-marker {
  display: none;
}
.ilife-block-disclosure-summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 8px;
  color: var(--fg3);
  transition: transform .15s ease;
}
.ilife-block-disclosure[open] > .ilife-block-disclosure-summary::before {
  transform: rotate(90deg);
}
@media (prefers-reduced-motion: reduce) {
  .ilife-block-disclosure-summary::before {
    transition: none;
  }
}
.ilife-block-disclosure-body {
  padding: 0 14px 14px;
}
/* block-param-form */
.ilife-block-param-form {
  margin: 12px 0;
}
.ilife-block-param-form-description {
  margin: 0 0 8px;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-block-param-form-field {
  display: block;
  margin: 8px 0;
}
.ilife-block-param-form-label {
  display: block;
  margin-bottom: 4px;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-block-param-form-required {
  color: #c0392b;
  font-weight: 600;
}
.ilife-block-param-form-input {
  box-sizing: border-box;
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;

  color: var(--fg);

  font-size: 13px;
}
.ilife-block-param-form-input::placeholder {

.ilife-block-param-form-input:focus {

.ilife-block-param-form-preview {

.ilife-block-param-form-grid {

.ilife-block-param-form-grid .ilife-block-param-form-fields {

.ilife-block-param-form-grid .ilife-block-param-form-fields > * {

.ilife-block-param-form-control .ilife-block-param-form-input {

.ilife-block-param-form-unit {

.ilife-block-param-form-help {

.ilife-block-param-form-error {

}
/* block-empty-block */
.ilife-block-empty-block {
  margin: 16px 0;
}
.ilife-block-empty-block-title {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
}
/* block-copy-block */
.ilife-block-copy-block {
  margin: 16px 0;
}
.ilife-block-copy-block-title {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
}
/* block-feedback-block */
.ilife-block-feedback-block {
  margin: 16px 0;
}
.ilife-block-feedback-block-title {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
}
.ilife-block-feedback-block-note {
  display: flex;
  align-items: flex-start;

.ilife-block-feedback-block-note-icon-text {

.ilife-block-feedback-block-note-icon-warn {

.ilife-block-feedback-block-note-icon-danger {

.ilife-block-feedback-block-note-icon-info {

.ilife-block-feedback-block-note-icon-copy {

.ilife-block-feedback-block-note-title {

.ilife-block-feedback-block-note-detail {

}
.ilife-block-feedback-block-note-lines {

}
.ilife-block-feedback-block-note-code {

.ilife-sheet-head { text-align: center; padding: 2px 0 0; }
.ilife-sheet-eyebrow { font-size: 11.5px; letter-spacing: 2px; color: var(--fg3); font-weight: 700; }
.ilife-sheet-title { margin: 8px 0 0; font-size: 19px; line-height: 1.4; font-weight: 800; }
.ilife-sheet-title .hl { color: #a83228; }
/* sheet-frame（纸面页框）：一整页的纸张层。素纸＝中性卡片纸，小票纸＝暖白＋纸边＋撕口＋裁切线。 */
.ilife-page-ui .ilife-block-sheet {
  position: relative;
  box-sizing: border-box;
  font-family: var(--ilife-font, "SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif);
  background: var(--ilife-surface, var(--card, #ffffff));
  border: 1px solid var(--ilife-line, var(--line, #d2d2d7));
  border-radius: 14px;
  box-shadow: var(--ilife-shadow, var(--shadow, 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06)));
  padding: 18px 20px 16px;
}
/* 小票纸：暖一档的纸面 ＋ 纸边 ＋ 更方的角（单据不是卡片）。色全走 token ⇒ 换皮时它自己跟着换。 */
.ilife-page-ui .ilife-block-sheet.is-receipt {
  background: var(--ilife-surface-2, var(--soft, #f5f8ff));
  border-color: var(--ilife-edge, var(--line, #d2d2d7));
  border-radius: 6px;
}
.ilife-page-ui .ilife-block-sheet-body {
  min-width: 0;
}
/* 撕口：圆心落在纸边线上的两枚半圆，用**桌面色**（`ground`）挖出来 ⇒ 换页面底色它自己跟着走。 */
.ilife-page-ui .ilife-block-sheet-notch {
  position: absolute;
  top: 34px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--ilife-ground, var(--bg, #f5f5f7));
  box-shadow: inset 0 0 0 1px var(--ilife-edge, var(--line, #d2d2d7));
}
.ilife-page-ui .ilife-block-sheet-notch.is-left { left: -9px; }
.ilife-page-ui .ilife-block-sheet-notch.is-right { right: -9px; }
/* 裁切线：纸面宽度上的一条虚线，两端各一枚小孔（提示"沿这里撕"）。 */
.ilife-page-ui .ilife-block-sheet-cut {
  position: relative;
  margin: 14px -20px 0;
  border-top: 1px dashed var(--ilife-edge, var(--line, #d2d2d7));
}
.ilife-page-ui .ilife-block-sheet-cut::before,
.ilife-page-ui .ilife-block-sheet-cut::after {
  content: "";
  position: absolute;
  top: -5px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--ilife-ground, var(--bg, #f5f5f7));
}
.ilife-page-ui .ilife-block-sheet-cut::before { left: 8px; }
.ilife-page-ui .ilife-block-sheet-cut::after { right: 8px; }
/* summary-head（主数字头）：eyebrow ＋ 主数字（＋单位）＋ 分母 ＋ 脚行（人话 ＋ 印章）。 */
.ilife-page-ui .ilife-block-summary-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  container: ilife-summary-head / inline-size;
}
/* eyebrow 与"账目/明细"两件的标题同一套字距语汇（同一族里只有一种小标题写法）。 */
.ilife-page-ui .ilife-block-summary-head-eyebrow {
  color: var(--fg3);
  font-size: 12px;
  letter-spacing: .22em;
}
.ilife-page-ui .ilife-block-summary-head-line {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px;
}
.ilife-page-ui .ilife-block-summary-head-value {
  color: var(--fg);
  font-weight: 800;
  font-family: var(--ilife-font-num, inherit);
  line-height: 1;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-summary-head-value small {
  margin-left: 4px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--fg2);
}
.ilife-page-ui .ilife-block-summary-head-denom {
  color: var(--fg2);
  font-family: var(--ilife-font-num, inherit);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-summary-head-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
}
.ilife-page-ui .ilife-block-summary-head-note {
  color: var(--fg2);
  font-size: 12.5px;
}
/* 印章：描边 ＋ 微斜（不填色——填色是"态徽标"的语汇，两者不许撞形）。 */
.ilife-page-ui .ilife-block-summary-head-stamp {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--fg2);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
  transform: rotate(-1.2deg);
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-summary-head-stamp.is-ok {
  border-color: color-mix(in srgb, var(--ilife-ok, var(--ok, #34c759)) 55%, transparent);
  color: var(--ilife-ok, var(--ok, #34c759));
}
.ilife-page-ui .ilife-block-summary-head-stamp.is-warn {
  border-color: color-mix(in srgb, var(--ilife-warn, #a25b00) 50%, transparent);
  color: var(--ilife-warn, #a25b00);
}
.ilife-page-ui .ilife-block-summary-head-stamp.is-danger {
  border-color: color-mix(in srgb, var(--ilife-danger, #a83228) 50%, transparent);
  color: var(--ilife-danger, #a83228);
}
.ilife-page-ui .ilife-block-summary-head-stamp {
  border-color: var(--ilife-accent, var(--blue, #007aff));
  color: var(--ilife-accent, var(--blue, #007aff));
}
.ilife-page-ui .ilife-block-summary-head.is-m .ilife-block-summary-head-value { font-size: 46px; }
.ilife-page-ui .ilife-block-summary-head.is-l .ilife-block-summary-head-value { font-size: 56px; }
.ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-value { font-size: 92px; }
/* xl 的主数字不跟单位在同一行等宽：单位与分母同档放大（原型：`/ 1850 卡` 是 26px）。 */
.ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-value small { font-size: 26px; }
.ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-denom { font-size: 26px; }
/* 衬线档：字重回到 400（衬线体加粗会糊），字距再收紧一档。 */
.ilife-page-ui .ilife-block-summary-head.is-serif .ilife-block-summary-head-value {
  font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  font-weight: 400;
  letter-spacing: -.045em;
}
@container ilife-summary-head (max-width: 640px) {
  .ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-value { font-size: 64px; }
  .ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-value small,
  .ilife-page-ui .ilife-block-summary-head.is-xl .ilife-block-summary-head-denom { font-size: 20px; }
}
/* scale-bar（刻度条）：条形码（N 格可数）／细线（一条轨）两形态，同一份值域。 */
.ilife-page-ui .ilife-block-scale-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.ilife-page-ui .ilife-block-scale-bar-track {
  display: flex;
  gap: 3px;
  width: 100%;
  min-width: 0;
}
.ilife-page-ui .ilife-block-scale-bar.is-cells .ilife-block-scale-bar-cell {
  flex: 1 1 0;
  min-width: 0;
  height: 22px;
  border-radius: 1px;
  background: var(--line);
}
.ilife-page-ui .ilife-block-scale-bar.is-cells .ilife-block-scale-bar-cell.is-on {
  background: var(--ilife-accent, var(--blue, #007aff));
}
/* 细线档：轨高 6px，填充只用主色；轨底用 --line（与条形码的"空格"同色 ⇒ 两形态的空/满语义一致）。 */
.ilife-page-ui .ilife-block-scale-bar.is-line .ilife-block-scale-bar-track {
  gap: 0;
  height: 6px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--line);
}
.ilife-page-ui .ilife-block-scale-bar.is-line .ilife-block-scale-bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
/* 超目标：只换色（走语义档 `danger`——契约里它就是"危险／逾期"），形状不变。 */
.ilife-page-ui .ilife-block-scale-bar.is-over .ilife-block-scale-bar-cell.is-on,
.ilife-page-ui .ilife-block-scale-bar.is-over .ilife-block-scale-bar-fill {
  background: var(--ilife-danger, #a83228);
}
.ilife-page-ui .ilife-block-scale-bar-cap {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 12px;
  color: var(--fg2);
  font-family: var(--ilife-font-num, inherit);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-scale-bar-cap-right {
  font-weight: 600;
}
/* 条形码总格数写在产出器里（24 格缺省）；样式不猜格数。 */
/* ledger-rows（账目行）：标签 →（点线）→ 值；值列右对齐、等宽数字。 */
.ilife-page-ui .ilife-block-ledger-rows {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.ilife-page-ui .ilife-block-ledger-rows-heading {
  margin-bottom: 2px;
  color: var(--fg3);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .22em;
}
.ilife-page-ui .ilife-block-ledger-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  min-width: 0;
  font-size: 13.5px;
}
/* 相邻行之间一条 hairline；首行不带（小标题已经把它和上文分开了）。 */
.ilife-page-ui .ilife-block-ledger-row + .ilife-block-ledger-row {
  border-top: 1px solid var(--line);
}
.ilife-page-ui .ilife-block-ledger-row-label {
  flex: 0 1 auto;
  color: var(--fg2);
  overflow-wrap: anywhere;
}
.ilife-page-ui .ilife-block-ledger-row-leader {
  flex: 1 1 auto;
  min-width: 12px;
  align-self: flex-end;
  margin-bottom: 4px;
  border-bottom: 1px dotted var(--line);
}
.ilife-page-ui .ilife-block-ledger-row-value {
  flex: 0 0 auto;
  color: var(--fg);
  font-weight: 700;
  font-family: var(--ilife-font-num, inherit);
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.ilife-page-ui .ilife-block-ledger-row-value small {
  margin-left: 3px;
  color: var(--fg2);
  font-size: 11.5px;
  font-weight: 600;
}
/* 合计行：上面一条实线（比 hairline 重一档）、字加粗——"这一行是加出来的"。 */
.ilife-page-ui .ilife-block-ledger-row.is-total {
  margin-top: 2px;
  border-top: 1px solid var(--fg);
  font-weight: 800;
}
.ilife-page-ui .ilife-block-ledger-row.is-total .ilife-block-ledger-row-label {
  color: var(--fg);
  font-weight: 700;
}
/* entry-rows（明细行）：时间 ・ 类别 ・ 名称 ・ 数量 ………… 值；备注另起一行。 */
.ilife-page-ui .ilife-block-entry-rows {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.ilife-page-ui .ilife-block-entry-rows-heading {
  margin-bottom: 2px;
  color: var(--fg3);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .22em;
}
.ilife-page-ui .ilife-block-entry-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  padding: 7px 0;
  min-width: 0;
  font-size: 13.5px;
}
/* 记录之间用点线（账目行用的是 hairline）：同页两族同时出现时读得出"这是两种东西"。 */
.ilife-page-ui .ilife-block-entry-row + .ilife-block-entry-row {
  border-top: 1px dashed var(--line);
}
.ilife-page-ui .ilife-block-entry-row-time {
  flex: 0 0 auto;
  min-width: 42px;
  color: var(--fg3);
  font-family: var(--ilife-font-num, inherit);
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-entry-row-badge {
  flex: 0 0 auto;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--soft);
  color: var(--fg2);
  font-size: 11px;
  font-weight: 700;
}
.ilife-page-ui .ilife-block-entry-row-name {
  flex: 0 1 auto;
  color: var(--fg);
  font-weight: 700;
  overflow-wrap: anywhere;
}
.ilife-page-ui .ilife-block-entry-row-measure {
  flex: 0 0 auto;
  color: var(--fg3);
  font-size: 12px;
  font-family: var(--ilife-font-num, inherit);
}
.ilife-page-ui .ilife-block-entry-row-leader {
  flex: 1 1 auto;
  min-width: 12px;
  align-self: flex-end;
  margin-bottom: 4px;
  border-bottom: 1px dotted var(--line);
}
.ilife-page-ui .ilife-block-entry-row-value {
  flex: 0 0 auto;
  color: var(--fg);
  font-weight: 800;
  font-family: var(--ilife-font-num, inherit);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.ilife-page-ui .ilife-block-entry-row-value small {
  margin-left: 3px;
  color: var(--fg2);
  font-size: 11px;
  font-weight: 600;
}
.ilife-page-ui .ilife-block-entry-row-note {
  flex: 1 1 100%;
  padding-left: 50px;
  color: var(--fg3);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
/* 行下读数：一排小字，**逐项一个 span、靠列距分开**（不写任何分隔符字符）。 */
.ilife-page-ui .ilife-block-entry-row-facts {
  display: flex;
  flex: 1 1 100%;
  flex-wrap: wrap;
  gap: 3px 12px;
  padding-left: 50px;
  color: var(--fg3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.ilife-page-ui .ilife-block-entry-rows-absent {
  margin-top: 6px;
  color: var(--fg3);
  font-size: 12.5px;
}
/* punch-strip（打孔格带）：一格一天，虚线"打孔"盒；有数格填主色软底＋主色字、选中套主色圈。 */
.ilife-page-ui .ilife-block-punch-strip {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
/* 小标题与"账目/明细"两件的标题同一套字距语汇（同一族里只有一种小标题写法）。 */
.ilife-page-ui .ilife-block-punch-strip-heading {
  margin-bottom: 2px;
  color: var(--fg3);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .22em;
}
.ilife-page-ui .ilife-block-punch-strip-cells {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  min-width: 0;
}
.ilife-page-ui .ilife-block-punch-strip-cell {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ilife-page-ui .ilife-block-punch-strip-date {
  font-family: var(--ilife-font-num, inherit);
  font-size: 10px;
  letter-spacing: -.02em;
  color: var(--fg3);
  text-align: center;
  white-space: nowrap;
}
.ilife-page-ui .ilife-block-punch-strip-box {
  box-sizing: border-box;
  height: 34px;
  border: 1px dashed var(--ilife-line, var(--line, #d2d2d7));
  border-radius: 3px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  font-family: var(--ilife-font-num, inherit);
  font-size: 10.5px;
  color: var(--fg3);
  overflow: hidden;
}
/* 有数：底改主色软底、字取强调色的文本档、描边取主色（**面上有读数 ⇒ 走"有文字的选中面"那一档**；
   实心 accent 那一档只许放图形／勾／大写大字）。描边改实色、不删边框 ⇒ 与空心盒等高等宽、不跳版。 */
.ilife-page-ui .ilife-block-punch-strip-cell.is-on .ilife-block-punch-strip-box {
  background: var(--ilife-accent-soft, var(--soft, #f5f8ff));
  border-color: var(--ilife-accent, var(--blue, #007aff));
  border-style: solid;
  color: var(--ilife-accent-text, var(--blue2, #0a63ce));
  font-weight: 700;
}
/* 选中：一格主色描边（一页至多一格；只描边、不改字色 ⇒ 不写成反白）。 */
.ilife-page-ui .ilife-block-punch-strip-cell.is-selected .ilife-block-punch-strip-box {
  outline: 1.5px solid var(--ilife-accent, var(--blue, #007aff));
  outline-offset: 1px;
}
/* skin：4 套语言的取值表（组件只读 token 名，值住这里）。 */
/* 小票纸：暖白纸、纸边、方角、零阴影、等宽数字 */
.ilife-skin-paper {
  --ilife-ground: #f1ece1;
  --ilife-surface: #fffdf7;
  --ilife-surface-2: #f6f1e6;
  --ilife-line: #e7e1d3;
  --ilife-edge: #e7e1d3;
  --ilife-ink: #23201a;
  --ilife-ink-2: #5b5347;
  --ilife-ink-3: #6b6154;
  --ilife-accent: #b5392a;
  --ilife-accent-text: #a3311f;
  --ilife-accent-ink: #fffdf7;
  --ilife-accent-soft: #f7dfd8;
  --ilife-ok: #2d764b;
  --ilife-ok-soft: #e8f2ea;
  --ilife-warn: #7b5010;
  --ilife-warn-soft: #fbf1dc;
  --ilife-danger: #8d2118;
  --ilife-danger-soft: #f9e8e4;
  --ilife-radius: 6px;
  --ilife-radius-sm: 4px;
  --ilife-radius-pill: 4px;
  --ilife-shadow: none;
  --ilife-shadow-pop: 0 8px 24px rgba(70,58,40,.18);
  --ilife-font: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --ilife-font-num: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ilife-font-display: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --ilife-fs-body: 15px;
  --ilife-fs-sm: 13px;
  --ilife-fs-xs: 12px;
  --ilife-fs-h1: 28px;
  --ilife-fs-h2: 18px;
  --ilife-fs-h3: 15px;
  --ilife-space: 16px;
  --ilife-pad-x: 20px;
  /* 旧 token 名映射（作用域内）：让既有件与老页面跟着这套语言走，避免"部分换皮"。 */
  --fg: var(--ilife-ink);
  --fg2: var(--ilife-ink-2);
  --fg3: var(--ilife-ink-3);
  --bg: var(--ilife-ground);
  --card: var(--ilife-surface);
  --line: var(--ilife-line);
  --blue: var(--ilife-accent);
  --blue2: var(--ilife-accent-text);
  --soft: var(--ilife-surface-2);
  --ok: var(--ilife-ok);
  --shadow: var(--ilife-shadow);
}
/* 大字报刊：直角、零阴影、衬线读数、墨黑强调 */
.ilife-skin-broadsheet {
  --ilife-ground: #faf8f4;
  --ilife-surface: #ffffff;
  --ilife-surface-2: #f4f1ea;
  --ilife-line: #ded8cc;
  --ilife-edge: #ded8cc;
  --ilife-ink: #14110d;
  --ilife-ink-2: #4c4741;
  --ilife-ink-3: #6b6559;
  --ilife-accent: #14110d;
  --ilife-accent-text: #14110d;
  --ilife-accent-ink: #ffffff;
  --ilife-accent-soft: #e8e3d8;
  --ilife-ok: #1b693b;
  --ilife-ok-soft: #e6f2ea;
  --ilife-warn: #946113;
  --ilife-warn-soft: #fbf1dc;
  --ilife-danger: #8c281f;
  --ilife-danger-soft: #f9e8e4;
  --ilife-radius: 0;
  --ilife-radius-sm: 0;
  --ilife-radius-pill: 0;
  --ilife-shadow: none;
  --ilife-shadow-pop: 0 10px 30px rgba(20,17,13,.16);
  --ilife-font: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ilife-font-num: "Songti SC",Georgia,"Times New Roman",serif;
  --ilife-font-display: "Songti SC",Georgia,"Times New Roman",serif;
  --ilife-fs-body: 16px;
  --ilife-fs-sm: 14px;
  --ilife-fs-xs: 12.5px;
  --ilife-fs-h1: 34px;
  --ilife-fs-h2: 21px;
  --ilife-fs-h3: 17px;
  --ilife-space: 18px;
  --ilife-pad-x: 22px;
  /* 旧 token 名映射（作用域内）：让既有件与老页面跟着这套语言走，避免"部分换皮"。 */
  --fg: var(--ilife-ink);
  --fg2: var(--ilife-ink-2);
  --fg3: var(--ilife-ink-3);
  --bg: var(--ilife-ground);
  --card: var(--ilife-surface);
  --line: var(--ilife-line);
  --blue: var(--ilife-accent);
  --blue2: var(--ilife-accent-text);
  --soft: var(--ilife-surface-2);
  --ok: var(--ilife-ok);
  --shadow: var(--ilife-shadow);
}
/* 中性（重调）：浅灰白卡、14px 圆角；弱文字压到对比地板、软底去蓝、线更像线 */
.ilife-skin-neutral {
  --ilife-ground: #f5f5f7;

/* #525 页面级移动端配方 · 只对根类 .ilife-page-ui 的页面生效 */
/* ① 图片与矢量图兜底：任何一张图都不许撑破容器（结果型页面的第一类溢出源）。 */
.ilife-page-ui img,
.ilife-page-ui svg {
  max-width: 100%;
}
.ilife-page-ui img {
  height: auto;
}
/* ② 复制区债之一（**置灰规则的定义地已上移到 `style.ts` 的 `copyButton` 区**——
   它对所有页面都成立，不属「移动端配方」，故本件不再重述第二条：同一件事只留一个定义地）。
   本件只在窄屏把命中高度补齐；宽度档的 44px 由 `ACTION_BAR_DEFAULTS.minHeightPx` 统一给。 */
/* ③ 页内定位：带 id 的区块被锚点跳转命中时，标题与视口顶留 20px（不贴着边缘）。 */
.ilife-page-ui .ilife-block-page-shell-body > *[id] {
  scroll-margin-top: 20px;
}
/* ④ 表格：列数极多的表仍可横滑时的兜底（细滚动条＋触屏惯性）。 */
.ilife-page-ui .ilife-block-data-table {
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
/* ⑤ 触摸区：**全宽档**所有页内可点元素命中区 ≥44×44px。
   #525 收口：这一条原来只在 ≤820 那条媒体查询里，实测 1440 档样板页的页内导航（`a`）
   只有 27px 高 —— 44px 是**全宽档**口径（与 `.ilife-copy-btn` 同值），故移出媒体查询。
   只加 `min-height` 与最小内距，不动任何既有选择器的语义。 */
.ilife-page-ui .ilife-copy-btn,
.ilife-page-ui .ilife-copy-menu-item,
.ilife-page-ui .ilife-action-btn,
.ilife-page-ui .ilife-block-disclosure-summary,
.ilife-page-ui .ilife-block-param-form-input,
.ilife-page-ui .ilife-block-toc a {
  min-height: 44px;
}
/* 页内导航按胶囊排（inline 元素上 min-height 不生效，须转 inline-flex）。 */
.ilife-page-ui .ilife-block-toc a {
  display: inline-flex;
  align-items: center;
  padding-top: 0;
  padding-bottom: 0;
}
/* ⑥ 窄屏（≤640）：安全区留白、字号节奏、读数卡栅格、页内导航横滑、表格卡片化。 */
@media (max-width: 640px) {
  /* 安全区：手机横放与「小白条」机型上正文不许贴边；页脚留 60px 与 HELP 640 档逐值同。 */
  .ilife-page-ui .ilife-block-page-shell {
    padding: 20px max(16px, env(safe-area-inset-right, 0px))
      calc(60px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  /* 字号下限：正文类文本一档不落（表格单元格／口径行／列表行／事实条标签 ≥12px）。 */
  .ilife-page-ui .ilife-block-caliber,
  .ilife-page-ui .ilife-block-list-rows-row,
  .ilife-page-ui .ilife-block-kpi-card-detail {
    font-size: 12px;
  }
  /* 读数卡：两格并排（150px 下限在 358px 可用宽里正好两格，不再被 auto-fit 挤成三格）。 */
  .ilife-page-ui .ilife-block-kpi-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .ilife-page-ui .ilife-block-kpi-card {
    padding: 12px;
  }
  /* 页内导航：一条横滑的胶囊轨（换行会把标题挤出首屏；横滑不占纵向高度）。 */
  .ilife-page-ui .ilife-block-toc {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .ilife-page-ui .ilife-block-toc a {
    flex: 0 0 auto;
  }
  /* 表格卡片化：每个数据格带列头文本（`td[data-label]`，由 `renderDataTable` 写入）时，
     窄屏把「一行多列」摊成「一格两行：列头 ＋ 值」，列头不再挤在 390px 里。
     属性缺席时本段全部是空选择器 ⇒ 自动退回 #457 的紧凑表形态，不静默出错。 */
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) .ilife-block-data-table-table,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tbody,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr,
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td {
    display: block;
    width: auto;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) thead {
    display: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr {
    padding: 4px 0;
    border-top: 1px solid rgba(210, 210, 215, .6);
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) tr:first-child {
    border-top: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3px 10px;
    border-bottom: 0;
    text-align: left;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td::before {
    content: attr(data-label);
    flex: 0 0 auto;
    color: var(--fg2);
    font-size: 12px;
    font-weight: 600;
  }
  .ilife-page-ui .ilife-block-data-table:has(td[data-label]) td.ilife-block-data-table-cell-right {
    min-width: 0;
  }
}
/* ⑦ 这一段的断点上共撤过两条规则，都记在这里（本配方撤规则的地方只有此处）。
   ── 撤 1：「≤400 档：读数卡塌单列」（#728 逐页审计）。
   撤因（多席独立量到）：主流手机宽 390 正落在 `max-width: 400` 里 ⇒ ⑥ 那条「两格并排」
   在 390 上**永远不生效**，8 张读数卡一路单列排下去、吃掉整页 40～45% 的高度
   （实测卡块 y313..1164＝852px，是视口 844px 的 1.01 倍），而卡里往往只放「未给」「1 笔」这种两三个字。
   两格并排后同一批卡约占 17%；320 档每格仍有 1fr 兜底、值不裁（`overflow-wrap` 在卡值位已有）。
   撤的是档位不是能力（⑥ 的两格并排就是它的替代）。
   ── 撤 2：「宽档（≥641）两列表：键贴左缘、值贴右缘」（#879，逐变体实测裁决）。
   ① 它只右对齐 `td:last-child`、不碰 `th:last-child` ⇒ 表头贴左、同列的值贴右缘，垂直对位面劈成两半
      （备忘录「首次使用」1280 档实测：表头文字右缘 x=204.45、同列两行的值右缘都是 x=1245，Δ=1040.55px；
      768 档 Δ=528.55px —— 641～1000 也走这条，不只宽屏）。
   ② 它住错了层：表头与数据格本来就带**同一个** `cell-<align>` 档类（`blocks.ts` 的 `renderDataTable`
      一处产出），同列天然对齐；「这一列是数值列」是**数据层的语义决定**，由调用方在列上声明
      `align:"right"` 表达 —— 全仓两列表已有大量这样的声明（`skill-calorie/src/goal/resultDocs.ts`、
      `skill-schedule/src/plan/replaySections.ts`、`skill-chef/src/view/page.ts`、
      `skill-calorie/src/render/sportDocs.ts` 等），它们靠 `cell-right` 自带的 `text-align: right`
      拿到「表头与值一起右对齐」。按列数（恰两列）替调用方做这个决定，只表达「碰巧两列」、
      不表达「这一列是数值」，是对数据层语义的越权覆盖。
   ③ 这条只作用在真正产出 `pageUiCss()` 的页面上：同一张表在卡路里／账单的在建产物里**根本没有这条规则**
      （实测 `docs/skills/skill-calorie/scene02-验收墙` 87 页、`docs/skills/skill-bill` 全量各命中 0 次；
      备忘录 34 页各命中 10 次）⇒ 两列表在同一个产品里长成两种样子。#728 收口那句「UI 上没问题了」
      正是在这条不生效的那批页面上给的 ⇒ 撤掉是**向多数对齐**，不是新设计。
   撤后行为回归数据层：数值列一条不动，两列表里的文本值不再被推到卡片右缘（该页实测 Δmax 1040.55 → 0，
   行内缝隙 989 → 67px）。
   ── 判别器与窄档（#728 逐页审计实测）：它同时管着下面 ≤640 那一段 —— 改前这类表在 ≤640 走 ⑥ 的卡片化，
   每一格都 `td::before{content:attr(data-label)}` ⇒ 8 行的表在 390 档渲染成 **16 条列头线**
   （`哪一项 … 记录编号` / `记成什么 … 116`），表体 491px 里约 224px 是纯重复；
   同一张表在 1280 档只印一遍列头。判别器＝`thead tr > th:nth-child(2):last-child`
   （第二枚表头就是最后一枚 ⇒ 恰两列）。三列及以上的表（候选表、多列明细）一行不动。 */
@media (max-width: 640px) {
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) thead {
    display: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) table,
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tbody {
    display: block;
    width: auto;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tr {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(210, 210, 215, .6);
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) tr:first-child {
    border-top: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td {
    display: block;
    width: auto;
    padding: 0;
    border-bottom: 0;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td::before {
    content: none;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td:first-child {
    padding-left: 10px;
    color: var(--fg2);
    font-weight: 600;
  }
  .ilife-page-ui .ilife-block-data-table:has(thead tr > th:nth-child(2):last-child) td:last-child {
    text-align: right;
    overflow-wrap: anywhere;
    padding-right: 10px;
  }
}
/* #950 C1 正文列宽档：`centered`（`centered` 缺省＝改前行为；`wide` 1120／`full` 满铺／
   `locked` 满铺白名单失效——后两档分别替掉页面侧改宽度与锁单列的垫片）。 */
/* ⑧ 宽屏把可用宽用起来（#525 第二轮；来源＝#525 席位版面档重判里**双方都认的那一条**
   「1280 档没把宽屏用起来」，以及编排者 2026-09-15 的补记：页面模板 960 在 1280 档左右各空 140px）。
   口径＝「宽屏不空荡、正文不散」：页面模板从 `blocks.ts` 的 960（那儿是别票写集，本件不改它）
   放宽到 **1280**，正文收成 **880px 一列**居中，栅格类与真二维数据（读数卡／表／图／键值行／
   列表行）满铺可用宽。为什么用栅格而不是 12 条 `max-width`：正文类块在各票里长得不一样，
   靠「不漏掉某个类名」的清单法必然漏（第一版注入候选就漏了无类名的 `section`），
   栅格是**默认收窄、显式放宽**，漏不掉。
   `box-sizing: border-box` 是本条的前提：本仓没有 `*{box-sizing}` 全局复位（`blocks.ts` 的
   pageShell 区注明「不搬 HELP 那一条」），页面模板是 content-box ⇒ 不写它则 `max-width` 只管内容宽、
   实占 1320（1440 档左右各空 60，不是 80）。 */
@media (min-width: 1001px) {
  .ilife-page-ui .ilife-block-page-shell {
    box-sizing: border-box;
    max-width: 1280px;
  }
  .ilife-page-ui .ilife-block-page-shell-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 880px minmax(0, 1fr);
  }
  .ilife-page-ui .ilife-block-page-shell-body > * {
    grid-column: 2;
  }
  /* 宽的走满铺（`:where()` 保零权重，覆盖既有 `auto-fit` 时按「同权重、后出现」取胜） */
  .ilife-page-ui .ilife-block-page-shell-body > :where(
    .ilife-block-kpi-card-grid,
    .ilife-block-data-table,
    .ilife-block-chart-block,
    .ilife-block-detail-section,
    .ilife-block-list-rows
  ) {
    grid-column: 1 / -1;
  }
  /* #950（C2 守卫）：**行内级子件不被拉伸**。上面那条 `> * { grid-column: 2 }` 给每个直接子节点
     整列宽（880），裸的 `span`／`a`／`b` 因此变成一条 880px 的长条——用户截图里那三根「很丑的
     独占一行」正是这么来的（同一份标记窄屏好、宽屏坏）。正确入口是包一层 `renderChipRow`；
     本条把「忘了包」的代价从「塌成表单」降到「各自一行、各自宽度」。 */
  .ilife-page-ui .ilife-block-page-shell-body > :where(
    span, a, b, i, em, strong, code, small
  ) {
    justify-self: start;
  }
  /* #728 收口：页头三级（眉标／标题／副题）跟着正文列走。
     ⑧ 只把**正文**那层收成 880 居中，页头是它的兄弟节点 ⇒ 不写这一条，标题会贴在版心最左、
     正文居中，整页左右不对称（t728 复评实测：标题 x≈26、正文 x≈202）。
     只收宽屏档；窄屏页头与正文同为 16px 内距，本来就对齐。 */
  .ilife-page-ui .ilife-block-page-shell-eyebrow,
  .ilife-page-ui .ilife-block-page-shell-title,
  .ilife-page-ui .ilife-block-page-shell-subtitle {
    max-width: 880px;
    margin-left: auto;
    margin-right: auto;
  }
  /* 读数卡一行四张：960 档的 `auto-fit minmax(150px,1fr)` 只排得出 2 张，一行两张在宽屏上
     就是「右半边空着」。四张同高靠既有 `grid-auto-rows: 1fr`（本件不动它）。
     **#919 加一道守卫**：只有真排得满 4 张时才定 4 列（`:has(> :nth-child(4))`）——1～3 张卡的页
     退回区块层那条 `auto-fit`（卡片自己撑满一行）。不守的代价实测过：两张卡的页在 ≥1001 缩成
     各占 1/4、右半整块空着，比不开配方还难看。 */
  .ilife-page-ui .ilife-block-kpi-card-grid:has(> :nth-child(4)) {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
/* ⑨ 状态字抬到与正文同档（#525 第二轮票面第 3 条：状态类文字在手机档偏小）。

  function feedback(msg, bad, fmt) {
    var cap = MAX_STACK;
    if (window.matchMedia && window.matchMedia("(max-width: " + MOBILE_MAX_PX + "px)").matches) cap = MOBILE_MAX_STACK;
    var host = document.querySelector("." + STACK_CLASS);
    if (!host) {
      host = document.createElement("div");
      host.className = STACK_CLASS;
      document.body.appendChild(host);
    }
    var box = document.createElement("div");
    box.className = bad ? TOAST_CLASS + " " + TOAST_CLASS + "-danger" : TOAST_CLASS;
    box.setAttribute("role", "status");
    box.setAttribute("aria-live", "polite");
    var icon = document.createElement("span");
    icon.className = ICON_CLASS;
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = bad ? ICON_FAIL : ICON_OK;
    var body = document.createElement("div");
    body.className = BODY_CLASS;
    var titleRow = document.createElement("div");
    titleRow.className = TITLE_ROW_CLASS;
    var title = document.createElement("span");
    title.className = TITLE_CLASS;
    title.textContent = bad ? msg : (fmt ? FORMAT_OK_MSG + "（" + fmt + "）" : msg);
    titleRow.appendChild(title);
    if (bad) {
      var chip = document.createElement("span");
      chip.className = CHIP_CLASS + " " + CHIP_DANGER_CLASS;
      chip.textContent = FAIL_BADGE;
      titleRow.appendChild(chip);
    }
    body.appendChild(titleRow);
    var detail = document.createElement("div");
    detail.className = DETAIL_CLASS;
    detail.textContent = bad ? FAIL_DETAIL : OK_DETAIL;
    body.appendChild(detail);
    box.appendChild(icon);
    box.appendChild(body);
    var close = document.createElement("button");
    close.type = "button";
    close.className = CLOSE_CLASS;
    close.textContent = CLOSE_LABEL;
    box.appendChild(close);
    host.appendChild(box);
    while (host.children.length > cap) host.removeChild(host.children[0]);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, TIMEOUT_MS);
  }

  function initHelpShell() {
    var shell = document.querySelector(SHELL_SEL);
    if (!shell) return;
    var cards = allOf(shell, "." + CARD_CLASS);
    if (cards.length === 0) return;
    injectCardCopy(cards);
    initSheetPreview(cards);
    initSearch(shell, cards);
    initBackTop();
  }

  function allOf(root, sel) {
    return Array.prototype.slice.call(root.querySelectorAll(sel));
  }

  function attrSel(name, value) {
    return "[" + name + "=\"" + value + "\"]";
  }

  function hasClass(el, name) {
    return (" " + el.className + " ").indexOf(" " + name + " ") > -1;
  }

  function addClass(el, name) {
    if (hasClass(el, name)) return;
    el.className = el.className ? el.className + " " + name : name;
  }

  function removeClass(el, name) {
    if (!el.className) return;
    var parts = el.className.split(" ");
    var kept = [];
    for (var i = 0; i < parts.length; i++) { if (parts[i] && parts[i] !== name) kept.push(parts[i]); }
    el.className = kept.join(" ");
  }

  /* 卡级复制按钮（#88 R1-1）：卡头注入 1 个按钮——actionId／文案恒读冻结常量，
     文本取同卡 `<pre class="prompt">` 的**原文**（＝该卡 prompt 逐字，与 F3 卡面同源）；
     读不到 <pre> 才回落同卡 Sheet 内 prompt 按钮的 data-t，两者都无才跳过
     （#88 S5／B 段红队 S3-a：真实help模板恒有 <pre>，故 436/436 恒有按钮，不静默丢卡）→ 复用既有委派。 */
  function injectCardCopy(cards) {
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.querySelector("." + CARD_COPY_CLASS)) continue;
      var pre = card.querySelector("." + PROMPT_CLASS);
      var src = pre !== null ? pre : card.querySelector(attrSel(ACTION_ATTR, COPY_ACTION));
      if (src === null) continue;
      var text = pre !== null ? pre.textContent : src.getAttribute(TEXT_ATTR);
      if (text === null) continue;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = CARD_COPY_CLASS;
      btn.textContent = COPY_LABEL;
      btn.setAttribute(ACTION_ATTR, COPY_ACTION);
      btn.setAttribute(TEXT_ATTR, text);
      var head = card.querySelector("." + CARD_TOP_CLASS);
      if (head) head.appendChild(btn); else card.insertBefore(btn, card.firstChild);
    }
  }

  /* Sheet 参数实时预览：静态值换输入框，输入即重组「prompt ＋ 空行 ＋ label: value 行」。 */
  function initSheetPreview(cards) {
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var pre = card.querySelector("." + PROMPT_CLASS);
      if (!pre) continue;
      if (pre.getAttribute(PROMPT_ATTR) === null) pre.setAttribute(PROMPT_ATTR, pre.textContent);
      var fields = allOf(card, "." + FIELD_CLASS);
      for (var j = 0; j < fields.length; j++) bindField(card, fields[j]);
    }
  }

  function bindField(card, field) {
    if (field.querySelector("." + FIELD_INPUT_CLASS)) return;
    var value = field.querySelector("." + FIELD_VALUE_CLASS);
    var input = document.createElement("input");
    input.type = "text";
    input.className = FIELD_INPUT_CLASS;
    input.value = value ? value.textContent : "";
    input.setAttribute("value", input.value);
    var hint = field.querySelector("." + FIELD_HINT_CLASS);
    if (hint) input.setAttribute("placeholder", hint.textContent);
    input.addEventListener("input", function () { refreshPreview(card); });
    if (value && value.parentNode === field) field.replaceChild(input, value);
    else field.appendChild(input);
  }

  function refreshPreview(card) {
    var pre = card.querySelector("." + PROMPT_CLASS);
    if (!pre) return;
    var base = pre.getAttribute(PROMPT_ATTR);
    if (base === null) return;
    var lines = fieldLines(card);
    var text = lines.length > 0 ? base + LF2 + lines.join(LF) : base;
    pre.textContent = text;
    syncCopyText(card, text, lines);
    if (searchTerm !== "") markCard(card, searchTerm);
  }

  function fieldLines(card) {
    var fields = allOf(card, "." + FIELD_CLASS);
    var lines = [];
    for (var i = 0; i < fields.length; i++) {
      var input = fields[i].querySelector("." + FIELD_INPUT_CLASS);
      var labelEl = fields[i].querySelector("." + FIELD_LABEL_CLASS);
      var label = labelEl ? labelEl.textContent : "";
      var raw = input ? input.value : "";
      var val = raw.replace(/^\s+|\s+$/g, "");
      if (val !== "") lines.push(label + ": " + val);
    }
    return lines;
  }

  /* 复制按钮文本同步：prompt 目标（卡头 ＋ Sheet 内）＝ 预览文本；params 目标＝label: value 行，
     无字段时回落该卡 CLI 文本（与冻结help模板 paramsText 同口径）。 */
  function syncCopyText(card, text, lines) {
    var buttons = allOf(card, "[" + ACTION_ATTR + "]");
    for (var i = 0; i < buttons.length; i++) {
      var id = buttons[i].getAttribute(ACTION_ATTR);
      if (id === COPY_ACTION) buttons[i].setAttribute(TEXT_ATTR, text);
      else if (id === PARAMS_ACTION) buttons[i].setAttribute(TEXT_ATTR, lines.length > 0 ? lines.join(LF) : cliTextOf(card));
    }
  }

  function cliTextOf(card) {
    var cli = card.querySelector("." + CLI_CLASS);
    return cli ? cli.textContent : "";
  }

  /* 搜索：过滤 ＋ mark 标签高亮 ＋ 自动展开 ＋ 命中计数 ＋ 清空 ＋ 跳页。 */
  function initSearch(shell, cards) {
    var tabBar = shell.querySelector("." + TAB_BAR_CLASS);
    if (!tabBar || !tabBar.parentNode) return;
    if (shell.querySelector("." + SEARCH_BOX_CLASS)) return;
    var box = document.createElement("div");
    box.className = SEARCH_BOX_CLASS;
    var input = document.createElement("input");
    input.type = "search";
    input.className = SEARCH_INPUT_CLASS;
    input.setAttribute("placeholder", SEARCH_PLACEHOLDER);
    input.setAttribute("aria-label", SEARCH_ARIA);
    input.setAttribute("autocomplete", "off");
    var clear = document.createElement("button");
    clear.type = "button";
    clear.className = SEARCH_CLEAR_CLASS;
    clear.textContent = CLEAR_LABEL;
    clear.setAttribute("aria-label", CLEAR_ARIA);
    var count = document.createElement("span");
    count.className = HITCOUNT_CLASS;
    count.setAttribute("role", "status");
    box.appendChild(input);
    box.appendChild(clear);
    box.appendChild(count);
    tabBar.parentNode.insertBefore(box, tabBar.nextSibling);
    var state = { sheets: [], subgroups: [], pages: [], index: 0 };
    input.addEventListener("input", function () { runSearch(shell, cards, input, count, state); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      if (state.pages.length === 0) return;
      state.index = (state.index + 1) % state.pages.length;
      jumpTo(state.pages[state.index]);
    });
    clear.addEventListener("click", function () {
      input.value = "";
      runSearch(shell, cards, input, count, state);
      input.focus();
    });
  }

  function runSearch(shell, cards, input, count, state) {
    var term = input.value.replace(/^\s+|\s+$/g, "").toLowerCase();
    resetSearch(shell, cards, state);
    searchTerm = term;
    if (term === "") { count.textContent = ""; state.pages = []; state.index = 0; return; }
    var hits = [];
    var i;
    for (i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.textContent.toLowerCase().indexOf(term) < 0) { addClass(card, CARD_HIDDEN_CLASS); continue; }
      hits.push(card);
      markCard(card, term);
      var sheet = card.querySelector("." + SHEET_CLASS);
      if (sheet && !sheet.open) { sheet.open = true; state.sheets.push(sheet); }
    }
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) {
      var inner = allOf(subgroups[i], "." + CARD_CLASS);
      var visible = false;
      for (var j = 0; j < inner.length; j++) { if (hits.indexOf(inner[j]) > -1) { visible = true; break; } }
      if (visible) { if (!subgroups[i].open) { subgroups[i].open = true; state.subgroups.push(subgroups[i]); } }
      else addClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
    }
    var pages = allOf(shell, "." + PAGE_CLASS);
    var hitPages = [];
    for (i = 0; i < pages.length; i++) {
      var pageCards = allOf(pages[i], "." + CARD_CLASS);
      for (var k = 0; k < pageCards.length; k++) { if (hits.indexOf(pageCards[k]) > -1) { hitPages.push(pages[i]); break; } }
    }
    state.pages = hitPages;
    state.index = 0;
    count.textContent = hits.length > 0 ? HIT_PREFIX + hits.length + HIT_SUFFIX : HIT_EMPTY;
    jumpTo(hitPages[0]);
  }

  function resetSearch(shell, cards, state) {
    var i;
    for (i = 0; i < cards.length; i++) {
      removeClass(cards[i], CARD_HIDDEN_CLASS);
      unmarkCard(cards[i]);
    }
    for (i = 0; i < state.sheets.length; i++) state.sheets[i].open = false;
    state.sheets = [];
    for (i = 0; i < state.subgroups.length; i++) state.subgroups[i].open = false;
    state.subgroups = [];
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) removeClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
  }

  function jumpTo(page) {
    if (!page) return;
    var radio = page.querySelector("." + TAB_INPUT_CLASS);
    if (radio && radio.checked !== true) radio.checked = true;
  }

  function markCard(card, term) {
    unmarkCard(card);
    var nodes = [];
    collectText(card, nodes);
    for (var i = 0; i < nodes.length; i++) wrapTerm(nodes[i], term);
  }

  function unmarkCard(card) {
    var marks = allOf(card, "." + CARD_MARK_CLASS);
    for (var i = 0; i < marks.length; i++) {
      var parent = marks[i].parentNode;
      if (!parent) continue;
      parent.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
      if (typeof parent.normalize === "function") parent.normalize();
    }
  }

  function collectText(root, out) {
    var kids = root.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var node = kids[i];
      if (node.nodeType === 3) { if (node.nodeValue) out.push(node); continue; }
      if (node.nodeType !== 1) continue;
      if (hasClass(node, CARD_MARK_CLASS)) continue;
      var tag = node.tagName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "INPUT") continue;
      collectText(node, out);
    }
  }

  function wrapTerm(node, term) {
    var rest = node.nodeValue;
    var at = rest.toLowerCase().indexOf(term);
    if (at < 0) return;
    var frag = document.createDocumentFragment();
    while (at > -1) {
      if (at > 0) frag.appendChild(document.createTextNode(rest.slice(0, at)));
      var mark = document.createElement("mark");
      mark.className = CARD_MARK_CLASS;
      mark.textContent = rest.slice(at, at + term.length);
      frag.appendChild(mark);
      rest = rest.slice(at + term.length);
      at = rest.toLowerCase().indexOf(term);
    }
    if (rest !== "") frag.appendChild(document.createTextNode(rest));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }

  /* 回到顶部（H-19）：scrollTop > BACKTOP_MIN_Y 才加 -show；点击平滑回顶。 */
  function initBackTop() {
    if (document.querySelector("." + BACKTOP_CLASS)) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = BACKTOP_ID;
    btn.className = BACKTOP_CLASS;
    btn.textContent = BACKTOP_LABEL;
    btn.setAttribute("aria-label", BACKTOP_ARIA);
    btn.setAttribute("title", BACKTOP_ARIA);
    btn.addEventListener("click", function () {
      var root = scrollRoot();
      if (!root) return;
      if (typeof root.scrollTo === "function") {
        try { root.scrollTo({ top: 0, behavior: "smooth" }); return; } catch (err) { root.scrollTop = 0; return; }
      }
      root.scrollTop = 0;
    });
    document.body.appendChild(btn);
    document.addEventListener("scroll", syncBackTop, true);
    syncBackTop();
  }

  function scrollRoot() {
    return document.scrollingElement || document.documentElement || document.body;
  }

  function syncBackTop() {
    var btn = document.querySelector("." + BACKTOP_CLASS);
    if (!btn) return;
    var root = scrollRoot();
    var y = root ? root.scrollTop : 0;
    if (y > BACKTOP_MIN_Y) addClass(btn, BACKTOP_SHOW_CLASS); else removeClass(btn, BACKTOP_SHOW_CLASS);
  }

  if (document.body) boot();
  else document.addEventListener("DOMContentLoaded", boot);
}());</script>
</body>
