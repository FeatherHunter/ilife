<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡路里·健身计划</title>
<style>/* base-paint 共享样式资产 · ilife-base · v0.1.0 */
:root {
  --fg: #1d1d1f;
  --fg2: #6e6e73;
  --fg3: #86868b;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: #d2d2d7;
  --blue: #007aff;
  --blue2: #0a63ce;
  --soft: #f5f8ff;
  --ok: #34c759;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06);
}
/* toast */
.ilife-toast-stack {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  pointer-events: none;
}
.ilife-toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-sizing: border-box;
  min-width: 300px;
  max-width: 480px;
  padding: 13px 14px 13px 16px;
  border-radius: 14px;
  background: rgba(28, 28, 30, .94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0;
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 255, 255, .08) inset;
  font-size: 12.5px;
  line-height: 1.4;
  font-feature-settings: "tnum";
  pointer-events: auto;
  animation: ilife-toast-in .22s cubic-bezier(.34, 1.56, .64, 1) both;
}
@keyframes ilife-toast-in {
  from {
    opacity: 0;
    transform: scale(.9) translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.ilife-toast-danger {
  box-shadow: 0 10px 32px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(255, 59, 48, .45) inset;
}
.ilife-toast-icon {
  flex: 0 0 auto;
  padding-top: 1px;
  font-size: 20px;
  line-height: 1;
}
.ilife-toast-body {
  flex: 1 1 auto;
  min-width: 0;
}
.ilife-toast-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ilife-toast-title {
  margin-bottom: 2px;
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.4;
}
.ilife-toast-title-detail {
  color: #c8c8cc;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.5;
}
.ilife-toast-chip {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  color: #c8c8cc;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.6;
}
.ilife-toast-chip-ok {
  background: rgba(52, 199, 89, .18);
  color: #4dd96b;
}
.ilife-toast-chip-warn {
  background: rgba(255, 149, 0, .18);
  color: #ffb340;
}
.ilife-toast-chip-danger {
  background: rgba(255, 59, 48, .18);
  color: #ff6961;
}
.ilife-toast-count {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .08);
  color: #c8c8cc;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ilife-toast-detail {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.5;
}
.ilife-toast-lines {
  color: #c8c8cc;
  font-size: 11px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.ilife-toast-code {
  margin: 6px 0 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, .32);
  color: #aeb0b8;
  font-family: "SF Mono", monospace;
  font-size: 10.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  max-height: 140px;
  overflow: auto;
}
.ilife-toast-act {
  margin: 0;
  padding: 2px 4px;
  border: 0;
  background: none;
  color: #4dd96b;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.ilife-toast-act:active {
  opacity: .7;
}
.ilife-toast-close {
  flex-shrink: 0;
  margin: 0 0 0 6px;
  padding: 5px 9px;
  border: 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, .10);
  color: #34c759;
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.ilife-toast-act:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ilife-toast-close:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
@media (max-width: 820px) {
  .ilife-toast-stack {
    left: 12px;
    right: 12px;
    transform: none;
    align-items: stretch;
  }
  .ilife-toast {
    min-width: 0;
    max-width: none;
  }
}
/* action-bar */
.ilife-action-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  margin: 12px 0;
  max-width: 520px;
}
@media (min-width: 821px) {
  .ilife-action-bar {
    max-width: none;
  }
}
.ilife-action-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.ilife-action-row-ghost {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (max-width: 820px) {
  .ilife-action-row-ghost {
    position: relative;
  }
}
.ilife-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.ilife-action-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-action-btn-red {
  background: #ff3b30;
  color: var(--card);
}
.ilife-action-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
@media (max-width: 820px) {
  .ilife-action-btn {
    min-height: 44px;
  }
}
.ilife-action-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* copy-button */
.ilife-copy-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--blue);
  color: var(--card);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), background-color .2s ease;
}
.ilife-copy-btn-primary {
  background: var(--blue);
  color: var(--card);
}
.ilife-copy-btn-ghost {
  border-color: rgba(0, 122, 255, 0.38);
  background: var(--card);
  color: var(--blue2);
}
.ilife-copy-btn-wide {
  width: 100%;
}
.ilife-copy-btn:active {
  transform: scale(.96);
}
.ilife-copy-btn.copied {
  border-color: var(--ok);
  background: var(--ok);
  color: var(--card);
}
.ilife-copy-btn[disabled],
.ilife-copy-btn:disabled {
  opacity: 1;
  border-color: var(--line);
  background: var(--soft);
  color: var(--fg3);
  cursor: not-allowed;
}
.ilife-copy-btn[disabled]:active,
.ilife-copy-btn:disabled:active {
  transform: none;
}
@media (max-width: 820px) {
  .ilife-copy-btn {
    min-height: 44px;
  }
}
.ilife-copy-menu-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn {
  width: 100%;
}
.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  content: "";
  width: 0;
  height: 0;
  margin-left: 6px;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
  transition: transform .16s ease-out;
}
.copy-menu-open.ilife-copy-menu-wrap > .ilife-copy-btn::after {
  transform: rotate(180deg);
}
.ilife-copy-menu {
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  z-index: 20;
  min-width: 200px;
  box-sizing: border-box;
  max-width: calc(100vw - 32px);
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .16s ease-out, visibility .16s ease-out;
}
.copy-menu-open.ilife-copy-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.ilife-copy-menu-item {
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.ilife-copy-menu-item:hover {
  background: var(--soft);
}
.ilife-copy-menu-item > .ilife-copy-menu-label {
  color: var(--fg);
  font-size: 13px;
}
.ilife-copy-menu-item > .ilife-copy-menu-hint {
  color: var(--fg2);
  font-size: 11px;
  white-space: nowrap;
}
@media (max-width: 820px) {
  .ilife-copy-menu-item {
    min-height: 44px;
  }
  .ilife-copy-menu-wrap {
    position: static;
  }
  .ilife-copy-menu {
    left: 0;
    right: 0;
    width: auto;
    min-width: 0;
    max-width: none;
  }
}
.ilife-copy-btn:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
/* status-badge */
.ilife-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.6;
  width: fit-content;
}
.ilife-status-badge-ok {
  background: #e6f7ec;
  color: #1f8c3d;
}
.ilife-status-badge-warn {
  background: #fff5e0;
  color: #a25b00;
}
.ilife-status-badge-danger {
  background: #fff0ee;
  color: #a83228;
}
.ilife-status-badge-empty {
  background: #f0f0f3;
  color: var(--fg2);
}
/* empty-state */
.ilife-empty {
  padding: 48px 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  text-align: center;
  color: var(--fg2);
}
.ilife-empty-icon {
  font-size: 40px;
  line-height: 1.2;
  opacity: .5;
}
.ilife-empty-text {
  margin-top: 8px;
  color: var(--fg);
  font-size: 17px;
  font-weight: 600;
}
.ilife-empty-hint {
  margin-top: 4px;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-empty-action {
  margin-top: 16px;
}
/* error-receipt */
.ilife-error:has(> .ilife-error-title) {
  margin: 12px 0;
  padding: 20px 22px;
  border: 1px solid rgba(255, 59, 48, .28);
  border-radius: 14px;
  background: rgba(255, 59, 48, .06);
  color: var(--fg);
}
.ilife-error-title {
  margin-bottom: 14px;
  color: #a83228;
  font-size: 15px;
  font-weight: 700;
}
.ilife-error-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  row-gap: 14px;
  column-gap: 8px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}
.ilife-error-actions > .ilife-copy-btn-wide {
  grid-column: 1 / -1;
}
@media (max-width: 820px) {
  .ilife-error:has(> .ilife-error-title) {
    padding: 16px 14px;
  }
}
/* charts */
.ilife-charts{position:relative;margin:0;padding:0;box-sizing:border-box;font-family:inherit;color:var(--fg,#1d1d1f);--ilife-charts-dot:9px}
.ilife-charts *{box-sizing:border-box}
.ilife-charts-svg{display:block;width:100%;height:auto;overflow:visible}
.ilife-charts-empty{padding:0}
.ilife-charts-anim .ilife-charts-line{transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-bar{transition:height .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-fillbar{transition:width .5s cubic-bezier(.22,1,.36,1)}
.ilife-charts-anim .ilife-charts-dot{animation:ilife-charts-fade .5s ease both}
@keyframes ilife-charts-fade{from{opacity:0}to{opacity:1}}
.ilife-charts-dot{pointer-events:none}
.ilife-charts-dot-anomaly{filter:drop-shadow(0 0 3px rgba(255,59,48,.18))}
.ilife-charts-markpoint{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.ilife-charts-scatter .ilife-charts-dot{r:calc(var(--ilife-charts-dot) / 2)}
.ilife-charts-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;line-height:1.5;color:var(--fg2,#6e6e73)}
.ilife-charts-legend-right{flex-direction:column;align-items:flex-start}
.ilife-charts-legend-bottom{flex-direction:row;justify-content:center}
.ilife-charts-legend-item{display:inline-flex;align-items:center;gap:6px}
.ilife-charts-legend-swatch{display:inline-block;width:8px;height:8px;border-radius:2px}
.ilife-charts-legend-swatch-dashed{background:repeating-linear-gradient(90deg,var(--fg3,#86868b) 0 4px,transparent 4px 8px)}
.ilife-charts-legend-value{color:var(--fg,#1d1d1f)}
.ilife-charts-legend-pct{color:var(--fg3,#86868b)}
.ilife-charts-pct{display:block;font-size:12px;color:var(--fg2,#6e6e73);text-align:right}
.ilife-charts-progress .ilife-charts-svg{min-height:12px}
.ilife-charts-spark-value{font-size:11px}
.ilife-charts-tick{font-size:9.5px}
.ilife-charts-xlabel{font-size:10px}
.ilife-charts-value{font-size:10px}
.ilife-charts-value-last{font-size:10.5px;font-weight:700}
.ilife-charts-line .ilife-charts-value-last{paint-order:stroke;stroke:var(--bg,#fff);stroke-width:3px;stroke-linejoin:round}
.ilife-charts-marktext{font-size:10px}
.ilife-charts-marktext-v{font-size:10px}
.ilife-charts-mptext{font-size:10.5px;font-weight:700}
.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}
.ilife-charts-bar .ilife-charts-value{font-size:10px}
.ilife-charts-center-label{font-size:8px}
.ilife-charts-center-value{font-size:13px;font-weight:700}
.ilife-charts-gauge-value{font-size:26px;font-weight:800}
.ilife-charts-gauge-label{font-size:11px}
@media (max-width:720px){.ilife-charts{--ilife-charts-dot:8px}.ilife-charts-line .ilife-charts-svg{height:auto}.ilife-charts-bar .ilife-charts-xlabel{font-size:9.5px}.ilife-charts-legend{font-size:11.5px}.ilife-charts-line .ilife-charts-tick{font-size:19.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:19.4px}.ilife-charts-line .ilife-charts-value{font-size:19.4px}.ilife-charts-line .ilife-charts-value-last{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext{font-size:19.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:19.4px}}
@media (min-width:721px) and (max-width:875px){.ilife-charts-line .ilife-charts-tick{font-size:12.4px}.ilife-charts-line .ilife-charts-xlabel{font-size:12.4px}.ilife-charts-line .ilife-charts-value{font-size:12.4px}.ilife-charts-line .ilife-charts-value-last{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext{font-size:12.4px}.ilife-charts-line .ilife-charts-marktext-v{font-size:12.4px}}
@media (min-width:876px){.ilife-charts-line .ilife-charts-tick{font-size:10.8px}.ilife-charts-line .ilife-charts-xlabel{font-size:10.8px}.ilife-charts-line .ilife-charts-value{font-size:10.8px}.ilife-charts-line .ilife-charts-value-last{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext{font-size:10.8px}.ilife-charts-line .ilife-charts-marktext-v{font-size:10.8px}}
/* help-shell */
.ilife-help-shell {
  display: block;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  color: var(--fg);
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-feature-settings: "tnum";
}
.ilife-help-shell-hero {
  margin-bottom: 20px;
}
.ilife-help-shell-eyebrow {
  margin: 0;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ilife-help-shell-title {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.2;
}
.ilife-help-shell-subtitle {
  margin: 6px 0 0;
  color: var(--fg2);
  font-size: 15px;
}
.ilife-help-shell-lead {
  margin: 4px 0 0;
  color: var(--fg3);
  font-size: 13px;
}
.ilife-help-shell-init {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
}
.ilife-help-shell-init-title {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}
.ilife-help-shell-init-subtitle {
  margin: 4px 0 0;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-prompt {
  margin: 8px 0 0;
  padding: 12px;
  border-radius: 8px;
  background: var(--soft);
  color: var(--fg2);
  font-family: "SF Mono", monospace;
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-x: auto;
}
.ilife-help-shell-init-steps {
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--fg2);
  font-size: 13px;
}
.ilife-help-shell-init-step {
  margin: 2px 0;
}
.ilife-help-shell-tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}
.ilife-help-shell-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.ilife-help-shell-tab-icon {
  font-size: 14px;
}
.ilife-help-shell-tab-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.ilife-help-shell-pages {
  display: block;
}
.ilife-help-shell-page {
  display: block;
}
.ilife-help-shell-page-body {
  display: none;
}
.ilife-help-shell-tab-input:checked + .ilife-help-shell-page-body {
  display: block;
}
.ilife-help-shell-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ilife-help-shell-card {
  display: block;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.ilife-help-shell-card-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.ilife-help-shell-card-title {
  margin: 8px 0 0;
  font-size: 17px;
  font-weight: 600;
}
.ilife-help-shell-chip {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--blue2);
  font-size: 11px;
  font-weight: 600;
}
.ilife-help-shell-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--fg2);
  font-size: 11px;
  font-weight: 600;
}
.ilife-help-shell-badge-dev {

.ilife-help-shell-about-label {

.ilife-help-shell-meta-title {

.ilife-help-shell-subgroup-hidden {

  color: var(--fg);

}
.ilife-help-shell-field-input:focus-visible {

    animation: none;

  .ilife-help-shell-btn-backtop {

  .ilife-help-shell-card-copy {

  .ilife-help-shell-card-copy:active {
    transform: none;
  }
}
/* base-paint 区块样式资产 · #104 · 12 区 */
/* block-page-shell */
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.ilife-block-page-shell {
  display: block;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  color: var(--fg);
  font-feature-settings: "tnum";
}
.ilife-block-page-shell-eyebrow {
  margin: 0;
  color: var(--blue2);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ilife-block-page-shell-title {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.4px;
  line-height: 1.2;
}
.ilife-block-page-shell-subtitle {
  margin: 6px 0 0;
  color: var(--fg2);
  font-size: 15px;
}
.ilife-block-page-shell-body {
  display: block;
  margin-top: 16px;
}
.ilife-block-page-shell-body > * + .ilife-block {
  margin-top: 16px;
}
@media (max-width: 640px) {
  .ilife-block-page-shell {
    padding: 20px 16px 60px;
  }
  .ilife-block-page-shell-title {
    font-size: 26px;
  }
}
.ilife-block-toc {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 16px;
}
.ilife-block-toc a {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--blue2);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.ilife-block-toc a:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ilife-block-caliber {
  margin: 0 0 8px;
  color: var(--fg2);
  font-size: 12px;
  line-height: 1.5;
}
.ilife-block-caliber:has(> span) {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: baseline;
}
.ilife-block-caliber > span + span {
  padding-left: 8px;
  border-left: 1px solid rgba(210, 210, 215, .6);
}
.ilife-block-conclusion {
  margin: 0 0 16px;
  padding: 12px 16px;
  border-left: 3px solid var(--blue);
  border-radius: 14px;
  background: var(--card);
  color: var(--blue2);
  font-size: 14px;
  font-weight: 600;
}
.ilife-block-mini-bar {
  display: inline-block;
  overflow: hidden;
  width: 72px;
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  vertical-align: middle;
}
.ilife-block-mini-bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
.ilife-block-dist-row {
  display: grid;
  grid-template-columns: minmax(0, 6em) minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 13px;
}
.ilife-block-dist-row-name {
  color: var(--fg2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ilife-block-dist-row-bar {
  display: block;
  overflow: hidden;
  height: 8px;
  border-radius: 999px;
  background: var(--line);
}
.ilife-block-dist-row-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
.ilife-block-dist-row-val {
  color: var(--fg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.ilife-block-chip {
  display: inline-block;
  margin: 0 6px 6px 0;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--soft);
  color: var(--blue2);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
}
.ilife-block-change-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.ilife-block-change-row-label {
  flex: 1;
  min-width: 0;
  color: var(--fg2);
}
.ilife-block-change-row-old {
  color: var(--fg2);
  text-decoration: line-through;
}
.ilife-block-change-row-arrow {
  flex: 0 0 auto;
  min-width: 1.2em;
  color: var(--fg2);
  text-align: center;
}
.ilife-block-change-row-new {
  color: var(--fg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
@media print {
  .ilife-page-printable {
    page: printable;
    max-width: none;
    padding: 0;
  }
  .ilife-page-printable .ilife-block-toc {
    display: none;
  }
  .ilife-page-printable .ilife-block-copy-block {
    display: none;
  }
  @page printable {
    margin: 12mm;
  }
}
/* block-kpi-card */
.ilife-block-kpi-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  grid-auto-rows: 1fr;
  gap: 12px;
  margin: 16px 0;
}
.ilife-block-kpi-card {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.ilife-block-kpi-card-label {
  color: var(--fg2);
  font-size: 12px;
  font-weight: 600;
}
.ilife-block-kpi-card-value-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
  margin-top: 4px;
}
.ilife-block-kpi-card-value {
  min-width: 0;
  color: var(--fg);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.ilife-block-kpi-card-unit {
  color: var(--fg2);
  font-size: 13px;
}
.ilife-block-kpi-card-detail {
  margin-top: 4px;
  color: var(--fg2);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.ilife-block-kpi-card-badge {
  margin-top: 8px;
}
.ilife-block-kpi-card-title {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
}
@media (max-width: 640px) {
  .ilife-block-page-shell .ilife-block-kpi-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
/* block-data-table */
.ilife-block-data-table {
  margin: 16px 0;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  max-width: 680px;
  margin-inline: auto;
}
.ilife-block-data-table-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.ilife-block-data-table-caption {
  padding: 10px 14px;
  color: var(--fg2);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
}
.ilife-block-data-table th {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background-color: transparent;
  color: var(--fg3);
  font-size: 11.5px;

  text-transform: uppercase;
  letter-spacing: .04em;
  white-space: nowrap;
}
.ilife-block-data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(210, 210, 215, .6);
  color: var(--fg2);
  font-size: 13px;
}
.ilife-block-data-table tr:last-child td {
  border-bottom: none;
}
.ilife-block-data-table-cell-left {
  text-align: left;
}
.ilife-block-data-table-cell-center {
  text-align: center;
}
.ilife-block-data-table-cell-right {
  text-align: right;
}
.ilife-block-data-table td.ilife-block-data-table-cell-right {
  min-width: 5.5em;
  color: var(--fg);
  font-family: "SF Mono", monospace;
  font-variant-numeric: tabular-nums;
}
@media (min-width: 641px) {
  .ilife-block-data-table td.ilife-block-data-table-cell-left:first-child {
    width: 1%;
    white-space: nowrap;
  }
}
@media (max-width: 640px) {
  .ilife-block-data-table-table {
    display: block;
    font-size: 12px;
  }
  .ilife-block-data-table-caption {
    padding: 8px 10px;
    font-size: 12px;
    display: block;
    width: 100%;

  .ilife-block-data-table thead {

  }
  .ilife-block-data-table th {

    letter-spacing: 0;

  }
  .ilife-block-data-table tbody {

  }
  .ilife-block-data-table tr {
    display: block;
    padding: 8px 12px;
    border-top: 1px solid rgba(210, 210, 215, .6);
  }
  .ilife-block-data-table tr:first-child {
    border-top: 0;
  }
  .ilife-block-data-table td {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2px 10px;
    padding: 4px 0;
    border-bottom: 0;
    color: var(--fg);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .ilife-block-data-table td::before {
    content: attr(data-label);
    flex: none;
    color: var(--fg3);
    font-size: 11.5px;
    font-weight: 600;

  .ilife-block-data-table td:not([data-label]) {
    display: block;
  }
  .ilife-block-data-table td[data-label=""] {

  }
  .ilife-block-data-table td:not([data-label])::before {
    content: none;
  }
  .ilife-block-data-table td[data-label=""]::before {
    content: none;
  }
  .ilife-block-data-table-table td.ilife-block-data-table-cell-center,
  .ilife-block-data-table-table td.ilife-block-data-table-cell-right {
    min-width: 0;

  /* ── 产物：一张规范表 ＋ 一段缩进文本（**不用分隔符**，并列靠换行与缩进） ── */

  /* ── 事件：一处委派，零内联处理器 ── */

  /* Sheet 参数实时预览：静态值换输入框，输入即重组「prompt ＋ 空行 ＋ label: value 行」。 */
  function initSheetPreview(cards) {

      var card = cards[i];
      var pre = card.querySelector("." + PROMPT_CLASS);
      if (!pre) continue;
      if (pre.getAttribute(PROMPT_ATTR) === null) pre.setAttribute(PROMPT_ATTR, pre.textContent);
      var fields = allOf(card, "." + FIELD_CLASS);
      for (var j = 0; j < fields.length; j++) bindField(card, fields[j]);

  function bindField(card, field) {
    if (field.querySelector("." + FIELD_INPUT_CLASS)) return;

    input.type = "text";
    input.className = FIELD_INPUT_CLASS;

    if (value && value.parentNode === field) field.replaceChild(input, value);

  function refreshPreview(card) {

    var lines = fieldLines(card);

  function fieldLines(card) {

    for (var i = 0; i < fields.length; i++) {

      var labelEl = fields[i].querySelector("." + FIELD_LABEL_CLASS);
      var label = labelEl ? labelEl.textContent : "";

  function syncCopyText(card, text, lines) {

    for (var i = 0; i < buttons.length; i++) {

      if (id === COPY_ACTION) buttons[i].setAttribute(TEXT_ATTR, text);
      else if (id === PARAMS_ACTION) buttons[i].setAttribute(TEXT_ATTR, lines.length > 0 ? lines.join(LF) : cliTextOf(card));
    }

  function cliTextOf(card) {
    var cli = card.querySelector("." + CLI_CLASS);
    return cli ? cli.textContent : "";
  }

  /* 搜索：过滤 ＋ mark 标签高亮 ＋ 自动展开 ＋ 命中计数 ＋ 清空 ＋ 跳页。 */
  function initSearch(shell, cards) {
    var tabBar = shell.querySelector("." + TAB_BAR_CLASS);
    if (!tabBar || !tabBar.parentNode) return;
    if (shell.querySelector("." + SEARCH_BOX_CLASS)) return;
    var box = document.createElement("div");
    box.className = SEARCH_BOX_CLASS;
    var input = document.createElement("input");
    input.type = "search";
    input.className = SEARCH_INPUT_CLASS;
    input.setAttribute("placeholder", SEARCH_PLACEHOLDER);
    input.setAttribute("aria-label", SEARCH_ARIA);
    input.setAttribute("autocomplete", "off");
    var clear = document.createElement("button");
    clear.type = "button";
    clear.className = SEARCH_CLEAR_CLASS;
    clear.textContent = CLEAR_LABEL;
    clear.setAttribute("aria-label", CLEAR_ARIA);
    var count = document.createElement("span");
    count.className = HITCOUNT_CLASS;
    count.setAttribute("role", "status");
    box.appendChild(input);
    box.appendChild(clear);
    box.appendChild(count);
    tabBar.parentNode.insertBefore(box, tabBar.nextSibling);
    var state = { sheets: [], subgroups: [], pages: [], index: 0 };
    input.addEventListener("input", function () { runSearch(shell, cards, input, count, state); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      if (state.pages.length === 0) return;
      state.index = (state.index + 1) % state.pages.length;
      jumpTo(state.pages[state.index]);
    });
    clear.addEventListener("click", function () {
      input.value = "";
      runSearch(shell, cards, input, count, state);
      input.focus();
    });
  }

  function runSearch(shell, cards, input, count, state) {
    var term = input.value.replace(/^\s+|\s+$/g, "").toLowerCase();
    resetSearch(shell, cards, state);
    searchTerm = term;
    if (term === "") { count.textContent = ""; state.pages = []; state.index = 0; return; }
    var hits = [];
    var i;
    for (i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.textContent.toLowerCase().indexOf(term) < 0) { addClass(card, CARD_HIDDEN_CLASS); continue; }
      hits.push(card);
      markCard(card, term);
      var sheet = card.querySelector("." + SHEET_CLASS);
      if (sheet && !sheet.open) { sheet.open = true; state.sheets.push(sheet); }
    }
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) {
      var inner = allOf(subgroups[i], "." + CARD_CLASS);
      var visible = false;
      for (var j = 0; j < inner.length; j++) { if (hits.indexOf(inner[j]) > -1) { visible = true; break; } }
      if (visible) { if (!subgroups[i].open) { subgroups[i].open = true; state.subgroups.push(subgroups[i]); } }
      else addClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
    }
    var pages = allOf(shell, "." + PAGE_CLASS);
    var hitPages = [];
    for (i = 0; i < pages.length; i++) {
      var pageCards = allOf(pages[i], "." + CARD_CLASS);
      for (var k = 0; k < pageCards.length; k++) { if (hits.indexOf(pageCards[k]) > -1) { hitPages.push(pages[i]); break; } }
    }
    state.pages = hitPages;
    state.index = 0;
    count.textContent = hits.length > 0 ? HIT_PREFIX + hits.length + HIT_SUFFIX : HIT_EMPTY;
    jumpTo(hitPages[0]);
  }

  function resetSearch(shell, cards, state) {
    var i;
    for (i = 0; i < cards.length; i++) {
      removeClass(cards[i], CARD_HIDDEN_CLASS);
      unmarkCard(cards[i]);
    }
    for (i = 0; i < state.sheets.length; i++) state.sheets[i].open = false;
    state.sheets = [];
    for (i = 0; i < state.subgroups.length; i++) state.subgroups[i].open = false;
    state.subgroups = [];
    var subgroups = allOf(shell, "." + SUBGROUP_CLASS);
    for (i = 0; i < subgroups.length; i++) removeClass(subgroups[i], SUBGROUP_HIDDEN_CLASS);
  }

  function jumpTo(page) {
    if (!page) return;
    var radio = page.querySelector("." + TAB_INPUT_CLASS);
    if (radio && radio.checked !== true) radio.checked = true;
  }

  function markCard(card, term) {
    unmarkCard(card);
    var nodes = [];
    collectText(card, nodes);
    for (var i = 0; i < nodes.length; i++) wrapTerm(nodes[i], term);
  }

  function unmarkCard(card) {
    var marks = allOf(card, "." + CARD_MARK_CLASS);
    for (var i = 0; i < marks.length; i++) {
      var parent = marks[i].parentNode;
      if (!parent) continue;
      parent.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
      if (typeof parent.normalize === "function") parent.normalize();
    }
  }

  function collectText(root, out) {
    var kids = root.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var node = kids[i];
      if (node.nodeType === 3) { if (node.nodeValue) out.push(node); continue; }
      if (node.nodeType !== 1) continue;
      if (hasClass(node, CARD_MARK_CLASS)) continue;
      var tag = node.tagName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "INPUT") continue;
      collectText(node, out);
    }
  }

  function wrapTerm(node, term) {
    var rest = node.nodeValue;
    var at = rest.toLowerCase().indexOf(term);
    if (at < 0) return;
    var frag = document.createDocumentFragment();
    while (at > -1) {
      if (at > 0) frag.appendChild(document.createTextNode(rest.slice(0, at)));
      var mark = document.createElement("mark");
      mark.className = CARD_MARK_CLASS;
      mark.textContent = rest.slice(at, at + term.length);
      frag.appendChild(mark);
      rest = rest.slice(at + term.length);
      at = rest.toLowerCase().indexOf(term);
    }
    if (rest !== "") frag.appendChild(document.createTextNode(rest));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }

  /* 回到顶部（H-19）：scrollTop > BACKTOP_MIN_Y 才加 -show；点击平滑回顶。 */
  function initBackTop() {
    if (document.querySelector("." + BACKTOP_CLASS)) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = BACKTOP_ID;
    btn.className = BACKTOP_CLASS;
    btn.textContent = BACKTOP_LABEL;
    btn.setAttribute("aria-label", BACKTOP_ARIA);
    btn.setAttribute("title", BACKTOP_ARIA);
    btn.addEventListener("click", function () {
      var root = scrollRoot();
      if (!root) return;
      if (typeof root.scrollTo === "function") {
        try { root.scrollTo({ top: 0, behavior: "smooth" }); return; } catch (err) { root.scrollTop = 0; return; }
      }
      root.scrollTop = 0;
    });
    document.body.appendChild(btn);
    document.addEventListener("scroll", syncBackTop, true);
    syncBackTop();
  }

  function scrollRoot() {
    return document.scrollingElement || document.documentElement || document.body;
  }

  function syncBackTop() {
    var btn = document.querySelector("." + BACKTOP_CLASS);
    if (!btn) return;
    var root = scrollRoot();
    var y = root ? root.scrollTop : 0;
    if (y > BACKTOP_MIN_Y) addClass(btn, BACKTOP_SHOW_CLASS); else removeClass(btn, BACKTOP_SHOW_CLASS);
  }

  if (document.body) boot();
  else document.addEventListener("DOMContentLoaded", boot);
}());</script>
