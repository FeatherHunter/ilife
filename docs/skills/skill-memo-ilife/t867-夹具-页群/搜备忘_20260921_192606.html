<html lang="zh-CN">

<style>:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#ffffff;--line:#d2d2d7;--blue:#007aff;--blue2:#0a63ce;--soft:#f5f8ff;--ok:#34c759;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}

.hm-empty{background:#fafbfc;border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--fg2);font-size:13.5px;line-height:1.7}

.hm-empty-action{margin-top:14px}
.hm-error{background:#fff0ee;border:1.5px solid #ffc4c0;border-radius:16px;padding:20px 22px;margin:12px 0}
.hm-error-title{font-size:15px;font-weight:700;color:#a83228;margin-bottom:14px}

.hm-error .hm-actions+.hm-actions{margin-top:14px}

.hm-toast-stack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none}
.hm-toast{position:relative;transform:scale(.9);opacity:0;background:rgba(28,28,30,.94);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32);pointer-events:none;transition:opacity .22s ease-out,transform .22s}
.hm-toast.show{opacity:1;transform:scale(1);pointer-events:auto}
.hm-toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}
.hm-toast-body{flex:1;min-width:0}
.hm-toast-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hm-toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}
.hm-toast-detail{font-size:12px;line-height:1.5;color:#c8c8cc}
.hm-toast-chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0}
.hm-toast-chip.ok{background:rgba(52,199,89,.18);color:#4dd96b}
.hm-toast-chip.warn{background:rgba(255,149,0,.18);color:#ffb340}
.hm-toast-chip.danger{background:rgba(255,59,48,.18);color:#ff6961}
.hm-toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;min-height:44px;min-width:44px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}
@media(max-width:820px){.hm-toast-stack{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:none;align-items:stretch}.hm-toast{min-width:0}.hm-toast.show{transform:scale(1)}}</style>
<style>

.empty{padding:42px;text-align:center;color:var(--fg2)}button{border:0;background:var(--blue);color:var(--card);border-radius:999px;padding:8px 12px;min-height:44px;cursor:pointer}.item-head button.copy{flex:0 0 auto;min-height:44px;padding:8px 16px;font-size:13px}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:44px;font-size:15px;margin-top:12px}pre{white-space:pre-wrap;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;font-family:inherit}

#stats,#list,#data-panel{scroll-margin-top:20px}
@media(max-width:820px){.wrap{padding:28px max(14px,env(safe-area-inset-right)) 70px max(14px,env(safe-area-inset-left))}.hero{padding:26px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:30px}.item-head{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1 id="title">备忘录查询结果</h1>
<p class="lead" id="subtitle">数据加载中</p>
<p class="meta" id="meta"></p>
<nav class="jump" aria-label="页内导航"><a href="#stats">统计</a><a href="#list">结果</a><a href="#data-panel">日志</a></nav>
</header>
<section id="injectError" style="display:none"></section>
<section class="grid" id="stats"></section>
<section class="panel">
<strong>筛选与检索</strong>
<label for="filter" class="sr-only">在结果内搜索内容</label>
<input id="filter" aria-label="在结果内搜索内容" placeholder="输入关键词搜索笔记内容">
<div class="toolbar" id="chips"></div>
<div class="toolbar" id="length-mode-bar" style="display:none"><button id="lengthModeBtn" class="copy" type="button">显示全部</button><span id="lengthModeHint" class="small"></span></div>
</section>
<section id="list"></section>
<section class="panel">
<strong>筛选快照</strong>
<p class="small" style="margin-top:6px">跟随筛选与展开实时变化，可直接粘贴给助手继续下一步。这里存档的是初始的全量数据。</p>
<div class="toolbar"><button class="copy ghost" data-copy-receipt onclick="copyFiltered()">复制筛选结果</button></div>
<pre id="receipt" style="display:none"></pre>
</section>
<section class="panel" id="data-panel">
<strong>数据与日志</strong>
<p class="small" style="margin-top:6px">左边那枚存下当前结果，可粘贴到笔记存档。右边那枚给出排查用的日志，不含隐私内容。</p>
<div class="hm-actions">
<button class="copy ghost" onclick="copyData()">复制数据</button>
<button class="copy ghost" onclick="copyLog()">复制日志</button>
</div>
</section>
</div>

(function(){var stack=null,styleInjected=false;var ICONS={copy:"\uD83D\uDCCB",ok:"\u2705",warn:"\u26A0\uFE0F",danger:"\u274C",info:"\uD83D\uDCA1"};

<script>

document.getElementById('filter').addEventListener('input',e=>{appState.q=e.target.value;renderList();renderReceipt()});
document.getElementById('lengthModeBtn').addEventListener('click',toggleLengthMode);
function renderList(){var all=rowsFiltered();var totalCount=all.length;var cap=appState.showAll?totalCount:Math.min(MAX_DEFAULT,totalCount);var rows=all.slice(0,cap);var list=document.getElementById('list');if(!all.length){list.innerHTML=window.emptyState({icon:'🔍',text:'没有匹配结果',hint:'换关键词或分类再试'});document.getElementById('length-mode-bar').style.display='none';return}list.innerHTML=rows.map(renderItem).join('');var bar=document.getElementById('length-mode-bar');var btn=document.getElementById('lengthModeBtn');var hint=document.getElementById('lengthModeHint');if(totalCount>MAX_DEFAULT){bar.style.display='flex';btn.textContent=appState.showAll?`显示前 ${MAX_DEFAULT} 条`:`显示全部 (${totalCount} 条)`;hint.textContent=appState.showAll?`已展开全部 · 滚到底可看完`: `默认仅显示前 ${MAX_DEFAULT} 条`;}else{bar.style.display='none'}}
function toggleLengthMode(){appState.showAll=!appState.showAll;renderList();renderReceipt()}
function renderItem(x){var id=x.id||x.checkin_note_id||x.reminder_id||'';var content=x.content||x.checkin_content||x.reminder_content||x.note_content||'';var badges=[x.category,x.sub_category,x.repeat_type,x.due?`排期 ${x.due}`:'',x.remind_at?`提醒 ${x.remind_at}`:'',x.media_path?'附件':''].filter(Boolean);var created=String(x.created_at||x.checkin_at||'').slice(5,16);var updated=String(x.updated_at||'').slice(5,16);var timeRow=updated&&updated!==created?`<p class="small">创建于 ${esc(created)}　改于 ${esc(updated)}</p>`:`<p class="small">创建于 ${esc(created)}</p>`;return `<article class="item"><div class="item-head"><div class="id">第 ${esc(id)} 条</div><button class="copy ghost" data-item='${esc(JSON.stringify(x))}' onclick="copyInfo(this)">复制</button></div><div class="content">${esc(content)}</div><div>${badges.map(b=>`<span class="badge ${String(b).includes('排期')||String(b).includes('提醒')?'warn':''}">${esc(b)}</span>`).join('')}</div>${timeRow}</article>`}
function snapshotText(){var d=payload.data;var filtered=rowsFiltered();var meta=d.meta||{};var text=`① 场景: 我在备忘录查询页筛选出了 ${filtered.length} 条结果(共 ${dataRows().length} 条)\n\n② 数据(筛选后):`;if(!filtered.length){text+='\n    (无匹配结果 · 请调整筛选)';}filtered.forEach(function(x){text+=`\n    · #${x.id||x.checkin_note_id||x.reminder_id||''} [${esc(x.category||'未分类')}${x.sub_category?'/'+esc(x.sub_category):''}] ${esc(x.created_at||x.checkin_at||'')}\n      ${esc((x.content||x.checkin_content||'').slice(0,80))}`;});text+=`\n\n③ 期望: 请基于以上结果继续下一步(修改/删除/改分类/关联提醒等,我会补充说明)\n\n④ 来源: ${meta.command_cn||d.command||'search'} · 筛选: ${appState.category}${appState.q?' / '+appState.q:''} · ${d.generated_at||''}`;return text}
function renderReceipt(){document.getElementById('receipt').textContent=snapshotText()}
function copyInfo(btn){try{var raw=btn.getAttribute('data-item').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');var x=JSON.parse(raw);var id=x.id||x.checkin_note_id||x.reminder_id||'';var content=x.content||x.checkin_content||'';var cat=x.category||'未分类';var sub=x.sub_category?'/'+x.sub_category:'';var created=x.created_at||x.checkin_at||'';var text=`备忘录 #${id}\n分类: ${cat}${sub}\n创建: ${created}\n内容: ${content}\n`;if(x.due)text+=`排期: ${x.due}\n`;if(x.remind_at)text+=`提醒: ${x.remind_at}\n`;window.copyText(text,{silent:true});window.toast('已复制这条备忘','#'+id+' · '+content.slice(0,20),{icon:'copy'});}catch(e){window.toast('复制失败','长按选择文本手动复制',{badge:{text:'失败',type:'danger'}})}}
function copyFiltered(){var text=snapshotText();if(!text)return;var out=document.getElementById('receipt');out.textContent=text;out.style.display='block';window.copyText(text,{silent:true});window.toast('筛选结果已复制','粘贴给 AI 继续下一步',{icon:'copy'});}
function copyData(){window.copyText(window.buildDataText(payload),{silent:true});window.toast('数据已复制','人类可读快照 · 可粘贴到笔记存档',{icon:'copy'});}
function copyLog(){window.copyText(window.buildLogText(payload),{silent:true});window.toast('日志已复制','诊断信息 · 有异常时粘贴给开发者排查',{icon:'copy'});}
window.copyInfo=copyInfo;
window.copyFiltered=copyFiltered;
window.copyData=copyData;
window.copyLog=copyLog;
init();
})();
</script>
</body>
</html>
