<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>备忘录同步报告</title>
<style>:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#ffffff;--line:#d2d2d7;--blue:#007aff;--blue2:#0a63ce;--soft:#f5f8ff;--ok:#34c759;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
.hm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.hm-actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}
.hm-empty{background:#fafbfc;border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--fg2);font-size:13.5px;line-height:1.7}
.hm-empty-icon{font-size:32px;margin-bottom:8px}
.hm-empty-text{font-weight:600;color:var(--fg)}
.hm-empty-hint{font-size:12.5px;color:var(--fg3);margin-top:4px}
.hm-empty-action{margin-top:14px}
.hm-error{background:#fff0ee;border:1.5px solid #ffc4c0;border-radius:16px;padding:20px 22px;margin:12px 0}
.hm-error-title{font-size:15px;font-weight:700;color:#a83228;margin-bottom:14px}
.hm-error .hm-actions{margin-top:0}
.hm-error .hm-actions+.hm-actions{margin-top:14px}
@media(max-width:820px){.hm-error{padding:16px 14px}.hm-error-title{margin-bottom:12px}}
.hm-toast-stack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none}
.hm-toast{position:relative;transform:scale(.9);opacity:0;background:rgba(28,28,30,.94);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32);pointer-events:none;transition:opacity .22s ease-out,transform .22s}
.hm-toast.show{opacity:1;transform:scale(1);pointer-events:auto}
.hm-toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}
.hm-toast-body{flex:1;min-width:0}
.hm-toast-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hm-toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}
.hm-toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}
.hm-toast-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0}
.hm-toast-chip.ok{background:rgba(52,199,89,.18);color:#4dd96b}
.hm-toast-chip.warn{background:rgba(255,149,0,.18);color:#ffb340}
.hm-toast-chip.danger{background:rgba(255,59,48,.18);color:#ff6961}
.hm-toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}
@media(max-width:820px){.hm-toast-stack{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:none;align-items:stretch}.hm-toast{min-width:0}.hm-toast.show{transform:scale(1)}}</style>
<style>
/* ================================================================
   备忘录同步报告 · mobile-first Apple 风
   设计原则:
      1. 移动优先:480px 居中,PC 也不空(类 Apple Mail 窄列)
      2. 信息分层:首屏结论 → KPI → 按需展开明细
      3. 零假动作:没数据就不展示,无"查看""跳过"链接
      4. 原生 <details>:无 JS 折叠,移动端触控友好
      5. 自包含:零外链(飞书 webview 兼容)
      6. 状态色:绿=完成 / 橙=需注意 / 红=错误 / 灰=无变化
   ================================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--fg4:#aeaeb2;
  --bg:#f5f5f7;--card:#fff;--card2:#fbfbfd;--line:#d2d2d7;--line-soft:#e5e5ea;
  --ok:#34c759;--ok-soft:#ecfff2;--ok-fg:#178a3a;
  --warn:#ff9500;--warn-soft:#fff7e8;--warn-fg:#b25b00;
  --err:#ff3b30;--err-soft:#fff5f5;--err-fg:#c7254e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 1px 3px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06);
  --shadow-lg:0 1px 3px rgba(0,0,0,.04),0 24px 48px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--fg);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
.wrap{
  max-width:480px;
  margin:0 auto;
  padding:max(20px,env(safe-area-inset-top,0)) 16px calc(40px + env(safe-area-inset-bottom,0));
}

/* ===== 状态卡(首屏 · 结论优先) ===== */
.status-card{
  background:var(--card);
  border-radius:20px;
  padding:24px 22px;
  margin:16px 0 14px;
  box-shadow:var(--shadow-md);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.status-card.ok{background:linear-gradient(180deg,#fff 0%,#ebfaef 100%)}
.status-card.warn{background:linear-gradient(180deg,#fff 0%,#fff7e0 100%)}
.status-card.err{background:linear-gradient(180deg,#fff 0%,#ffe8e6 100%)}
.status-card.idle{background:linear-gradient(180deg,#fff 0%,#fafafa 100%)}

.status-icon{
  width:56px;height:56px;
  border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:600;
  margin-bottom:12px;
  line-height:1;
}
.status-card.ok .status-icon{background:var(--ok-soft);color:var(--ok)}
.status-card.warn .status-icon{background:var(--warn-soft);color:var(--warn)}
.status-card.err .status-icon{background:var(--err-soft);color:var(--err)}
.status-card.idle .status-icon{background:#f0f0f2;color:var(--fg3)}

.status-title{
  font-size:22px;font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:6px;
  color:var(--fg);
}
.status-desc{
  font-size:14.5px;
  color:var(--fg2);
  line-height:1.55;
  max-width:320px;
  margin:0 auto;
}
.status-meta{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line-soft);
  font-size:12px;
  color:var(--fg3);
  font-variant-numeric:tabular-nums;
}
.status-meta span+span::before{content:"·";margin:0 8px;color:var(--fg4)}

/* ===== KPI 网格(第二屏 · 数字概览) ===== */
.kpis{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:14px;
}
.kpi{
  background:var(--card);
  border-radius:16px;
  padding:16px 14px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
}
.kpi-bar{
  position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--fg4);
}
.kpi-bar.ok{background:var(--ok)}
.kpi-bar.warn{background:var(--warn)}
.kpi-bar.blue{background:var(--blue)}
.kpi-num{
  font-size:22px;font-weight:700;
  letter-spacing:-.025em;
  line-height:1;
  margin:8px 0 6px;
  color:var(--fg);
  font-variant-numeric:tabular-nums;
}
.kpi-num.zero{color:var(--fg4);font-weight:600}
.kpi-label{font-size:13px;color:var(--fg2);font-weight:500}
.kpi-hint{font-size:11px;color:var(--fg3);margin-top:3px;line-height:1.4}

/* ===== 明细卡(<details> 原生折叠) ===== */
.detail{
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
  margin-bottom:10px;
  overflow:hidden;
}
.detail summary{
  list-style:none;
  cursor:pointer;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14.5px;
  font-weight:600;
  color:var(--fg);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.detail summary::-webkit-details-marker{display:none}
.detail summary::after{
  content:"";
  margin-left:auto;
  width:8px;height:8px;
  border-right:2px solid var(--fg3);
  border-bottom:2px solid var(--fg3);
  transform:rotate(-45deg);
  transition:transform .2s;
  flex-shrink:0;
}
.detail[open] summary::after{transform:rotate(45deg)}
.detail summary:active{background:var(--card2)}
.detail-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 7px;
  border-radius:999px;
  font-size:12px;font-weight:700;
  background:#ececef;color:var(--fg2);
  font-variant-numeric:tabular-nums;
}
.detail-badge.ok{background:var(--ok-soft);color:var(--ok-fg)}
.detail-badge.warn{background:var(--warn-soft);color:var(--warn-fg)}
.detail-badge.err{background:var(--err-soft);color:var(--err-fg)}
.detail-body{
  padding:0 18px 16px;
  border-top:1px solid var(--line-soft);
  margin-top:0;
}
.detail-body p{
  font-size:13.5px;
  color:var(--fg2);
  line-height:1.65;
  padding-top:14px;
}
.detail-body p+p{padding-top:10px}
.detail-body code{
  background:var(--bg);
  padding:2px 7px;
  border-radius:5px;
  font-size:12px;
  font-family:var(--font-mono);
  color:var(--fg2);
  word-break:break-all;
}
.detail-body .note{
  color:var(--fg3);
  font-size:12px;
  font-style:italic;
  padding-top:8px;
}

/* 明细列表(变化项) */
.item-list{list-style:none;padding-top:14px}
.item-list li{
  padding:11px 0;
  border-bottom:1px solid var(--line-soft);
  font-size:14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.item-list li:last-child{border-bottom:0;padding-bottom:0}
.item-list .item-id{
  font-family:var(--font-mono);
  color:var(--fg3);
  font-size:12px;
  font-weight:600;
  flex-shrink:0;
  min-width:36px;
}
.item-list .item-content{
  flex:1;
  color:var(--fg);
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.item-list .item-mark{
  color:var(--ok);
  font-size:14px;
  font-weight:700;
  flex-shrink:0;
}
.item-list .item-mark.warn{color:var(--warn-fg)}
.item-list .item-mark.err{color:var(--err-fg)}

/* 错误列表 */
.err-list{list-style:none;padding-top:14px}
.err-list li{
  padding:10px 12px;
  background:var(--err-soft);
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
  color:var(--err-fg);
  line-height:1.55;
  word-break:break-word;
}
.err-list li:last-child{margin-bottom:0}

/* ===== 数据与日志 ===== */
.data-panel{
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
  padding:16px 18px;
  margin-top:14px;
}
.data-panel strong{font-size:14.5px}
.data-panel .hint{font-size:12px;color:var(--fg3);margin-top:6px}

/* ===== 移动端微调(已经在 480 内,只处理超小屏) ===== */
@media(max-width:360px){
  .wrap{padding:14px 12px 32px}
  .status-card{padding:20px 16px}
  .status-title{font-size:20px}
  .kpi{padding:14px 12px}
  .kpi-num{font-size:22px}
  .detail summary{padding:13px 14px;font-size:14px}
  .detail-body{padding:0 14px 14px}
}

/* ===== PC 端:480 居中,背景留白(类 Apple Mail) ===== */
@media(min-width:600px){
  .wrap{padding-top:40px}
  body{background:#ededf0}
}

/* ===== reduce motion ===== */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

</div>
</section>
</div>

function _snapOf(p){var d=(p&&p.data)||{};var s=d.scene||{};var snap=s.snapshot;if(!snap||typeof snap!=="object")throw new Error("snapshot 违规");if(typeof snap.title!=="string"||!snap.title.trim())throw new Error("snapshot 违规");if(!Array.isArray(snap.summary)||!Array.isArray(snap.sections))throw new Error("snapshot 违规");return {meta:d.meta||{},scene:s,snap:snap};}
function buildDataText(p){var v=_snapOf(p);var me=v.meta,s=v.scene,snap=v.snap;var L=["\u3010"+(me.skill_name||me.command_cn||"")+" \u00B7 "+(me.command_cn||"")+"\u3011"];L.push("\u573A\u666F: "+(me.command_cn||"")+(s.scene_id?("("+s.scene_id+")"):"")+(me.wake_word?(" \u00B7 \u5524\u9192\u8BCD\u300C"+me.wake_word+"\u300D"):""));L.push("\u65F6\u95F4: "+(me.occurred_at||""));snap.summary.forEach(function(x){L.push(_rowText(x));});snap.sections.forEach(function(sec){if(!sec.rows.length)return;L.push("\u2595"+sec.heading);sec.rows.forEach(function(r){L.push("  \u00B7 "+_rowText(r));});});return L.join("\n");}
function buildLogText(p){var v=_snapOf(p);var me=v.meta,s=v.scene;var d=(p&&p.data)||{};var cl=d.copy_log||s.copy_log||{};var L=["\u2460 \u573A\u666F\u6807\u8BC6"];L.push("  \u547D  \u4EE4: "+(me.command_cn||""));L.push("  \u5524\u9192\u8BCD: "+(me.wake_word||"(\u672A\u77E5)"));L.push("  \u573A\u666F\u540D: "+(me.command_cn||"")+(s.scene_id?("("+s.scene_id+")"):""));L.push("");L.push("\u2461 AI \u601D\u8003\u94FE");L.push("  "+(cl.thinking||"(\u672C\u5730\u6E32\u67D3 \u00B7 \u65E0 AI \u94FE)"));L.push("");L.push("\u2462 \u5E95\u5C42\u6570\u636E\u7ED3\u6784");L.push("  "+(cl.data_structure||"(\u53EA\u8BFB\u67E5\u8BE2)"));L.push("");L.push("\u2463 \u8C03\u7528\u94FE");L.push("  "+(cl.call_chain||"(\u672A\u77E5)"));L.push("");L.push("\u2464 \u65F6\u95F4\u6233 + \u7248\u672C");L.push("  \u672C\u5730\u65F6\u95F4: "+(cl.timestamp||me.occurred_at||"(\u672A\u77E5)"));L.push("  \u7248  \u672C: "+(me.skill_version||"(\u672A\u77E5)"));L.push("");L.push("\u2465 \u5F02\u5E38\u4FE1\u606F");L.push("  "+(cl.exception||"\u65E0"));return L.join("\n");}
function emptyState(cfg){cfg=cfg||{};return "<div class=\"hm-empty\">"+(cfg.icon?"<div class=\"hm-empty-icon\">"+esc(cfg.icon)+"</div>":"")+"<div class=\"hm-empty-text\">"+esc(cfg.text||"\u6682\u65E0\u6570\u636E")+"</div>"+(cfg.hint?"<div class=\"hm-empty-hint\">"+esc(cfg.hint)+"</div>":"")+(cfg.action?("<div class=\"hm-empty-action\">"+cfg.action+"</div>"):"")+"</div>";}
function errorReceipt(cfg){cfg=cfg||{};var payload=cfg.payload||window.__hmPayload||null;var dataText=cfg.data!=null?String(cfg.data):"";var logText=cfg.log!=null?String(cfg.log):"";var ok=!!(payload&&payload.data&&payload.data.scene&&payload.data.scene.snapshot);if(!dataText&&ok){try{dataText=buildDataText(payload);}catch(e){dataText="";}}if(!logText&&ok){try{logText=buildLogText(payload);}catch(e){logText="";}}var html="<div class=\"hm-error\"><div class=\"hm-error-title\">\u274C "+esc(cfg.message||"\u64CD\u4F5C\u5931\u8D25")+"</div>";if(cfg.retryPrompt){html+="<div class=\"hm-actions\"><button class=\"copy primary wide\" onclick=\"copyText(this.dataset.t)\" data-t=\""+esc(cfg.retryPrompt).replace(/"/g,"&quot;")+"\">\u4FEE\u6B63\u91CD\u8BD5</button></div>";}var btns="";if(dataText)btns+="<button class=\"copy ghost\" onclick=\"copyText(this.dataset.t)\" data-t=\""+esc(dataText).replace(/"/g,"&quot;")+"\">\u590D\u5236\u6570\u636E</button>";if(logText)btns+="<button class=\"copy ghost\" onclick=\"copyText(this.dataset.t)\" data-t=\""+esc(logText).replace(/"/g,"&quot;")+"\">\u590D\u5236\u65E5\u5FD7</button>";if(btns)html+="<div class=\"hm-actions\">"+btns+"</div>";return html+"</div>";}</script>
<script>
(function(){
"use strict";
var raw=document.getElementById("payload");
var payload=null,perr=null;
try{payload=JSON.parse(raw.textContent||"{}");}catch(e){perr=e.message;}
if(perr){document.getElementById("injectError").style.display="block";document.getElementById("injectError").innerHTML=window.errorReceipt({message:"数据解析失败",log:perr,payload:null});return;}
if(!payload||payload.status!=="ok"||!payload.data){document.getElementById("injectError").style.display="block";document.getElementById("injectError").innerHTML=window.errorReceipt({message:(payload&&payload.message)||"数据未注入",retryPrompt:"请重新运行备忘录同步(唤醒词:备忘录同步)",payload:null});return;}
window.__hmPayload=payload;

function num(v){return (typeof v==='number'&&isFinite(v))?v:0}
function fmtTime(s){
  if(!s||typeof s!=='string')return '';
  var m = s.match(/(\d{2}):(\d{2})/);
  return m ? m[1]+':'+m[2] : s;
}

function init(){
  var card = document.getElementById('statusCard');
  var icon = document.getElementById('statusIcon');
  var title = document.getElementById('statusTitle');
  var desc = document.getElementById('statusDesc');
  var meta = document.getElementById('statusMeta');

  var d = payload.data || {};
  // success: 同步报告已渲染(4 状态 fallback · success 路径)
  var synced = num(d.synced);
  var backfilled = num(d.backfilled);
  var dueAdded = num(d.due_added);
  var dueOverridden = num(d.due_overridden);
  var dueRemoved = num(d.due_removed);
  var dueChanged = dueAdded + dueOverridden + dueRemoved;
  var skippedNoLocal = num(d.skipped_no_local_note);
  var skippedNoMemo = num(d.skipped_no_memo_id);
  var skippedAlready = num(d.skipped_already_done);
  var totalSkipped = skippedNoLocal + skippedNoMemo + skippedAlready;
  var errs = (d.errors || []).length;
  var totalChanged = synced + backfilled + dueChanged;

  /* ----- 状态卡:四档(success / empty / missing_data / error) ----- */
  if(errs > 0){
    card.className = 'status-card err';
    icon.textContent = '!';
    title.textContent = '同步完成 · ' + errs + ' 个错误';
    desc.innerHTML = '同步已执行,但有 <b>' + errs + '</b> 个错误需要关注。展开下方错误明细查看详情。';
    // #299:err 态 → Base errorReceipt(修正重试 = 重新同步)
    var er = document.getElementById('errorReceipt');
    er.style.display = 'block';
    er.innerHTML = window.errorReceipt({
      message: '同步完成 · ' + errs + ' 个错误',
      retryPrompt: '请重新运行备忘录同步(唤醒词:备忘录同步)',
      payload: null
    });
  }else if(totalChanged === 0 && totalSkipped === 0){
    card.className = 'status-card idle';
    icon.textContent = '—';
    title.textContent = '完全一致 · 无变化';
    desc.textContent = '本机与飞书已同步,本次没有需要处理的变更。';
  }else if(synced > 0 || backfilled > 0){
    card.className = 'status-card ok';
    icon.textContent = '✓';
    title.textContent = '同步完成';
    var parts = [];
    if(synced > 0) parts.push('<b>' + synced + '</b> 条心愿在飞书勾选,本机已转打卡');
    if(backfilled > 0) parts.push('<b>' + backfilled + '</b> 条本机心愿补建到飞书');
    if(dueChanged > 0) parts.push('<b>' + dueChanged + '</b> 条排期已按飞书更新');
    desc.innerHTML = parts.join('<br>') + '。';
  }else{
    card.className = 'status-card warn';
    icon.textContent = '·';
    title.textContent = '同步完成 · 无变更';
    desc.innerHTML = '扫到飞书数据但本次没有实际变更。' + (totalSkipped > 0 ? '有 ' + totalSkipped + ' 条跳过,可展开查看。' : '');
  }

  /* ----- meta 行 ----- */
  function commandToChinese(c){return c==='sync-from-feishu'?'同步飞书':c}
  var metaParts = [];
  if(d.generated_at) metaParts.push('<span>' + fmtTime(d.generated_at) + '</span>');
  if(d.command) metaParts.push('<span>' + esc(commandToChinese(d.command)) + '</span>');
  meta.innerHTML = metaParts.join('');

  /* ----- KPI 网格 ----- */
  var kpis = [
    {n:synced, label:'完成同步', hint:'飞书上勾选的,本机已记为打卡', bar: synced>0?'ok':'', z:synced===0},
    {n:backfilled, label:'补建到飞书', hint:'本机心愿 → 飞书任务', bar: backfilled>0?'ok':'', z:backfilled===0},
    {n:dueChanged, label:'排期变更', hint:'已按飞书最新日期调整', bar: dueChanged>0?'warn':'', z:dueChanged===0},
    {n:totalSkipped, label:'跳过', hint:'未匹配到本机心愿', bar: totalSkipped>0?'warn':'', z:totalSkipped===0},
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function(k){
    return '<div class="kpi">' +
      '<div class="kpi-bar ' + k.bar + '"></div>' +
      '<div class="kpi-num ' + (k.z?'zero':'') + '">' + k.n + '</div>' +
      '<div class="kpi-label">' + esc(k.label) + '</div>' +
      '<div class="kpi-hint">' + esc(k.hint) + '</div>' +
    '</div>';
  }).join('');

  /* ----- 明细区(原生 details,按需展示) ----- */
  var details = [];

  // 1. 完成同步明细
  if(synced > 0){
    var items = d.synced_items || [];
    var body = '';
    if(items.length > 0){
      body = '<ul class="item-list">' + items.map(function(it){
        return '<li>' +
          '<span class="item-id">#' + esc(it.id) + '</span>' +
          '<span class="item-content">' + esc(it.content) + '</span>' +
          '<span class="item-mark">✓</span>' +
        '</li>';
      }).join('') + '</ul>';
    }else{
      body = '<p>本次有 <b>' + synced + '</b> 条心愿在飞书勾选完成,本机已转为打卡记录。</p>' +
             '<p class="note">如需查看具体心愿,可用「查心愿」唤醒词查看本机心愿清单。</p>';
    }
    details.push(makeDetail('✓ 完成同步', 'ok', synced, body, true));
  }

  // 2. 补建明细
  if(backfilled > 0){
    var body2 = '<p>本次有 <b>' + backfilled + '</b> 条本机心愿补建到飞书 task,已建立双向关联。</p>';
    details.push(makeDetail('+ 补建到飞书', 'ok', backfilled, body2));
  }

  // 3. 排期变更明细
  if(dueChanged > 0){
    var parts3 = [];
    if(dueAdded > 0) parts3.push('新增 due ' + dueAdded + ' 条');
    if(dueOverridden > 0) parts3.push('覆盖 due ' + dueOverridden + ' 条');
    if(dueRemoved > 0) parts3.push('清除 due ' + dueRemoved + ' 条');
    var body3 = '<p>本次排期变更:<b>' + parts3.join(' · ') + '</b>。</p>' +
                '<p class="note">飞书 task 的 due 时间已同步到本机心愿。飞书优先,本机跟随。</p>';
    details.push(makeDetail('📅 排期变更', 'warn', dueChanged, body3));
  }

  // 4. 跳过明细(平静展示)
  if(totalSkipped > 0){
    var skipParts = [];
    if(skippedNoLocal > 0) skipParts.push('<b>' + skippedNoLocal + '</b> 条在飞书已完成,但本机找不到对应心愿');
    if(skippedNoMemo > 0) skipParts.push('<b>' + skippedNoMemo + '</b> 条飞书 task 缺少 memo_id 字段');
    if(skippedAlready > 0) skipParts.push('<b>' + skippedAlready + '</b> 条之前已处理过');
    var body4 = '<p>本次跳过 ' + totalSkipped + ' 条:</p>' +
                '<p>' + skipParts.join(';<br>') + '。</p>';
    if(skippedNoLocal > 0){
      body4 += '<p class="note">可能你最近清理过本机库,或这些 task 是飞书原生建的。通常无需操作。如需排查可用「查心愿」唤醒词查看本机心愿清单。</p>';
    }
    details.push(makeDetail('○ 跳过', 'warn', totalSkipped, body4));
  }

  // 5. 错误明细
  if(errs > 0){
    var body5 = '<ul class="err-list">' + (d.errors||[]).map(function(e){
      return '<li>' + esc(e) + '</li>';
    }).join('') + '</ul>';
    details.push(makeDetail('⚠ 错误', 'err', errs, body5));
  }

  // 6. 全空兜底(empty 状态 · #299 Base emptyState)
  if(details.length === 0){
    details.push('<div class="detail">' + window.emptyState({
      icon: '—', text: '本次同步无任何变更或跳过', hint: '本机与飞书完全一致'
    }) + '</div>');
  }

  document.getElementById('details').innerHTML = details.join('');
}

function makeDetail(label, badgeClass, count, body, open){
  return '<details class="detail"' + (open ? ' open' : '') + '>' +
    '<summary>' +
      '<span>' + esc(label) + '</span>' +
      '<span class="detail-badge ' + badgeClass + '">' + count + '</span>' +
    '</summary>' +
    '<div class="detail-body">' + body + '</div>' +
  '</details>';
}

function copyData(){window.copyText(window.buildDataText(payload),{silent:true});window.toast('数据已复制','人类可读快照 · 可粘贴到笔记存档',{icon:'copy'});}
function copyLog(){window.copyText(window.buildLogText(payload),{silent:true});window.toast('日志已复制','诊断信息 · 有异常时粘贴给开发者排查',{icon:'copy'});}
window.copyData=copyData;
window.copyLog=copyLog;
init();
})();
</script>
</body>
</html>
