# 六家 × 三枚章的状态表 · **唯一可编辑处**。
# 改某家的章状态（tier）或卷轴里的三段文案（progress／status／plan）只改这里，
# 然后跑：node tooling/gen-seals.mjs  →  各插件 src/seal-states.generated.ts 重出。
#
# 支持的写法（够用就好，别写花活）：两级缩进（2 空格）＋ `键: 值`；不支持列表、多行、锚点。
#   tier     铜=copper／银=silver／金=gold（决定章与外框的材质，以及悬停气泡那句档位话）
#   label    印文；写 {product} 表示运行时用该家产品名（HELP 那枚＝`{product} HELP`）
#   seed     倾角与右间距的种子（0..9，各家错开用）
