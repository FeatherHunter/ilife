# ============================================================================
# 印章卷轴 · 唯一可编辑处：六家 × 三枚章（HELP／技能／插件）的状态与**全部文字**
#
# 效力  构建期生效：改完跑 `node tooling/gen-seals.mjs`，再重打＋重发受影响的包。
# 边界  只驱动「档位与文字」；控件形状（章按钮／卷轴／绦带关闭钮）由组件定稿锁死，本表不选控件。
# 合并  逐叶子覆盖：某家写了哪个键就覆盖哪个键，没写的继承 vocabulary。
# 校验  未知键／未知角色／未知档位／越界 seed／占位符放错地方，生成器直接报错，绝不静默吞。
# 占位符 {product} 只允许出现在 label 里，运行时代入该家产品名。
# 语言  每个文本叶子是 { zh, en } 两列（#1325）：zh 是原值、一字不改；en 是英文列。
#       加一门语言＝给每个叶子补一列＋改生成器的 LANGS，跑一次 `node tooling/gen-seals.mjs`。
# ============================================================================

# ── vocabulary：设计语言（六家共用）→ 生成到总管，组件直接用 ──────────────────
vocabulary:
  # 档位话：卷轴标题下那一行，同时就是鼠标悬停章的气泡（同一句话，两处渲染）。
  tierText:
    gold: { zh: 精雕细琢中, en: Fine polishing }
    silver: { zh: 全场景打通中, en: Connecting all scenarios }
    copper: { zh: 基础建设中, en: Under construction }
  # 卷轴三段的小标题；行首朱砂小印取**首字**（进展→进／状态→状／计划→计）。
  sections:
    progress: { zh: 进展, en: Progress }
    status: { zh: 状态, en: Status }
    plan: { zh: 计划, en: Plan }
  # 三枚章的印文约定；它同时是**卷轴里的标题**（卷轴标题就是同一枚章）。
  label:
    help: { zh: '{product} HELP', en: '{product} HELP' }
    skill: { zh: 技能, en: Skill }
    plugin: { zh: 插件, en: Plugin }
  # 关闭钮（右上角绦带）上的字。
  close: { zh: 收卷, en: Close }

# ── plugins：各家的章状态与卷轴正文 ──────────────────────────────────────────
plugins:

  dsh-bill-ilife:                    # 饼干记账（目录按约定推：dsh-x → packages/plugin-x）
    layout: { seed: 0 }              # 视觉用（倾角／右间距错开），0..9，一般别动
    seals:
      help:
        tier: gold                   # gold=金／silver=银／copper=铜：章面、卷轴外框、档位语金属都跟它走
        progress: { zh: '完成度 30%', en: '30% complete' }
        status: { zh: 精磨, en: Fine polish }
        plan: { zh: 将所有功能和页面打磨至完美, en: Polish every feature and page to perfection }
      skill:
        tier: silver
        progress: { zh: '完成度 80%', en: '80% complete' }
        status: { zh: 全打通, en: All connected }
        plan: { zh: 将所有功能和场景全部打通, en: Connect every feature and scenario }
      plugin:
        tier: copper
        progress: { zh: '完成度 60%', en: '60% complete' }
        status: { zh: 基本可用, en: Usable }
        plan: { zh: 修复明显bug并将未打通场景打通, en: Fix obvious bugs and connect the remaining scenarios }

